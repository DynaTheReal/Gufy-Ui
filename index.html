/* ---------- Raster ---------- */
function measureGrid(){
  const home=$('#home');let W=home.clientWidth||innerWidth,H=home.clientHeight||innerHeight-30;
  const mobile=W<=700,cols=mobile?4:Math.max(4,Math.min(8,Math.floor((W-40)/104)));
  const rowh=mobile?Math.max(88,Math.min(100,Math.floor((W-40)/4)+8)):104;
  const rows=Math.max(3,Math.floor((H-20-130)/rowh));
  GRID={cols,rows,rowh};
  const t=$('#track');t.style.setProperty('--cols',cols);t.style.setProperty('--rowh',rowh+'px');
}
const cellsOf=id=>!isW(id)?1:(S.widgets[id]?.size==='l'?2*Math.min(4,GRID.cols):4);
const pageCap=()=>GRID.cols*GRID.rows;
const usedCells=p=>p.reduce((a,id)=>a+cellsOf(id),0);
function cascade(L){for(let i=0;i<L.length;i++){while(usedCells(L[i])>pageCap()&&L[i].length>1){const x=L[i].pop();(L[i+1]??=[]).unshift(x)}}}
const homeIds=()=>{const inF=new Set(inFolders());return Object.keys(S.widgets||{}).concat(Object.keys(S.folders||{}),CORE.filter(id=>!inF.has(id)),S.installed.filter(id=>APPS[id]&&!inF.has(id)))};
function normLayout(){
  cleanFolders();
  const want=homeIds(),seen=new Set();
  let L=(S.layout||[]).map(p=>p.filter(id=>want.includes(id)&&!seen.has(id)&&seen.add(id)));
  if(!L.length)L=[[]];
  want.forEach(id=>{if(seen.has(id))return;seen.add(id);let k=L.findIndex(p=>usedCells(p)+cellsOf(id)<=pageCap());if(k<0){L.push([]);k=L.length-1}L[k].push(id)});
  cascade(L);
  if(!editMode)L=L.filter((p,i)=>i===0||p.length);
  S.layout=L;
}
function itemHTML(id){
  const ph=id===dragId?' ph':'';
  if(isW(id)){const w=S.widgets[id],T=WTYPES[w.type];if(!T)return'';const o=T.open()||'';
    return `<div class="hitem wdg ${w.size}${ph}" data-id="${id}" data-type="${w.type}" data-open="${o}"><span class="del" data-delid="${id}">−</span><div class="wbox">${widgetBody(w.type,w.size)}</div></div>`}
  if(isF(id)){const f=S.folders[id];if(!f)return'';
    return `<div class="hitem appicon folder${ph}" data-id="${id}"><span class="del" data-delid="${id}">−</span><div class="ic fic">${f.apps.slice(0,9).map(a=>`<i style="background:${APPS[a].bg}">${APPS[a].icon}</i>`).join('')}</div><span class="lbl">${esc(f.name)}</span></div>`}
  const a=APPS[id];
  return `<div class="hitem appicon${ph}" data-id="${id}">${id==='settings'&&pendingUpdate()?'<span class="badge">1</span>':''}${CORE.includes(id)?'':`<span class="del" data-delid="${id}">−</span>`}<div class="ic" style="background:${a.bg}">${a.icon}</div><span class="lbl">${a.name}</span></div>`;
}
function renderHome(){
  measureGrid();normLayout();
  const pages=S.layout.map(p=>p.slice());
  if(editMode&&pages[pages.length-1].length)pages.push([]);
  homePage=Math.max(0,Math.min(homePage,pages.length-1));
  const t=$('#track');
  t.innerHTML=pages.map((p,i)=>`<div class="page" data-p="${i}"><div class="apps">${p.map(itemHTML).join('')}</div></div>`).join('');
  $('#home').classList.toggle('edit',editMode);
  drawDots(pages.length);setTrack(0,false);updUndo();
  tick();renderBattery();updateCoins();updateWidgets(t);
}
function drawDots(n){n=n||$$('#track .page').length;$('#dots').innerHTML=n>1?Array.from({length:n},(_,i)=>`<i class="${i===homePage?'on':''}"></i>`).join(''):''}
let trackW=0;
function setTrack(dx,drag){const t=$('#track');if(!drag||!trackW)trackW=$('#home').clientWidth;if(t.classList.contains('drag')!==!!drag)t.classList.toggle('drag',!!drag);t.style.transform=`translate3d(${-homePage*trackW+dx}px,0,0)`}
/* Feder-Physik: die Seite gleitet mit genau der Geschwindigkeit des Fingers weiter (kein Ruck beim Loslassen) */
let springRaf=0;
function springTo(target,startDx,velPxMs){
  cancelAnimationFrame(springRaf);
  const t=$('#track'),W=trackW||$('#home').clientWidth,old=homePage;
  let x=-old*W+startDx,v=velPxMs*1000;const xT=-target*W;
  homePage=target;if(old!==target)haptic('select');drawDots();
  t.classList.add('drag');
  const K=210,C=2*Math.sqrt(K)*1.02; // fast kritisch gedämpft
  let last=performance.now();
  const step=now=>{
    let dt=Math.min(.032,(now-last)/1000);last=now;
    for(let i=0;i<2;i++){const h=dt/2,a=-K*(x-xT)-C*v;v+=a*h;x+=v*h}
    if(Math.abs(x-xT)<.4&&Math.abs(v)<15){t.style.transform=`translate3d(${xT}px,0,0)`;springRaf=0;t.classList.remove('drag');return}
    t.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;springRaf=requestAnimationFrame(step);
  };
  springRaf=requestAnimationFrame(step);
}
function goPage(i){const n=$$('#track .page').length,old=homePage;homePage=Math.max(0,Math.min(n-1,i));if(old!==homePage)haptic('select');setTrack(0,false);drawDots(n)}
/* Rückgängig beim Bearbeiten */
let undoStack=[];
const snapHome=()=>JSON.stringify({l:S.layout,f:S.folders||{},w:S.widgets||{},i:S.installed});
function pushUndo(){const s=snapHome();if(undoStack[undoStack.length-1]!==s)undoStack.push(s);if(undoStack.length>40)undoStack.shift();updUndo()}
function updUndo(){const b=$('#editUndo');if(!b)return;const cur=snapHome();b.classList.toggle('off',!undoStack.some(x=>x!==cur))}
function undoEdit(){
  const cur=snapHome();while(undoStack.length&&undoStack[undoStack.length-1]===cur)undoStack.pop();
  const s=undoStack.pop();if(!s){haptic('error');return}
  const o=JSON.parse(s);S.layout=o.l;S.folders=o.f;S.widgets=o.w;S.installed=o.i;
  closeFolder&&$('#fold')&&$('#fold').classList.contains('open')&&closeFolder();
  haptic('select');flipRender();save();updUndo();
}
function enterEdit(){
  if(editMode)return;editMode=true;haptic('heavy');undoStack=[];
  renderHome();const h=$('#home');h.classList.remove('edit');void h.offsetWidth;
  h.classList.add('editing');requestAnimationFrame(()=>{h.classList.add('edit')});
  setTimeout(()=>h.classList.remove('editing'),420);
}

  if(!editMode)return;editMode=false;closeWSheet();haptic();
  const h=$('#home');h.classList.add('editing');h.classList.remove('edit');
  setTimeout(()=>{h.classList.remove('editing');if(!editMode){renderHome();save()}},380);

/* FLIP: Elemente gleiten flüssig an ihren neuen Platz */
function flipRender(){
  const before={};$$('#track .hitem').forEach(el=>before[el.dataset.id]=el.getBoundingClientRect());
  renderHome();
  $$('#track .hitem').forEach(el=>{const b=before[el.dataset.id];if(!b)return;const a=el.getBoundingClientRect(),dx=b.left-a.left,dy=b.top-a.top;
    if(!dx&&!dy)return;el.animate([{transform:`translate3d(${dx}px,${dy}px,0)`},{transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.9,.22,1)'})});
}
function findPos(id){for(let p=0;p<S.layout.length;p++){const i=S.layout[p].indexOf(id);if(i>=0)return[p,i]}return[-1,-1]}
function moveBefore(id,target){
  const[pa,ia]=findPos(id),[pb,ib]=findPos(target);if(pa<0||pb<0)return;
  S.layout[pa].splice(ia,1);
  const[pb2,ib2]=findPos(target);
  S.layout[pb2].splice(pa===pb&&ia<ib?ib2+1:ib2,0,id);
  cascade(S.layout);flipRender();
}
function moveToPage(id,p){
  const[pa,ia]=findPos(id);if(pa<0)return;
  S.layout[pa].splice(ia,1);
  while(S.layout.length<=p)S.layout.push([]);
  S.layout[p].push(id);cascade(S.layout);homePage=p;flipRender();
}

/* Ziehen */
function startDrag(id,e){
  pushUndo();
  G.mode='drag';dragId=id;lastTarget=null;
  const src=$(`#track .hitem[data-id="${id}"]`);if(!src)return;
  const r=src.getBoundingClientRect();
  dragEl=src.cloneNode(true);dragEl.classList.add('dragclone');dragEl.style.width=r.width+'px';dragEl.style.height=r.height+'px';
  dragOff={x:e.clientX-r.left,y:e.clientY-r.top};
  document.body.append(dragEl);src.classList.add('ph');haptic();
  moveDrag(e);
}
function moveDrag(e){
  dragPos={x:e.clientX,y:e.clientY};
  if(dragRaf)return;
  dragRaf=requestAnimationFrame(()=>{
    dragRaf=0;if(!dragEl)return;
    const{x,y}=dragPos;
    dragEl.style.transform=`translate3d(${x-dragOff.x}px,${y-dragOff.y}px,0)`;
    const W=innerWidth;
    if(x<26||x>W-26){if(!edgeT)edgeT=setTimeout(()=>{edgeT=null;if(!dragId)return;
        const n=$$('#track .page').length,np=x<26?homePage-1:homePage+1;
        if(np>=0&&np<n)moveToPage(dragId,np)},550)}
    else if(edgeT){clearTimeout(edgeT);edgeT=null}
    const over=document.elementFromPoint(x,y),t=over&&over.closest('#track .hitem');
    const canFold=!isW(dragId)&&!isF(dragId);
    if(t&&t.dataset.id!==dragId){
      const tid=t.dataset.id,tApp=!isW(tid);let inIcon=false;
      if(canFold&&tApp){const ic=$('.ic',t);if(ic){const r=ic.getBoundingClientRect(),m=r.width*.1;inIcon=x>r.left+m&&x<r.right-m&&y>r.top+m&&y<r.bottom-m}}
      if(inIcon){clearReorder();if(foldId!==tid)setFold(t)}
      else{clearFold();
        if(lastTarget!==tid){
          if(!(canFold&&tApp)){clearReorder();lastTarget=tid;moveBefore(dragId,tid)}
          else if(reId!==tid){clearReorder();reId=tid;reT=setTimeout(()=>{reT=null;reId=null;if(!dragId)return;lastTarget=tid;moveBefore(dragId,tid)},230)}
        }}
    }
    else if(!t){lastTarget=null;clearFold();clearReorder();
      const pg=over&&over.closest('#track .page');
      if(pg&&+pg.dataset.p!==findPos(dragId)[0]&&+pg.dataset.p===homePage)moveToPage(dragId,homePage);}
  });
}
let foldId=null,foldT=null,reT=null,reId=null;
function clearReorder(){clearTimeout(reT);reT=null;reId=null}
function setFold(t){
  clearFold();foldId=t.dataset.id;t.classList.add('fhover');
  const ic=$('.ic',t);if(ic){const a=ic.getBoundingClientRect(),b=t.getBoundingClientRect(),d=Math.max(a.width,a.height)+22;
    t.insertAdjacentHTML('beforeend',`<b class="fprog" style="left:${a.left-b.left+a.width/2-d/2}px;top:${a.top-b.top+a.height/2-d/2}px;width:${d}px;height:${d}px"></b>`)}
  if(dragEl)dragEl.classList.add('folding');haptic('select');
  foldT=setTimeout(()=>{const src=dragId,tgt=foldId;clearFold();if(src&&tgt)makeFolder(src,tgt)},2000);
}
function clearFold(){
  clearTimeout(foldT);foldT=null;
  if(foldId){const el=$(`#track .hitem[data-id="${foldId}"]`);if(el){el.classList.remove('fhover');$$('.fprog',el).forEach(x=>x.remove())}}
  if(dragEl)dragEl.classList.remove('folding');
  foldId=null;
}
function makeFolder(src,tgt){
  const[ps,is]=findPos(src),[pt,it]=findPos(tgt);if(ps<0||pt<0)return;
  let fid=tgt;
  if(isF(tgt)){S.folders[tgt].apps.push(src);S.layout[ps].splice(is,1)}
  else{
    const ca=APPS[src].cat,cb=APPS[tgt].cat;
    fid='f-'+Date.now().toString(36);
    S.folders[fid]={name:ca&&ca===cb?ca:'Ordner',apps:[tgt,src]};
    S.layout[pt][it]=fid;
    const[ps2,is2]=findPos(src);S.layout[ps2].splice(is2,1);
  }
  // Ziehen beenden: Kopie fliegt in den Ordner
  const el=dragEl;dragEl=null;dragId=null;if(G)G.mode='none';
  haptic('success');flipRender();save();
  const f=$(`#track .hitem[data-id="${fid}"] .ic`);
  if(el){const r=f?f.getBoundingClientRect():null;
    el.animate([{transform:el.style.transform,opacity:1},{transform:r?`translate3d(${r.left}px,${r.top}px,0) scale(.3)`:el.style.transform,opacity:0}],{duration:260,easing:'cubic-bezier(.2,.9,.22,1)',fill:'forwards'}).onfinish=()=>el.remove()}
  if(f)f.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:380,easing:SPRING});
  if(!isF(tgt))setTimeout(()=>openFolder(fid,true),320);
}
/* Ordner öffnen */
function openFolder(fid,rename){
  const f=S.folders[fid];if(!f)return;
  let ov=$('#fold');if(!ov){ov=document.createElement('div');ov.id='fold';document.body.append(ov)}

    const g=S.folders[fid];if(!g){closeFolder();return}
    ov.innerHTML=`<div class="fbox"><input class="fname" id="fName" maxlength="20" value="${esc(g.name)}" spellcheck="false">
      <div class="fgrid">${g.apps.map(a=>`<button class="fapp" data-a="${a}">${editMode?`<span class="fout" data-out="${a}">↥</span>`:''}<div class="ic" style="background:${APPS[a].bg}">${APPS[a].icon}</div><span>${esc(APPS[a].name)}</span></button>`).join('')}</div>
      <p class="fhint">${editMode?'↥ nimmt eine App aus dem Ordner':'Tippe auf den Namen, um ihn zu ändern'}</p></div>`;
    const inp=$('#fName',ov);

    inp.onblur=()=>{if(!g.name.trim()){g.name='Ordner';inp.value='Ordner';save()}renderHome()};

function closeFolder(){const ov=$('#fold');if(!ov||!ov.classList.contains('open'))return;const a=document.activeElement;if(a&&a.blur)a.blur();

function dissolveFolder(fid){

/* Kontextmenü (Gedrückthalten) */
function openCtx(el){
  const id=el.dataset.id,m=$('#ctxmenu');
  if(isW(id)){
    const w=S.widgets[id],T=WTYPES[w.type],o=T.open();
    m.innerHTML=`${o?`<button data-c="open">Öffnen <span>${APPS[o].icon}</span></button>`:''}${T.sizes.length>1?`<button data-c="size">${w.size==='s'?'Größer machen':'Kleiner machen'} <span>↔️</span></button>`:''}<button data-c="edit">Home-Bildschirm bearbeiten <span>✏️</span></button><button data-c="del" class="red">Widget entfernen <span>🗑️</span></button>`;
  }else if(isF(id)){
    m.innerHTML=`<button data-c="open">Öffnen <span>📂</span></button><button data-c="ren">Umbenennen <span>✏️</span></button><button data-c="edit">Home-Bildschirm bearbeiten <span>📱</span></button><button data-c="del" class="red">Ordner auflösen <span>🗂️</span></button>`;
  }else{
    const a=APPS[id];
    m.innerHTML=`<button data-c="open">Öffnen <span>${a.icon}</span></button><button data-c="edit">Home-Bildschirm bearbeiten <span>✏️</span></button>${CORE.includes(id)?'':`<button data-c="del" class="red">App entfernen <span>🗑️</span></button>`}`;
  }
  m.classList.add('open');
  const r=el.getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight;
  let x=Math.min(innerWidth-mw-10,Math.max(10,r.left)),y=r.bottom+8,up=false;if(y+mh>innerHeight-10){y=r.top-mh-8;up=true}

/* Gesten */
(function(){
  const home=$('#home');
  home.addEventListener('contextmenu',e=>e.preventDefault());
  home.addEventListener('pointerdown',e=>{
    if(e.button>0||current!=='desktop')return;
    if(e.target.closest('.editbar'))return;
    closeCtx();
    const item=e.target.closest('#track .hitem');
    G={x:e.clientX,y:e.clientY,item,id:item&&item.dataset.id,mode:null,del:e.target.closest('[data-delid]')};
    try{home.setPointerCapture(e.pointerId)}catch(_){}
    if(G.del){G.mode='del';return}
    if(editMode){if(item)G.mode='maybe';return}
    G.lp=setTimeout(()=>{if(!G||G.mode)return;
      if(item){G.mode='menu';item.classList.add('lifted');openCtx(item);haptic('heavy')}
      else{G.mode='none';enterEdit()}},450);
  });
  home.addEventListener('pointermove',e=>{
    if(!G)return;
    const dx=e.clientX-G.x,dy=e.clientY-G.y,dist=Math.hypot(dx,dy);
    if(G.mode==='drag')return moveDrag(e);
    if(G.mode==='swipe'){
      const n=G.n||(G.n=$$('#track .page').length);let d=dx;
      if((homePage===0&&d>0)||(homePage===n-1&&d<0))d*=.3;
      const now=performance.now(),iv=(e.clientX-(G.lx??G.x))/Math.max(1,now-(G.lt??now-16));G.v=G.v===undefined?iv:G.v*.6+iv*.4;G.lx=e.clientX;G.lt=now;
      G.sd=d;if(!G.raf)G.raf=requestAnimationFrame(()=>{if(G){G.raf=0;setTrack(G.sd,true)}});return;
    }
    if(G.mode==='menu'&&dist>10){closeCtx();enterEdit();return startDrag(G.id,e)}
    if(G.mode==='maybe'&&dist>6)return startDrag(G.id,e);
    if(!G.mode&&dist>8){clearTimeout(G.lp);G.mode=Math.abs(dx)>Math.abs(dy)?'swipe':'none'}
    else if(editMode&&!G.item&&!G.mode&&dist>8)G.mode='swipe';
  });
  const up=(e,cancel)=>{
    if(!G)return;clearTimeout(G.lp);
    const g=G;G=null;
    const dx=(e.clientX||g.x)-g.x,W=home.clientWidth;
    if(g.mode==='swipe'){
      if(g.raf)cancelAnimationFrame(g.raf);
      const v=g.v||0,n=$$('#track .page').length;let tgt=homePage;
      if(!cancel&&(dx<-W*.16||v<-.3))tgt=homePage+1;else if(!cancel&&(dx>W*.16||v>.3))tgt=homePage-1;
      tgt=Math.max(0,Math.min(n-1,tgt));
      springTo(tgt,g.sd??dx,cancel?0:v);return;
    }
    if(g.mode==='drag')return endDrag();
    if(cancel)return;
    if(g.mode==='del')return confirmDelete(g.del.dataset.delid);
    if(g.mode==='maybe'&&g.id&&isF(g.id))return openFolder(g.id);
    if(g.mode)return;
    if(editMode){if(!g.item)exitEdit();return}
    if(!g.item)return;
    if(isW(g.id)){const o=g.item.dataset.open;if(o)openApp(o);return}
    if(isF(g.id))return openFolder(g.id);
    openApp(g.id);
  };
  home.addEventListener('pointerup',e=>up(e,false));
  home.addEventListener('pointercancel',e=>up(e,true));
  let wheelLock=0;
  home.addEventListener('wheel',e=>{const now=Date.now();if(now<wheelLock)return;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<25)return;wheelLock=now+450;goPage(homePage+(d>0?1:-1))},{passive:true});
  $('#editDone').onclick=exitEdit;
  $('#editAdd').onclick=()=>{haptic();openWSheet()};
  $('#editUndo').onclick=undoEdit;
  $('#wscrim').onclick=closeWSheet;
  let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(current==='desktop')renderHome();else setTrack(0,false)},150)});
})();

const snapCoins=(raw,diff)=>COINSTEPS[diff].reduce((b,v)=>Math.abs(v-raw)<Math.abs(b-raw)?v:b);

const nice=n=>n<20?n:n<100?Math.round(n/5)*5:n<1000?Math.round(n/10)*10:Math.round(n/500)*500;
function genQuest(diff,avoid,kind){
  let q;
  const own=(S.customQ||[]).filter(x=>x.diff===diff);
  for(let k=0;k<40;k++){
    if(!kind&&own.length&&Math.random()<.3){
      const o=own[rnd(0,own.length-1)];q={i:o.i,title:o.title,coins:o.coins,tag:'own'};
    }else if(kind==='sport'||(!kind&&Math.random()<.2)){
      const tpl=QT[rnd(0,QT.length-1)],[a,b]=tpl.r[diff],n=nice(rnd(a,b));
      q={i:tpl.i,title:tpl.t(n),coins:snapCoins(tpl.cv[diff],diff),tag:tpl.g,hint:tpl.h||''};
    }else{
      let L=QF[diff];
      if(kind==='parents')L=L.filter(f=>f[3]);else if(kind==='fun')L=L.filter(f=>!f[3]);
      const f=L[rnd(0,L.length-1)];
      q={i:f[0],title:f[1],coins:f[2],tag:f[3]?'parents':'fun'};
    }
    if(!avoid.some(x=>x.title===q.title||x.i===q.i))break;
  }
  if(q.tag!=='own')q.coins=QUEST_PAY(q.coins);
  q.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);q.diff=diff;q.done=false;q.kind=kind||'';
  return q;
}

function failDebt(d){d.status='failed';S.coins=-1000;save();updateCoins();haptic('error');
  notify('💸','Schuld nicht erledigt',`„${d.title}“ wurde nicht gemacht – Coins auf −1.000.`,'#ff453a')}

// 5 Tagesquests: genau 1× Sport, immer 1× mit den Eltern, Rest witzig/peinlich
const DAILY_SLOTS=[['extrem','fun'],['schwer','parents'],['schwer','sport']];
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function ensureQuests(){
  // alte eigene Quests anpassen (keine "Leicht"-Stufe, keine 25 Coins mehr)
  (S.customQ||[]).forEach(o=>{if(!COINSTEPS[o.diff])o.diff='mittel';if(!S.payV2&&o.coins>=50)o.coins=QUEST_PAY(o.coins)});
  // einmalig: offene Quests von heute auf die neuen Belohnungen umrechnen
  if(!S.payV3){(S.daily?S.daily.list:[]).concat(S.customQ||[]).forEach(q=>{if(!q.done)q.coins=roundPay(q.coins)});S.payV3=S.payV2=true;save()}
  if(!S.payV2){if(S.daily)S.daily.list.forEach(q=>{if(!q.done&&q.coins>=50)q.coins=QUEST_PAY(q.coins)});S.payV2=true;save()}
  if(S.daily&&S.daily.day===dayKey()&&!S.questsV7){ // schwerere Tagesquests: offene heute neu würfeln
    const L=S.daily.list;DAILY_SLOTS.forEach(([d,k],i)=>{if(L[i]&&!L[i].done)L[i]=genQuest(d,L.filter((_,j)=>j!==i),k)});
    S.questsV7=S.questsV6=true;S.daily.v=2;save();
  }
  if(S.daily&&S.daily.day===dayKey()&&S.daily.v===2&&!S.questsV6){ // neue Quests & Stufen: offene heute neu würfeln
    const L=S.daily.list;DAILY_SLOTS.forEach(([d,k],i)=>{if(L[i]&&!L[i].done)L[i]=genQuest(d,L.filter((_,j)=>j!==i),k)});
    (S.customQ||[]).forEach(o=>o.coins=roundPay(o.coins));S.questsV6=true;save();
  }
  if(!S.daily||S.daily.day!==dayKey()){
    const list=[];DAILY_SLOTS.forEach(([d,k])=>list.push(genQuest(d,list,k)));
    S.daily={day:dayKey(),list,v:2};S.questsV6=S.questsV7=true;save();
  }else if(S.daily.v!==2){ // heutige Liste an die neuen Regeln anpassen, Erledigtes bleibt
    const L=S.daily.list;
    DAILY_SLOTS.forEach(([d,k],i)=>{const q=L[i];
      const ok=q&&(q.done||(q.diff===d&&(q.kind===k||(k==='fun'&&q.tag==='fun')||(k==='sport'&&q.tag==='sport'))&&!(q.tag==='sport'&&k!=='sport')));
      if(!ok)L[i]=q&&q.done?q:genQuest(d,L.filter((_,j)=>j!==i),k)});
    L.length=DAILY_SLOTS.length;
    if(L.filter(q=>q.tag==='sport').length>1)L.forEach((q,i)=>{if(q.tag==='sport'&&!q.done)L[i]=genQuest(q.diff,L,'fun')});
    S.daily.v=2;save();
  }
  if(S.daily&&S.daily.list.length!==DAILY_SLOTS.length){ // 3 Quests pro Tag: Erledigtes bleibt, Rest passend auffüllen
    const L=S.daily.list,used=new Set(),out=[];
    L.forEach((q,i)=>{if(q.done&&out.length<DAILY_SLOTS.length){out.push(q);used.add(i)}});
    DAILY_SLOTS.slice(out.length).forEach(([d,k])=>{let j=L.findIndex((q,i)=>!used.has(i)&&q.diff===d&&(q.kind===k||q.tag===k));
      if(j>=0){used.add(j);out.push(L[j])}else out.push(genQuest(d,out,k))});
    S.daily.list=out;save();
  }
  // Reparatur: „erledigt“ ohne Eintrag im Verlauf (= ohne Coins) → wieder offen
  if(S.daily&&S.histClr!==dayKey()){
    const h=(S.questDone||[]).filter(e=>dayKey(new Date(e.t))===S.daily.day);let fix=0;
    S.daily.list.forEach(q=>{if(q.done&&!h.some(e=>(e.id&&e.id===q.id)||e.title===q.title)){q.done=false;fix++}});
    if(fix)save();
  }
}

  /* ---------- Echte Karte (Leaflet + OpenStreetMap/CARTO/Esri) ---------- */
  // Standard: Satellit mit Straßennamen (braucht keinen API-Key). „Karte“ (CARTO) ist optional;
  // lädt sie nicht oder fehlt ein Zugang, schaltet GufyUI automatisch zurück auf Satellit.
  function setTiles(){
    if(!map)return;
    [tiles,labels].forEach(l=>l&&map.removeLayer(l));labels=null;
    const ly=$('#lLayer',body);if(ly){ly.classList.toggle('on',!sat);ly.textContent=sat?'🗺️':'🛰️';ly.title=sat?'Karte':'Satellit'}
    if(sat){
      let sok=0,sbad=0;
      tiles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});
      tiles.on('tileload',()=>sok++);
      tiles.on('tileerror',()=>{sbad++;if(sbad>=3&&sok===0){destroyMap();embedMap()}});
      tiles.addTo(map);
      labels=L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.85}),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]).addTo(map);
      return;
    }
    let ok=0,bad=0;
    tiles=L.tileLayer(`https://{s}.basemaps.cartocdn.com/${S.theme==='dark'?'dark_all':'rastertiles/voyager'}/{z}/{x}/{y}{r}.png`,{maxZoom:20,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
    tiles.on('tileload',()=>ok++);
    tiles.on('tileerror',()=>{bad++;if(bad>=2&&ok===0){sat=true;S.mapSat=true;save();setTiles();notify('🛰️','Satellit aktiv','Die Karte ist hier nicht verfügbar – Satellit ist eingeschaltet.','#0a84ff')}});
    tiles.addTo(map);
  }
  function initMap(){
    loadLeaflet().then(()=>{
      const el=$('#lMap',body);if(!el||map)return;
      el.innerHTML='';
      map=L.map(el,{zoomControl:false,attributionControl:true,zoomSnap:.5}).setView(geoPos?[geoPos.lat,geoPos.lon]:S.loc.home?[S.loc.home.lat,S.loc.home.lon]:[51.16,10.45],geoPos||S.loc.home?15:5);
      map.attributionControl.setPrefix('');
      setTiles();updateMap();
      setTimeout(()=>map&&map.invalidateSize(),460);
    }).catch(()=>embedMap());
  }
  function embedMap(){ // einfache OpenStreetMap-Karte als Ausweich
    const el=$('#lMap',body);if(!el)return;
    const c=geoPos||S.loc.home;if(!c){el.innerHTML='<div class="mapload">Warte auf Standort …</div>';return}
    const d=Math.max(.004,S.loc.radius/50000);const m=geoPos?`&marker=${geoPos.lat},${geoPos.lon}`:'';
    el.innerHTML=`<iframe class="mapframe" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${c.lon-d*1.6},${c.lat-d},${c.lon+d*1.6},${c.lat+d}&layer=mapnik${m}"></iframe>`;
    const btns=$('.mapbtns',body);if(btns)btns.style.display='none';
  }
  function destroyMap(){if(map){map.remove();map=null;tiles=labels=me=acc=homeM=homeC=null;fitted=false}}
  function updateMap(){
    if(!map)return;
    const pts=[];
    if(S.loc.home){
      const h=[S.loc.home.lat,S.loc.home.lon];pts.push(h);
      const col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#4f8cff';
      if(!homeC)homeC=L.circle(h,{radius:S.loc.radius,color:col,weight:2,fillColor:col,fillOpacity:.14,dashArray:'6 6'}).addTo(map);else{homeC.setLatLng(h);homeC.setRadius(S.loc.radius)}
      if(!homeM)homeM=L.marker(h,{icon:L.divIcon({className:'',html:'<div class="mhome">🏠</div>',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(map);else homeM.setLatLng(h);
    }
    if(geoPos){
      const p=[geoPos.lat,geoPos.lon];pts.push(p);
      if(!acc)acc=L.circle(p,{radius:geoPos.acc,color:'#0a84ff',weight:0,fillOpacity:.12,interactive:false}).addTo(map);else{acc.setLatLng(p);acc.setRadius(geoPos.acc)}
      if(!me)me=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="mdot"><i></i></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:500}).addTo(map);else me.setLatLng(p);
    }
    if(!fitted&&pts.length){
      fitted=true;
      if(homeC&&geoPos){const b=homeC.getBounds().extend(pts[pts.length-1]);map.flyToBounds(b,{padding:[34,34],duration:.8,maxZoom:17})}
      else if(homeC)map.flyToBounds(homeC.getBounds(),{padding:[34,34],duration:.8});
      else map.flyTo(pts[0],16,{duration:.8});
    }
  }
  function refresh(){
    const s=$('#lStat',body);if(!s)return;
    if(!map&&S.loc.mode==='gps'&&$('#lMap iframe',body)===null&&!(window.L&&L.map)&&geoPos){const el=$('#lMap',body);if(el&&!el.dataset.tried){el.dataset.tried=1;initMap()}}
    s.innerHTML=statusHTML();
    if(S.loc.mode!=='gps'){$('#lGps',body).innerHTML=gpsHTML();bindGps();return}
    const inf=$('#lInfo',body);if(inf)inf.innerHTML=infoHTML();
    const st=$('#lSet',body);if(st)st.disabled=!geoPos;
    updateMap();
  }
  ctx.refresh=refresh;
  if(S.loc.mode==='gps')startGeo();
  draw();
  const iv=setInterval(()=>{const s=$('#lStat',body);if(s)s.innerHTML=statusHTML()},15000);
  ctx.cleanup.push(()=>{clearInterval(iv);destroyMap()});
}},

calc:{name:'Rechner',cat:'Werkzeuge',full:true,store:true,icon:'🧮',bg:'linear-gradient(135deg,#3a3a3c,#000)',w:340,h:540,
render(body,ctx){
  const K=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],[','],['=','op']];
  body.innerHTML=`<div class="calc"><div class="disp"><div class="expr"></div><div class="val">0</div></div><div class="keys">${K.map(k=>`<button class="${k[1]||''}" data-k="${k[0]}">${k[0]}</button>`).join('')}</div></div>`;
  let cur='0',prev=null,op=null,fresh=false;
  const val=$('.val',body),ex=$('.expr',body);
  const fmt=n=>{if(!isFinite(n))return 'Fehler';return String(parseFloat(n.toPrecision(12)))};
  const show=()=>{val.textContent=cur.replace('.',',');ex.textContent=prev!==null&&op?fmt(prev).replace('.',',')+' '+op:'';
    $$('.op',body).forEach(b=>b.classList.toggle('sel',b.dataset.k===op&&fresh))};
  const compute=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?a/b:b;
  function press(k){
    if(/^[0-9]$/.test(k)){if(fresh||cur==='0'){cur=k}else if(cur.length<15)cur+=k;fresh=false}
    else if(k===','){if(fresh){cur='0';fresh=false}if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){cur='0';prev=null;op=null;fresh=false}
    else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):(cur==='0'?'0':'-'+cur)}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100)}
    else if(k==='='){if(op!==null&&prev!==null){cur=fmt(compute(prev,parseFloat(cur),op));prev=null;op=null;fresh=true}}
    else{ if(op&&!fresh&&prev!==null){cur=fmt(compute(prev,parseFloat(cur),op))} prev=parseFloat(cur);op=k;fresh=true }
    show();
  }
  $$('[data-k]',body).forEach(b=>b.onclick=()=>press(b.dataset.k));
  const kd=e=>{if(curApp()!=='calc')return;const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=',',':',','.':',','Escape':'AC','Backspace':'BS'};
    if(/^[0-9]$/.test(e.key))press(e.key);else if(m[e.key]==='BS'){cur=cur.length>1?cur.slice(0,-1):'0';show()}else if(m[e.key])press(m[e.key])};
  addEventListener('keydown',kd);ctx.cleanup.push(()=>removeEventListener('keydown',kd));
}},

clock:{name:'Uhr',cat:'Werkzeuge',full:true,store:true,icon:'⏰',bg:'linear-gradient(135deg,#2c3e50,#000)',w:440,h:580,
render(body,ctx){
  body.innerHTML=`<div class="fill"><div class="tabs"><button data-c="clock" class="on">🕐 Uhr</button><button data-c="sw">⏱️ Stoppuhr</button><button data-c="timer">⏳ Timer</button></div><div class="grow pad" id="cc2"></div></div>`;
  const c=$('#cc2',body);let iv=null;
  // Stoppuhr-/Timer-Zustand bleibt beim Tab-Wechsel erhalten
  const sw={run:false,start:0,acc:0,laps:[]};
  const tm={end:0,left:0,run:false};
  const fmtSW=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,cs=Math.floor(ms/10)%100;return pad(m)+':'+pad(s)+','+pad(cs)};
  const fmtT=ms=>{const t=Math.ceil(ms/1000);return pad(Math.floor(t/60))+':'+pad(t%60)};
  function tab(t){
    clearInterval(iv);
    $$('[data-c]',body).forEach(b=>b.classList.toggle('on',b.dataset.c===t));
    if(t==='clock'){
      let marks='';for(let i=0;i<12;i++)marks+=`<i class="mk" style="transform:rotate(${i*30}deg);${i%3===0?'height:14px;width:3px;background:var(--text)':''}"></i>`;
      const zones=[['Berlin','Europe/Berlin'],['London','Europe/London'],['New York','America/New_York'],['Tokio','Asia/Tokyo'],['Sydney','Australia/Sydney']];
      c.innerHTML=`<div class="aclock">${marks}<div class="hand hh"></div><div class="hand mh"></div><div class="hand sh"></div><div class="cap"></div></div><div class="digital" id="dg"></div>
        <div class="label">Weltuhr</div><div class="card world">${zones.map(z=>`<div class="row"><b>${z[0]}</b><span data-z="${z[1]}"></span></div>`).join('')}</div>`;
      const upd=()=>{const d=new Date();const s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,hh=(d.getHours()%12)+m/60;
        $('.hh',c).style.transform=`rotate(${hh*30}deg)`;$('.mh',c).style.transform=`rotate(${m*6}deg)`;$('.sh',c).style.transform=`rotate(${s*6}deg)`;
        $('#dg',c).textContent=d.toLocaleTimeString('de-DE');
        $$('[data-z]',c).forEach(e=>{try{e.textContent=d.toLocaleTimeString('de-DE',{timeZone:e.dataset.z,hour:'2-digit',minute:'2-digit'})}catch(_){e.textContent='–'}})};
      upd();iv=setInterval(upd,100);
    }
    if(t==='sw'){
      c.innerHTML=`<div class="sw" id="swd">00:00,00</div><div class="swbtns"><button id="swL">Runde</button><button id="swS" class="go">Start</button></div><div class="laps card" id="laps"></div>`;
      const d=$('#swd',c),bS=$('#swS',c),bL=$('#swL',c),L=$('#laps',c);
      const now=()=>sw.acc+(sw.run?performance.now()-sw.start:0);
      const draw=()=>{d.textContent=fmtSW(now());bS.textContent=sw.run?'Stopp':'Start';bS.className=sw.run?'stop':'go';bL.textContent=sw.run||!now()?'Runde':'Zurücksetzen';
        L.style.display=sw.laps.length?'':'none';L.innerHTML=sw.laps.map((l,i)=>`<div class="row"><span>Runde ${sw.laps.length-i}</span><b style="font-variant-numeric:tabular-nums">${fmtSW(l)}</b></div>`).join('')};
      bS.onclick=()=>{if(sw.run){sw.acc+=performance.now()-sw.start;sw.run=false}else{sw.start=performance.now();sw.run=true}draw()};
      bL.onclick=()=>{if(sw.run){sw.laps.unshift(now())}else{sw.acc=0;sw.laps=[]}draw()};
      draw();iv=setInterval(()=>{d.textContent=fmtSW(now())},33);
    }
    if(t==='timer'){
      c.innerHTML=`<div class="sw" id="td">05:00</div>
        <div class="presets">${[1,3,5,10,15,30].map(m=>`<button class="btn" data-m="${m}">${m} Min</button>`).join('')}</div>
        <div class="swbtns"><button id="tR">Abbrechen</button><button id="tS" class="go">Start</button></div>`;
      if(!tm.run&&!tm.left)tm.left=5*60000;
      const d=$('#td',c),bS=$('#tS',c);
      const left=()=>tm.run?Math.max(0,tm.end-Date.now()):tm.left;
      const draw=()=>{d.textContent=fmtT(left());bS.textContent=tm.run?'Pause':'Start';bS.className=tm.run?'stop':'go'};
      $$('[data-m]',c).forEach(b=>b.onclick=()=>{tm.run=false;tm.left=b.dataset.m*60000;draw()});
      bS.onclick=()=>{if(tm.run){tm.left=left();tm.run=false}else if(tm.left>0){tm.end=Date.now()+tm.left;tm.run=true}draw()};
      $('#tR',c).onclick=()=>{tm.run=false;tm.left=5*60000;draw()};
      draw();iv=setInterval(draw,250);
    }
  }
  // Timer läuft auch im Hintergrund weiter
  const bg=setInterval(()=>{if(tm.run&&Date.now()>=tm.end){tm.run=false;tm.left=0;notify('⏰','Timer abgelaufen','Deine Zeit ist um!','#ff9f0a')}},250);
  $$('[data-c]',body).forEach(b=>b.onclick=()=>{tab(b.dataset.c);haptic('select');fadeIn($('#cc2',body)||body)});
  ctx.cleanup.push(()=>{clearInterval(iv);clearInterval(bg)});
  tab('clock');
}},

calendar:{name:'Kalender',cat:'Produktivität',full:true,store:true,icon:'📅',bg:'linear-gradient(135deg,#ff6b6b,#ee5a24)',w:460,h:600,
render(body){
  const now=new Date();let y=now.getFullYear(),m=now.getMonth(),sel=key(now);
  function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function draw(){
    const first=new Date(y,m,1),startDay=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
    let cells='';
    for(let i=0;i<42;i++){
      const dn=i-startDay+1;let d,other=false;
      if(dn<1){d=new Date(y,m-1,prevDays+dn);other=true}else if(dn>days){d=new Date(y,m+1,dn-days);other=true}else d=new Date(y,m,dn);
      const k=key(d);
      cells+=`<button data-d="${k}" class="${other?'other ':''}${k===key(now)?'today ':''}${k===sel?'sel ':''}${S.events[k]?.length?'has':''}">${d.getDate()}</button>`;
    }
    const ev=S.events[sel]||[];
    const sd=new Date(sel);
    body.innerHTML=`<div class="pad"><div class="calhead"><button class="btn" id="cP">‹</button><b>${first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="btn" id="cN">›</button></div>
      <div class="calgrid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
      <div class="label">${sd.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</div>
      <div class="card">${ev.length?ev.map((e,i)=>`<div class="row"><span>📌 ${esc(e)}</span><button data-del="${i}" style="color:#ff3b30">✕</button></div>`).join(''):'<div class="row muted">Keine Termine</div>'}</div>
      <div style="display:flex;gap:8px"><input class="input" id="cE" placeholder="Neuer Termin …" maxlength="60"><button class="btn primary" id="cA">＋</button></div></div>`;
    $('#cP',body).onclick=()=>{m--;if(m<0){m=11;y--}draw()};
    $('#cN',body).onclick=()=>{m++;if(m>11){m=0;y++}draw()};
    $$('[data-d]',body).forEach(b=>b.onclick=()=>{sel=b.dataset.d;const d=new Date(sel);y=d.getFullYear();m=d.getMonth();draw()});
    const add=()=>{const v=$('#cE',body).value.trim();if(!v)return;(S.events[sel]??=[]).push(v);save();draw()};
    $('#cA',body).onclick=add;$('#cE',body).onkeydown=e=>{if(e.key==='Enter')add()};
    $$('[data-del]',body).forEach(b=>b.onclick=()=>{S.events[sel].splice(+b.dataset.del,1);if(!S.events[sel].length)delete S.events[sel];save();draw()});
  }
  draw();
}},

  function rr(x,y,w,h,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)}
  function draw(k){

    g.fillStyle='rgba(255,255,255,.035)';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*cell,j*cell,cell,cell);

      g.beginPath();for(let i=0;i<10;i++){const r=(i%2?.18:.42)*cell,a=i*Math.PI/5-Math.PI/2;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.restore()}}

    const L=pts.length;

      g.fillStyle=`hsl(${145-f*40},85%,${58-f*18}%)`;g.beginPath();g.arc(pts[i].x,pts[i].y,r,0,7);g.fill();
      if(i>0){const a=pts[i],b=pts[i-1];g.strokeStyle=g.fillStyle;g.lineWidth=r*2;g.lineCap='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}
    const h=pts[0];g.save();g.shadowColor='#7dffa0';g.shadowBlur=over?0:14;g.fillStyle='#8dffb0';g.beginPath();g.arc(h.x,h.y,cell*.46,0,7);g.fill();g.restore();
    const ex=-dir.y,ey=dir.x;for(const s of[-1,1]){const x=h.x+dir.x*cell*.14+ex*s*cell*.2,y=h.y+dir.y*cell*.14+ey*s*cell*.2;
      g.fillStyle='#fff';g.beginPath();g.arc(x,y,cell*.12,0,7);g.fill();g.fillStyle='#0b1410';g.beginPath();g.arc(x+dir.x*cell*.04,y+dir.y*cell*.04,cell*.06,0,7);g.fill()}
    // Partikel
    parts=parts.filter(p=>(p.life-=.03)>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;g.globalAlpha=p.life;g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,cell*.09,0,7);g.fill()});g.globalAlpha=1;

  }
  function turn(x,y){const l=q.length?q[q.length-1]:dir;if((x===l.x&&y===l.y)||(x===-l.x&&y===-l.y))return;if(q.length<3)q.push({x,y});if(!run&&!over&&$('#ov',body).classList.contains('on')&&sn)start()}

  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const win=b=>{for(const l of L)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return l;return b.every(Boolean)?'D':null};
  function best(b,p){const w=win(b);if(w)return{s:w==='D'?0:(b[w[0]]==='O'?10:-10)};let bestM=null;
    for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const r=best(b,p==='O'?'X':'O');b[i]='';const s=r.s*(.95);if(!bestM||(p==='O'?s>bestM.s:s<bestM.s))bestM={s,i}}return bestM}
  function draw(){
    const w=win(B);
    body.innerHTML=`<div class="gm"><div class="seg" style="width:100%;max-width:360px"><button data-m="2p" class="${mode==='2p'?'on':''}">👥 2 Spieler</button><button data-m="ai" class="${mode==='ai'?'on':''}">🤖 Gegen GufyUI</button></div>
      <div class="gm-top"><div class="gm-pill ${turn==='X'&&!end?'act':''}"><small>${mode==='ai'?'Du':'Spieler 1'}</small><b style="color:#ff6b9d">✕ ${sc.X}</b></div><div class="gm-pill"><small>Unentschieden</small><b>${sc.D}</b></div><div class="gm-pill ${turn==='O'&&!end?'act':''}"><small>${mode==='ai'?'GufyUI':'Spieler 2'}</small><b style="color:#5ac8fa">◯ ${sc.O}</b></div></div>
      <div class="ttt">${B.map((v,i)=>`<button data-i="${i}" class="${w&&w!=='D'&&w.includes(i)?'win':''} ${v?'set':''}">${v==='X'?'<span class="x">✕</span>':v==='O'?'<span class="o">◯</span>':''}</button>`).join('')}</div>
      <p class="gm-hint" style="font-size:16px;font-weight:600">${w?(w==='D'?'🤝 Unentschieden!':(B[w[0]]==='X'?(mode==='ai'?'🎉 Du gewinnst!':'🎉 Spieler 1 gewinnt!'):(mode==='ai'?'🤖 GufyUI gewinnt!':'🎉 Spieler 2 gewinnt!'))):(turn==='X'?'✕ ist dran':'◯ ist dran')}</p>
      <button class="btn primary" id="nw">↻ Neue Runde</button></div>`;
    $$('[data-i]',body).forEach(b=>b.onclick=()=>play(+b.dataset.i));
    $$('[data-m]',body).forEach(b=>b.onclick=()=>{if(mode===b.dataset.m)return;mode=b.dataset.m;sc={X:0,O:0,D:0};reset()});
    $('#nw',body).onclick=reset;
  }
  function play(i){if(end||B[i]||(mode==='ai'&&turn==='O'))return;B[i]=turn;haptic('select');next()}
  function next(){const w=win(B);if(w){end=true;w==='D'?sc.D++:sc[B[w[0]]]++;haptic('success');draw();return}
    turn=turn==='X'?'O':'X';draw();
    if(mode==='ai'&&turn==='O')setTimeout(()=>{if(end)return;const m=Math.random()<.15?{i:B.map((v,k)=>v?-1:k).filter(k=>k>=0)[0]}:best(B.slice(),'O');B[m.i]='O';next()},420)}
  function reset(){B=Array(9).fill('');turn='X';end=false;draw()}
  reset();
}},

memory:{name:'Memory',cat:'Spiele',full:true,store:true,icon:'🃏',bg:'linear-gradient(135deg,#ff6a88,#ff99ac)',
render(body,ctx){
  S.hs??={};
  const E=['🐍','🍕','🚀','👑','🦄','🎸','🍩','⚽','🐙','🌈','🦖','🍔'];
  let cards,open=[],moves=0,found=0,lock=false,t0=0,iv=0;
  function reset(){const pick=E.slice().sort(()=>Math.random()-.5).slice(0,8);cards=pick.concat(pick).sort(()=>Math.random()-.5).map(e=>({e,up:false,ok:false}));open=[];moves=0;found=0;t0=0;clearInterval(iv);draw()}
  function draw(){
    body.innerHTML=`<div class="gm"><div class="gm-top"><div class="gm-pill"><small>Züge</small><b id="mv">${moves}</b></div><div class="gm-pill"><small>Zeit</small><b id="tm">0 s</b></div><div class="gm-pill"><small>🏆 Rekord</small><b>${S.hs.memory?S.hs.memory+' Züge':'–'}</b></div></div>
      <div class="mem">${cards.map((c,i)=>`<button data-i="${i}" class="${c.up||c.ok?'up':''} ${c.ok?'ok':''}"><div class="mf">?</div><div class="mb">${c.e}</div></button>`).join('')}</div>
      <button class="btn" id="nw">↻ Neu mischen</button></div>`;
    $$('[data-i]',body).forEach(b=>b.onclick=()=>flip(+b.dataset.i,b));
    $('#nw',body).onclick=()=>{haptic();reset()};
  }
  function flip(i,el){const c=cards[i];if(lock||c.up||c.ok)return;
    if(!t0){t0=Date.now();iv=setInterval(()=>{const e=$('#tm',body);if(e)e.textContent=Math.round((Date.now()-t0)/1000)+' s'},500)}
    c.up=true;el.classList.add('up');open.push(i);haptic('select');
    if(open.length===2){moves++;$('#mv',body).textContent=moves;const[a,b]=open;open=[];
      if(cards[a].e===cards[b].e){cards[a].ok=cards[b].ok=true;found++;setTimeout(()=>{$$('[data-i]',body).forEach(x=>{if(+x.dataset.i===a||+x.dataset.i===b)x.classList.add('ok')});haptic('success')},250);
        if(found===8){clearInterval(iv);const rec=!S.hs.memory||moves<S.hs.memory;if(rec){S.hs.memory=moves;save()}
          setTimeout(()=>notify('🃏',rec?'Neuer Memory-Rekord!':'Alle Paare gefunden!',`${moves} Züge · ${Math.round((Date.now()-t0)/1000)} s`,'#ff6a88'),500)}}
      else{lock=true;setTimeout(()=>{cards[a].up=cards[b].up=false;$$('[data-i]',body).forEach(x=>{if(+x.dataset.i===a||+x.dataset.i===b)x.classList.remove('up')});lock=false},800)}}
  }
  reset();ctx.cleanup.push(()=>clearInterval(iv));
}},

paint:{name:'Zeichnen',cat:'Kreativ',full:true,store:true,icon:'🎨',bg:'linear-gradient(135deg,#f857a6,#ff5858)',w:640,h:500,
render(body,ctx){
  const cols=['#111111','#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de','#ff2d55','#8e8e93'];
  body.innerHTML=`<div class="paint"><div class="ptools">${cols.map((c,i)=>`<button class="sw2 ${i===0?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')}
    <input type="range" min="2" max="40" value="6" id="pS" style="width:90px;accent-color:var(--accent)">
    <button class="tb" id="pE">🧽 Radierer</button><button class="tb" id="pC">🗑️ Leeren</button><button class="tb" id="pD">💾 Speichern</button></div>
    <div class="pwrap"><canvas id="pc"></canvas></div></div>`;
  const cv=$('#pc',body),g=cv.getContext('2d'),wrap=$('.pwrap',body);
  let col='#111111',erase=false,drawing=false,last=null;
  function resize(){
    const r=wrap.getBoundingClientRect();if(!r.width||!r.height)return;
    const dpr=devicePixelRatio||1;
    const tmpc=document.createElement('canvas');tmpc.width=cv.width;tmpc.height=cv.height;if(cv.width)tmpc.getContext('2d').drawImage(cv,0,0);
    cv.width=r.width*dpr;cv.height=r.height*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle='#fff';g.fillRect(0,0,r.width,r.height);
    if(tmpc.width)g.drawImage(tmpc,0,0,tmpc.width/dpr,tmpc.height/dpr);
  }
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);line(last,last)};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);line(last,p);last=p};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  function line(a,b){g.strokeStyle=erase?'#fff':col;g.lineWidth=+$('#pS',body).value*(erase?2:1);g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  $$('[data-c]',body).forEach(b=>b.onclick=()=>{col=b.dataset.c;erase=false;$('#pE',body).classList.remove('on');$$('[data-c]',body).forEach(x=>x.classList.toggle('sel',x===b))});
  $('#pE',body).onclick=e=>{erase=!erase;e.currentTarget.classList.toggle('on',erase)};
  $('#pC',body).onclick=()=>{g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height)};
  $('#pD',body).onclick=()=>{const a=document.createElement('a');a.download='NovaOS-Bild.png';a.href=cv.toDataURL('image/png');a.click();notify('🎨','Bild gespeichert','NovaOS-Bild.png','#f857a6')};
  const ro=new ResizeObserver(resize);ro.observe(wrap);
  ctx.cleanup.push(()=>ro.disconnect());
}},

    return{ic:'🌙',txt:d?'Dunkelmodus an':'Hellmodus an',run:()=>{S.theme=d?'dark':'light';applyLook();save();return d?'Dunkelmodus an.':'Hellmodus an.'}}}
  if(/nicht stören|nichtstören|ruhemodus/.test(s))return{ic:'🔕',txt:off?'Nicht stören aus':'Nicht stören an',run:()=>{S.dnd=!off;save();updateCC();return off?'Nicht stören aus.':'Nicht stören an.'}};
  if(/wetter|regnet|regen|wind|temperatur|wie warm|wie kalt|regenschirm|jacke/.test(s)&&!/öffne|starte|zeig/.test(s))return{ic:'🌦️',txt:'Wetter',async:true,run:async()=>{
    await wxLoad(false);if(!S.wx)return 'Ich konnte das Wetter gerade nicht laden.';
    const c=S.wx.d.current,b=beaufort(c.wind_speed_10m),r=rainSummary(S.wx.d);
    return `${wxCode(c.weather_code,c.is_day).t}, ${Math.round(c.temperature_2m)}°. Wind Stärke ${b.n} (${Math.round(c.wind_speed_10m)} km/h, ${b.t}). ${r.text}.`}};
  if(/wie spät|uhrzeit|wie viel uhr/.test(s))return{ic:'🕐',txt:'Uhrzeit',run:()=>`Es ist ${new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr.`};
  if(/welcher tag|datum|welches datum|heute ist/.test(s))return{ic:'📅',txt:'Datum',run:()=>`Heute ist ${new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}.`};
  if(/akku|batterie/.test(s))return{ic:'🔋',txt:'Akku',run:()=>`Akku: ${dispPct()} %. ${remainText().replace(/\.+$/,'')}.`};
  if(/coins|münzen|geld/.test(s)&&!/floni/.test(s))return{ic:'🪙',txt:'Coins',run:()=>`Du hast ${fmtNum(S.coins)} Coins.`};
  if(/floni/.test(s))return{ic:'🟣',txt:'Floni Coins',run:()=>`Du hast ${fmtNum((S.vsf||{}).floni||0)} Floni Coins.`};
  if(/\bleben\b|herzen/.test(s)){const h=(S.vsf||{half:6}).half;return{ic:'❤️',txt:'VSF Leben',run:()=>`VSF hat ${h/2} von 3 Herzen.`}}
  if(/quest/.test(s)&&!/öffne|zeig|starte|gib mir|vorschlag|soll ich/.test(s))return{ic:'⚔️',txt:'Quests',run:()=>{ensureQuests();const L=S.daily.list;const o=L.filter(q=>!q.done);return o.length?`Noch ${o.length} offen: ${o.map(q=>q.title).join(' · ')}`:'Alle Quests für heute geschafft! 🎉'}};
  if((m=s.match(/(?:notiere|notiz|merk dir|schreib\w*(?: eine)? notiz)\s*:?\s*(.*)/))){const tx=raw.replace(/^.*?(notiere|notiz|merk dir|schreib\w*( eine)? notiz)\s*:?\s*/i,'').trim();
    if(!tx)return{ic:'📝',err:'Was soll ich notieren?'};return{ic:'📝',txt:'Notiz: '+tx,run:()=>{S.notes.push({id:Date.now(),text:tx,t:Date.now()});save();return 'Notiz gespeichert.'}}}
  if(/spiel\w*\b.*\bspiel|zufällig\w* spiel|mir ist langweilig|langweilig/.test(s)){const G=Object.keys(APPS).filter(id=>APPS[id].cat==='Spiele'&&appAvail(id));
    if(!G.length)return{ic:'🎮',err:'Du hast noch keine Spiele – lade welche im Gufy Store.'};const g=G[Math.floor(Math.random()*G.length)];
    return{ic:APPS[g].icon,txt:APPS[g].name,opens:true,run:()=>{openApp(g);return `Los geht's mit ${APPS[g].name}!`}}}
  if(/gib mir eine quest|was soll ich (machen|tun)|welche quest soll|quest vorschlag/.test(s))return{ic:'⚔️',txt:'Quest-Vorschlag',run:()=>{ensureQuests();const o=S.daily.list.filter(q=>!q.done);if(!o.length)return 'Alle Quests sind geschafft – stark! 🎉';const q=o[Math.floor(Math.random()*o.length)];return `${q.i} ${q.title} – ${q.coins} Coins.`}};
  if(/bin (zu hause|daheim|zuhause)|bin unterwegs|bin draußen/.test(s)){const h=/hause|daheim|zuhause/.test(s);return{ic:h?'🏠':'🚶',txt:h?'Zu Hause':'Unterwegs',opens:true,run:()=>{setTimeout(()=>askHome(h),300);return 'Gib den Code ein, um den Status zu ändern.'}}}
  if(/powerbank/.test(s)){const k=['travel','pb60','pb30'].find(x=>(S.inv[x]||0)>0);if(!k)return{ic:'🔋',err:'Du hast keine Powerbank – im Gufy Store gibt es welche.'};
    return{ic:ITEMS[k].icon,txt:ITEMS[k].name,run:()=>{const b=S.battery.level;useItem(k);return S.battery.level>b?`Powerbank benutzt – jetzt ${dispPct()} %.`:'Der Akku ist schon voll.'}}}
  if(/letzte notiz|meine notiz|notizen vor/.test(s))return{ic:'📝',txt:'Letzte Notiz',run:()=>{const n=[...(S.notes||[])].sort((a,b)=>b.t-a.t)[0];return n&&n.text.trim()?'Letzte Notiz: '+n.text:'Du hast noch keine Notizen.'}};
  if(/mitternacht|neue quests|wann kommen/.test(s))return{ic:'🌙',txt:'Bis Mitternacht',run:()=>{const n=new Date(),m2=new Date(n);m2.setHours(24,0,0,0);return `Neue Quests in ${fmtLen(Math.round((m2-n)/60000)*60000)}.`}};
  if(/schulden/.test(s)&&!/öffne|zeig|starte/.test(s))return{ic:'💸',txt:'Schulden',run:()=>{const o=(S.debts||[]).filter(d=>d.status==='open');return o.length?`${o.length} offene Schuld${o.length>1?'en':''}: ${o.map(d=>d.title).join(' · ')}`:'Du hast keine offenen Schulden.'}};
  if((m=s.match(/zufallszahl(?:\s+(?:zwischen|von)\s+(\S+)\s+bis\s+(\S+))?/))){const lo=m[1]?wordNum(m[1])??1:1,hi=m[2]?wordNum(m[2])??100:100;return{ic:'🔢',txt:'Zufallszahl',run:()=>`Zufallszahl: ${Math.floor(lo+Math.random()*(hi-lo+1))}`}}
  if(/stoppuhr/.test(s)){if(!appAvail('clock'))return{ic:'⏱️',err:'Die Uhr-App ist nicht installiert.'};return{ic:'⏱️',txt:'Stoppuhr',opens:true,run:()=>{openApp('clock');setTimeout(()=>{const b=$('[data-c="sw"]');if(b)b.click()},300);return 'Stoppuhr geöffnet.'}}}
  if(/witz/.test(s))return{ic:'😂',txt:'Witz',run:()=>JOKES[Math.floor(Math.random()*JOKES.length)]};
  if(/würfel/.test(s))return{ic:'🎲',txt:'Würfeln',run:()=>`Gewürfelt: ${1+Math.floor(Math.random()*6)} 🎲`};
  if(/münze|kopf oder zahl/.test(s))return{ic:'🪙',txt:'Münzwurf',run:()=>Math.random()<.5?'Kopf! 👑':'Zahl! 🔢'};
  if(/hintergrund/.test(s)){const i=WALLNAMES.findIndex(n=>s.includes(n.toLowerCase()));const k=i>=0?i:Math.floor(Math.random()*WALLS.length);
    return{ic:'🖼️',txt:'Hintergrund: '+WALLNAMES[k],run:()=>{S.wall=k;applyLook();save();return `Hintergrund: ${WALLNAMES[k]}.`}}}
  if(/home|startbildschirm|schließ|schliess|zurück/.test(s))return{ic:'🏠',txt:'Home',run:()=>{goHome();return 'Zurück zum Home-Bildschirm.'}};
  if((m=s.match(/(?:was ist|rechne|wie viel ist|wieviel ist)\s+(.+)/))){
    const ex=m[1].replace(/plus/g,'+').replace(/minus/g,'-').replace(/mal|x|×/g,'*').replace(/geteilt durch|durch|÷/g,'/').replace(/,/g,'.').replace(/\b([a-zäöüß]+)\b/g,w=>{const n=wordNum(w);return n===null?'':n});
    if(/^[\d\s+\-*/().]+$/.test(ex)&&/\d/.test(ex)){try{const v=Function('return ('+ex+')')();if(isFinite(v))return{ic:'🧮',txt:'Rechnen',run:()=>`${m[1].trim()} = ${String(+v.toFixed(6)).replace('.',',')}`}}catch(e){}}
  }
  const app=findApp(s);
  if(app&&/öffne|starte|zeig|geh zu|mach .* auf|spiel|^\w+$|app/.test(s)||app&&s.split(' ').length<=3){
    if(!appAvail(app))return{ic:APPS[app].icon,err:`${APPS[app].name} ist nicht installiert – lade es im Gufy Store.`};
    return{ic:APPS[app].icon,txt:APPS[app].name+' öffnen',opens:true,run:()=>{openApp(app);return `${APPS[app].name} geöffnet.`}};
  }
  return{ic:'🤔',err:`„${raw}“ habe ich nicht verstanden.`};
}
function speak(t,n=0){try{if(!window.speechSynthesis||S.asstVoice!==true)return;if(asRun){if(n<8)setTimeout(()=>speak(t,n+1),250);else glog('Vorlesen','übersprungen (Mikro läuft)');return}glog('Vorlesen',t.slice(0,60));const u=new SpeechSynthesisUtterance(t.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,''));u.lang='de-DE';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
async function runAssistant(text){
  glog('Assistent','Befehl: „'+text+'“');
  const box=$('#asLog');if(!box)return;
  const parts=splitCmd(text);if(!parts.length)return;
  const plans=parts.map(planCmd);
  const ch=$('.as-chips',box);if(ch)ch.style.display='none';box.querySelectorAll('.as-me,.as-step').forEach(x=>x.remove());
  box.insertAdjacentHTML('beforeend',`<div class="as-me">${esc(text)}</div>`+plans.map((p,i)=>`<div class="as-step ${p.err?'err':''}" data-k="${i}"><span class="ic">${p.ic}</span><div><b>${esc(p.err||p.txt)}</b><small></small></div><span class="st">${p.err?'⚠️':'⏳'}</span></div>`).join(''));
  const said=[];
  for(let i=0;i<plans.length;i++){
    const p=plans[i],row=$(`.as-step[data-k="${i}"]`,box);
    if(p.err){said.push(p.err);continue}
    if(p.wait){$('.st',row).textContent='⏳';await new Promise(r=>setTimeout(r,p.wait));$('.st',row).textContent='✅';continue}
    if(p.opens){closeAssistant(true);await new Promise(r=>setTimeout(r,280))}
    let res='';try{res=await p.run()}catch(e){res='Fehler'}
    if(row){$('small',row).textContent=res;$('.st',row).textContent='✅'}
    said.push(res);haptic('success');
    if(p.opens&&i<plans.length-1)await new Promise(r=>setTimeout(r,500));
  }
  const all=said.filter(Boolean).join(' ');
  if(!$('#asst').classList.contains('open')&&all)notify('✨','Gufy Assistent',all,'#7c5cff');
  speak(all);
}
/* Spracheingabe
   iPhone-Probleme: (1) Vorlesen/Töne belegen das Audio → Mikro läuft, liefert aber nichts.
   (2) Erkenner hängt manchmal. Deshalb: vor dem Zuhören Vorlesen stoppen, kurz warten,
   bei Hängern/leeren Ergebnissen einen frischen Erkenner nehmen. Alles wird geloggt. */
let asRec=null,asRun=false,asSess=null,asQueue=false,asWd=0,asMax=0,asN=0,asFresh=false,asSil=0;
function asStatus(t,mode){const st=$('#asSt');if(st){st.textContent=t;st.className='as-st '+(mode||'')}const o=$('#asst .as-orb');if(o)o.classList.toggle('listen',mode==='listen')}
function asMake(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){glog('Mikro','SpeechRecognition gibt es hier nicht');return null}
  if(asRec&&!asFresh)return asRec;
  if(asRec)asReset();asFresh=false;
  let r;try{r=new SR()}catch(e){glog('Mikro','new SR() Fehler: '+e.message);return null}
  const id=++asN;glog('Mikro',`Erkenner #${id} erstellt`);
  r.lang='de-DE';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  r.onstart=()=>{glog('Mikro',`#${id} onstart`);asRun=true;clearTimeout(asWd);if(asSess){asSess.started=true;asStatus('Ich höre zu …','listen')}haptic('select');clearTimeout(asMax);asMax=setTimeout(()=>{glog('Mikro',`#${id} 12 s vorbei → stop`);try{r.stop()}catch(_){}},12000)};
  r.onaudiostart=()=>{glog('Mikro',`#${id} audiostart`);clearTimeout(asSil);
    asSil=setTimeout(()=>{const ss=asSess;if(r===asRec&&ss&&!ss.sound&&!ss.done&&!ss.retried){glog('Mikro',`#${id} 5 s kein Ton → frischer Erkenner`);ss.silent=true;try{r.stop()}catch(_){}}},5000)};
  r.onsoundstart=()=>{glog('Mikro',`#${id} soundstart`);clearTimeout(asSil);if(asSess)asSess.sound=true};
  r.onspeechstart=()=>{glog('Mikro',`#${id} speechstart`);clearTimeout(asSil);if(asSess)asSess.sound=true};
  r.onspeechend=()=>glog('Mikro',`#${id} speechend`);
  r.onnomatch=()=>glog('Mikro',`#${id} nomatch`);
  r.onresult=e=>{const ss=asSess;const t=[...e.results].map(x=>x[0].transcript).join('');const fin=e.results[e.results.length-1].isFinal;
    glog('Mikro',`#${id} result${fin?' (final)':''}: „${t}“`);if(!ss)return;ss.txt=t;const i=$('#asTxt');if(i)i.value=t;
    if(fin&&!ss.done){ss.done=true;asStatus('');if(i)i.value='';runAssistant(t);try{r.stop()}catch(_){}}};
  r.onerror=e=>{glog('Mikro',`#${id} error: ${e.error}${e.message?' – '+e.message:''}`);const ss=asSess;if(ss)ss.err=e.error};
  r.onend=()=>{glog('Mikro',`#${id} onend`);if(r!==asRec)return;asRun=false;clearTimeout(asWd);clearTimeout(asMax);clearTimeout(asSil);const ss=asSess;asSess=null;
    asFresh=true; // iPhone: ein Erkenner hört nur EINMAL richtig zu → beim nächsten Mal immer neu
    if(asQueue){asQueue=false;setTimeout(asListen,250);return}
    if(!ss||ss.done)return;
    if(ss.txt&&ss.txt.trim()){ss.done=true;asStatus('');const i=$('#asTxt');if(i)i.value='';runAssistant(ss.txt);return}
    // nichts erkannt, obwohl das Mikro lief → mit frischem Erkenner nochmal
    if(!ss.retried&&ss.err!=='not-allowed'&&(ss.silent||(ss.err!=='aborted'&&(ss.err||ss.sound)))){
      glog('Mikro','kein Ergebnis → frischer Erkenner, 2. Versuch');asFresh=true;asStatus('Nochmal bitte …','listen');setTimeout(()=>asListen(true),300);return}
    if(!$('#asst')||!$('#asst').classList.contains('open'))return;
    asStatus(ss.err==='not-allowed'||ss.err==='service-not-allowed'?'Mikrofon nicht erlaubt – tippe ins Feld und nutze das 🎤 der Tastatur.':'Nicht verstanden – tippe auf 🎤 und versuch es nochmal.','warn')};
  return asRec=r;
}
function asReset(){clearTimeout(asWd);clearTimeout(asMax);const r=asRec;asRec=null;asRun=false;asQueue=false;
  if(r){glog('Mikro','Erkenner verworfen');r.onend=r.onresult=r.onerror=r.onstart=r.onaudiostart=r.onsoundstart=r.onspeechstart=null;try{r.abort()}catch(e){}}}
function asQuiet(){ // Vorlesen & Töne aus, damit das Mikro frei ist
  let busy=false;
  try{if(window.speechSynthesis&&(speechSynthesis.speaking||speechSynthesis.pending)){busy=true;speechSynthesis.cancel();glog('Mikro','Vorlesen gestoppt')}}catch(e){}
  try{if(audioCtx&&audioCtx.state==='running'){audioCtx.suspend();busy=true;glog('Mikro','Töne pausiert')}}catch(e){}
  return busy;
}
/* Audio-Sitzung (Safari 16.4+): auf „Aufnehmen + Abspielen“ stellen, damit das Mikro nach dem ersten Mal nicht taub bleibt */
function asSession(mode){try{const a=navigator.audioSession;if(!a){if(mode)glog('Audio','navigator.audioSession gibt es nicht');return}
  const before=a.type;a.type=mode||'auto';glog('Audio',`Sitzung ${before} → ${a.type} (Zustand: ${a.state||'?'})`)}catch(e){glog('Audio','Fehler: '+e.message)}}
function asListen(retry){
  if(!$('#asst'))return;
  if(!retry)asSession('play-and-record');
  if(asRun){glog('Mikro','läuft noch → stop, dann neu');asQueue=true;try{asRec.stop()}catch(e){}
    clearTimeout(asWd);asWd=setTimeout(()=>{if(asRun||asQueue){glog('Mikro','hängt beim Stoppen');asReset();asListen()}},1200);return}
  if(asQuiet()&&!retry)return void setTimeout(()=>asListen(true),450);
  if(asFresh&&asRec&&!retry){asReset();return void setTimeout(()=>asListen(true),250)}
  const r=asMake();
  if(!r){asStatus('Sprechen geht hier nicht – tippe ins Feld und nutze das 🎤 der Tastatur.','warn');return}
  asSess={txt:'',done:false,retried:!!retry,started:false,sound:false};
  asStatus('Mikrofon startet …','listen');
  try{r.start();glog('Mikro','start()')}catch(e){glog('Mikro','start() Fehler: '+e.message);asReset();if(!retry)return void setTimeout(()=>asListen(true),300);asStatus('Tippe auf 🎤, um nochmal zu sprechen.','warn');return}
  clearTimeout(asWd);asWd=setTimeout(()=>{if(asSess&&!asSess.started){glog('Mikro','kein onstart nach 2,5 s');asReset();if(!retry)asListen(true);else asStatus('Mikrofon reagiert nicht – tippe auf 🎤.','warn')}},2500);
}
function asStop(){asSess=null;asQueue=false;clearTimeout(asWd);setTimeout(()=>{if(!asRun)asSession('auto')},600);if(asRec&&asRun){glog('Mikro','stop (Fenster/Eingabe)');try{asRec.stop()}catch(e){}}}
document.addEventListener('visibilitychange',()=>{glog('App',document.visibilityState==='hidden'?'im Hintergrund':'wieder sichtbar');if(document.visibilityState==='hidden'){asSess=null;asReset()}});
function openAssistant(){
  if(current!=='desktop')return;
  let a=$('#asst');
  if(!a){a=document.createElement('div');a.id='asst';document.body.append(a);
    a.innerHTML=`<div class="as-sheet"><div class="as-head"><div class="as-orb"></div><div><b class="as-title">Gufy Assistent</b><small class="as-st" id="asSt"></small></div></div>
      <div class="as-log" id="asLog"><div class="as-chips">${['Timer 3 Minuten und Taschenlampe an','Wie ist das Wetter?','Wie lange hält mein Akku?','Spiel ein Spiel','Gib mir eine Quest','Wecker um 7 Uhr'].map(c=>`<button data-ex="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
      <form class="as-in" id="asForm"><input id="asTxt" placeholder="Sprich oder schreib …" autocomplete="off" enterkeyhint="send"><button type="button" id="asMic" title="Sprechen">🎤</button><button type="submit" class="as-go">↑</button></form></div>`;
    a.addEventListener('pointerdown',e=>{if(e.target===a)closeAssistant()});
    $('#asForm',a).onsubmit=e=>{e.preventDefault();asStop();const t=$('#asTxt',a).value.trim();if(!t)return;$('#asTxt',a).value='';$('#asTxt',a).blur();asStatus('');runAssistant(t)};
    $('#asTxt',a).addEventListener('focus',()=>{asStop();asStatus('')});
    $('#asMic',a).onclick=()=>{$('#asTxt',a).blur();if(asRun&&!(asSess&&asSess.started))asReset();asListen()};
    $$('[data-ex]',a).forEach(b=>b.onclick=()=>{asStop();runAssistant(b.dataset.ex)});
    // Tastatur: Fenster bleibt sichtbar über der Tastatur
    if(window.visualViewport){const vv=visualViewport,fit=()=>{const sh=$('.as-sheet',a);if(!sh)return;const kb=Math.max(0,innerHeight-vv.height-vv.offsetTop);sh.style.transform=kb>40?`translateY(${-kb+20}px)`:''};vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}
  }
  if(a.classList.contains('open'))return;
  a.classList.add('open');haptic('heavy');
  $('#asLog',a).querySelectorAll('.as-me,.as-step').forEach(x=>x.remove());
  $('.as-chips',a).style.display='';
  $('.as-sheet',a).animate([{transform:'translateY(60px) scale(.96)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:SPRING});
  asListen();
}
function closeAssistant(quick){const a=$('#asst');if(!a||!a.classList.contains('open'))return;asStop();const i=$('#asTxt',a);if(i)i.blur();
  if(quick){a.classList.remove('open');return}
  $('.as-sheet',a).animate([{opacity:1},{transform:'translateY(60px)',opacity:0}],{duration:200,easing:'ease-in'}).onfinish=()=>a.classList.remove('open')}

/* =========================================================
   START
   ========================================================= */
renderHome();applyLook();tick();advance();renderBattery();devSync();
if(S.setupDone){ensureQuests();checkDebts()}
if(S.loc.mode==='gps'&&S.setupDone)startGeo();
addEventListener('beforeunload',()=>{advance();save()});
addEventListener('pagehide',()=>{advance();save()});
boot();
</script>
