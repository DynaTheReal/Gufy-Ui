<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GufyUI</title>
<style>
:root{
  --accent:#4f8cff; --gold:#f5a524;
  --bg:#f4f6fb; --panel:rgba(255,255,255,.72); --panel-solid:#ffffff; --panel-2:#f2f3f7;
  --text:#14161c; --muted:#6b7280; --border:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05);
  --shadow:0 24px 70px rgba(0,0,0,.28);
}
body.dark{
  --bg:#0f1115; --panel:rgba(30,32,40,.72); --panel-solid:#14161c; --panel-2:#1f222b;
  --text:#f3f4f6; --muted:#9aa0ab; --border:rgba(255,255,255,.09); --hover:rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:#000;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:block}
.wall{position:absolute;inset:0;transition:background .6s}
.glass{background:var(--panel);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border)}

/* ---------- Bausteine ---------- */
.btn{padding:10px 18px;border-radius:12px;background:var(--hover);font-weight:600;font-size:15px;transition:transform .1s,filter .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,#ffd60a,#f5a524);color:#3a2600}
.btn.danger{background:#ff3b30;color:#fff}
.btn.big{padding:14px 30px;font-size:17px;border-radius:16px}
.input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel-2);outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.tinput{padding:8px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel-solid);font-size:16px;outline:none}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--hover);border:1px solid var(--border);transition:.25s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s}
.switch input:checked+span{background:#34c759;border-color:#34c759}
.switch input:checked+span::after{transform:translateX(20px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.card{background:var(--panel-2);border-radius:16px;padding:6px 14px;margin-bottom:14px}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.seg{display:inline-flex;background:var(--hover);border-radius:12px;padding:3px;width:100%}
.seg button{flex:1;padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--panel-solid);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tabs{display:flex;gap:6px;padding:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:20px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--hover)}
.tabs button.on{background:var(--tc,var(--accent));color:#fff}

/* ---------- Akku-Symbol ---------- */
.batt{display:inline-block;position:relative;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1px;vertical-align:middle}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.bfill{display:block;height:100%;background:currentColor;border-radius:2px;transition:width .4s}
.batt.chg .bfill{background:#34c759}
.batt.low .bfill{background:#ff3b30}
.bbolt{display:none;font-size:11px;margin-left:1px}

/* ---------- Boot ---------- */
#boot,#off{background:#000;color:#fff}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.logo{width:88px;height:88px;border-radius:26px;background:conic-gradient(from 210deg,#7f5af0,#4f8cff,#2cb67d,#ffd60a,#ff8906,#ec4899,#7f5af0);display:grid;place-items:center;font-size:48px;font-weight:900;color:#fff;box-shadow:0 10px 40px rgba(127,90,240,.45);letter-spacing:-2px}
.logo span{filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand{font-size:28px;font-weight:800;letter-spacing:-.5px}
.brand i{font-style:normal;background:linear-gradient(90deg,#7f5af0,#4f8cff,#2cb67d);-webkit-background-clip:text;background-clip:text;color:transparent}
.bootbar{width:180px;height:5px;border-radius:5px;background:#2a2a2a;overflow:hidden}
.bootbar i{display:block;height:100%;width:0;background:#fff;border-radius:5px}
.boottxt{font-size:13px;color:#888;letter-spacing:.5px}

/* ---------- Startanimation ---------- */
#boot{background:radial-gradient(circle at 50% 45%,#140f2e 0,#000 65%);overflow:hidden}
#bootCv{position:absolute;inset:0;width:100%;height:100%}
#boot .center{z-index:2}
.bootlogo{position:relative;width:96px;height:96px;margin-bottom:6px}
.bootlogo .logo{width:96px;height:96px;opacity:0}
.ring{position:absolute;border-radius:50%;border:3px solid transparent;opacity:0}
.ring.r1{inset:-20px;border-top-color:#7f5af0;border-right-color:#4f8cff;filter:drop-shadow(0 0 8px #4f8cff)}
.ring.r2{inset:-38px;border-bottom-color:#2cb67d;border-left-color:#ec4899;filter:drop-shadow(0 0 8px #ec4899)}
.ring.r3{inset:-56px;border-top-color:#ffd60a;opacity:0;filter:drop-shadow(0 0 8px #ffd60a)}
#boot.play .ring.r1{animation:ringIn .6s ease .25s forwards,spin 1.4s linear .25s infinite}
#boot.play .ring.r2{animation:ringIn .6s ease .4s forwards,spin 2.2s linear .4s infinite reverse}
#boot.play .ring.r3{animation:ringIn .6s ease .55s forwards,spin 3s linear .55s infinite}
@keyframes ringIn{from{opacity:0;transform:scale(2.2)}to{opacity:.95;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
#boot.play .bootlogo .logo{animation:logoIn .9s cubic-bezier(.2,1.7,.4,1) .75s forwards,glow 1.6s ease-in-out 1.7s infinite}
@keyframes logoIn{from{opacity:0;transform:scale(0) rotate(-200deg);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
@keyframes glow{50%{box-shadow:0 0 70px rgba(127,90,240,.9),0 0 140px rgba(79,140,255,.5)}}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.9),transparent 55%);opacity:0;pointer-events:none;z-index:3}
#boot.play .flash{animation:flash .7s ease-out .8s}
@keyframes flash{15%{opacity:.85}100%{opacity:0}}
#bootBrand{font-size:38px;font-weight:900;letter-spacing:1px;position:relative;overflow:hidden;padding:0 4px}
#bootBrand span{display:inline-block;opacity:0}
#bootBrand span.g{background:linear-gradient(90deg,#7f5af0,#4f8cff,#2cb67d);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot.play #bootBrand span{animation:letterIn .55s cubic-bezier(.2,1.4,.4,1) calc(1.25s + var(--i)*.08s) forwards}
@keyframes letterIn{from{opacity:0;transform:translateY(26px) scale(.6);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#bootBrand::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg)}
#boot.play #bootBrand::after{animation:sweep .9s ease 2s}
@keyframes sweep{to{left:130%}}
#boot .bootbar,#boot .boottxt{opacity:0}
#boot.play .bootbar,#boot.play .boottxt{animation:fadeIn .4s ease 1.7s forwards}
@keyframes fadeIn{to{opacity:1}}
#boot.out .center{animation:zoomOut .45s ease forwards}
@keyframes zoomOut{to{opacity:0;transform:scale(1.35);filter:blur(6px)}}

/* ---------- Secret-Code ---------- */
#pin{position:fixed;inset:0;z-index:1980;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#pin.open{display:flex}
.pinbox{width:min(320px,100%);border-radius:28px;padding:24px 22px;text-align:center;background:var(--panel-solid);color:var(--text);box-shadow:var(--shadow);animation:pop .2s ease}
.pinbox .pi{font-size:40px}
.pinbox b{display:block;font-size:17px;margin:6px 0 16px}
.pindots{display:flex;justify-content:center;gap:14px;margin-bottom:20px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.pindots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:58px;border-radius:50%;background:var(--hover);font-size:24px;font-weight:600;max-width:72px;width:100%;margin:auto}
.pinpad button:active{background:var(--accent);color:#fff}
.pinpad button.txt{font-size:14px;background:none}

/* ---------- Einrichtung ---------- */
#setup{background:#0b0b12;overflow:hidden}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
.blob.b1{background:#7f5af0;top:-20vmax;left:-15vmax}
.blob.b2{background:#2cb67d;bottom:-25vmax;right:-15vmax;animation-delay:-6s}
.blob.b3{background:#ec4899;top:30%;left:40%;width:40vmax;height:40vmax;animation-delay:-12s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#setupCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,92vw);max-height:92vh;overflow:auto;border-radius:28px;padding:34px 30px 26px;background:var(--panel);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:24px}
.dots i{width:7px;height:7px;border-radius:5px;background:var(--border);transition:.3s}
.dots i.on{width:22px;background:var(--accent)}
.s-body{animation:stepIn .4s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}}
.s-hello{font-size:clamp(52px,14vw,76px);font-weight:800;letter-spacing:-2px;background:linear-gradient(90deg,#7f5af0,#4f8cff,#2cb67d,#ff8906,#ec4899);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;margin:10px 0 8px;transition:opacity .4s}
@keyframes shine{to{background-position:300% 0}}
.s-ico{font-size:50px;margin-bottom:10px}
#setupCard h1{font-size:26px;letter-spacing:-.5px;margin-bottom:8px}
.s-sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:22px}
.s-err{color:#ff453a;font-size:14px;min-height:20px;margin-top:8px}
.s-foot{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.s-foot .btn{flex:1}
.pwwrap{position:relative;margin-bottom:10px}
.pwwrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
.strength{height:5px;border-radius:5px;background:var(--hover);overflow:hidden;margin-top:6px}
.strength i{display:block;height:100%;width:0;transition:.3s}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.themecard{border-radius:16px;padding:10px;border:2px solid var(--border);transition:.2s}
.themecard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.themecard .pv{height:74px;border-radius:10px;margin-bottom:8px;position:relative;overflow:hidden}
.themecard .pv i{position:absolute;left:10px;right:10px;height:10px;border-radius:5px}
.colors{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.colors button{width:34px;height:34px;border-radius:50%;outline:2px solid transparent;outline-offset:3px;transition:.2s}
.colors button.sel{outline-color:var(--text);transform:scale(1.1)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.walls button{aspect-ratio:3/4;border-radius:14px;border:3px solid transparent;transition:.2s}
.walls button.sel{border-color:var(--accent);transform:scale(1.04)}
.summary{text-align:left;margin:4px 0 22px}

/* ---------- Sperrbildschirm ---------- */
#lock{color:#fff}
#lock .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}
.lk-top{position:absolute;top:10px;right:16px;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.lk-time{position:absolute;top:11vh;width:100%;text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.lk-time .d{font-size:20px;font-weight:600;opacity:.9}
.lk-time .t{font-size:clamp(80px,22vw,120px);font-weight:700;letter-spacing:-3px;line-height:1.05}
.lk-login{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,86vw)}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a855f7);display:grid;place-items:center;font-size:36px;font-weight:700;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.6)}
.lk-name{font-size:20px;font-weight:600}
.lk-field{display:flex;width:100%;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;border:1px solid rgba(255,255,255,.3);overflow:hidden}
.lk-field input{flex:1;min-width:0;background:none;border:none;outline:none;padding:13px 16px;color:#fff;font-size:16px}
.lk-field input::placeholder{color:rgba(255,255,255,.7)}
.lk-field button{width:50px;font-size:20px;color:#fff;background:rgba(255,255,255,.15)}
.lk-err{min-height:18px;font-size:14px;color:#ffd1cf;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* ---------- Desktop ---------- */
#statusbar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;font-weight:600;z-index:500;border-width:0 0 1px 0}
#statusbar .left,#statusbar .right{display:flex;align-items:center;gap:8px}
.sb-btn{padding:3px 8px;border-radius:7px;display:flex;align-items:center;gap:6px}
.sb-btn:hover{background:var(--hover)}
.sb-coins{color:var(--gold);font-weight:800}
#menu{position:absolute;top:34px;left:8px;width:230px;border-radius:14px;padding:6px;z-index:600;display:none;box-shadow:var(--shadow);animation:pop .15s ease}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px}
#menu button:hover{background:var(--accent);color:#fff}
#menu hr{border:none;border-top:1px solid var(--border);margin:5px 6px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-6px)}}

#home{position:absolute;inset:30px 0 0 0;padding:22px 22px 110px;overflow:auto}
.homeinner{max-width:820px;margin:0 auto}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.widget{border-radius:22px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:left}
.widget .wt{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.widget .big{font-size:38px;font-weight:700;letter-spacing:-1px}
.wbatt{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:22px 10px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;font-size:12.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
.appicon:active .ic{transform:scale(.9)}
.appicon:hover .ic{transform:translateY(-3px)}

/* ---------- App-Ansicht ---------- */
#appview{position:absolute;inset:30px 0 0 0;z-index:100;display:none;flex-direction:column;background:var(--bg);animation:appIn .28s cubic-bezier(.2,.9,.3,1.1)}
#appview.open{display:flex}
#appview.closing{animation:appOut .2s ease forwards}
@keyframes appIn{from{opacity:0;transform:scale(.92) translateY(20px)}}
@keyframes appOut{to{opacity:0;transform:scale(.92) translateY(20px)}}
.apphead{height:54px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;border-bottom:1px solid var(--border);background:var(--panel-solid)}
.appbody{flex:1;overflow:auto;padding:18px 16px 110px}
.appinner{max-width:760px;margin:0 auto}

/* ---------- Home-Taste ---------- */
#homebtn{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:62px;height:62px;border-radius:50%;z-index:450;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:transform .12s}
#homebtn::after{content:"";width:22px;height:22px;border:2.5px solid var(--text);border-radius:7px;opacity:.85}
#homebtn:active{transform:translateX(-50%) scale(.88)}

/* ---------- Kontrollzentrum ---------- */
#cc{position:absolute;top:36px;right:8px;width:min(350px,95vw);border-radius:22px;padding:14px;z-index:600;display:none;box-shadow:var(--shadow);animation:pop .18s ease}
#cc.open{display:block}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cc-tile{display:flex;align-items:center;gap:10px;padding:11px;border-radius:16px;background:var(--hover);text-align:left;transition:.2s;min-width:0}
.cc-tile span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--border);font-size:16px;flex:none}
.cc-tile b{display:block;font-size:13px}.cc-tile small{font-size:11px;color:var(--muted)}
.cc-tile.on span{background:var(--accent);color:#fff}
.cc-slider{display:flex;align-items:center;gap:10px;background:var(--hover);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.cc-slider input{flex:1;accent-color:var(--accent)}
.cc-batt{display:flex;align-items:center;gap:12px;background:var(--hover);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.cc-batt .batt{width:38px;height:18px;border-radius:5px}
.cc-batt .batt::after{top:5px;height:6px;right:-5px;width:3px}
.cc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc-actions button{padding:10px 4px;border-radius:14px;background:var(--hover);font-size:13px;font-weight:600}
.cc-actions button:hover{background:var(--accent);color:#fff}

/* ---------- Mitteilungen ---------- */
#toasts{position:fixed;top:40px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:1900;width:min(340px,94vw);pointer-events:none}
.toast{touch-action:none;cursor:grab;transition:transform .25s,opacity .25s;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tIn .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto;color:var(--text)}
.toast.out{animation:tOut .3s ease forwards}
.toast .ic{width:38px;height:38px;font-size:19px;border-radius:10px;flex:none}
.toast b{font-size:14px;display:block}.toast small{font-size:13px;color:var(--muted)}
@keyframes tIn{from{opacity:0;transform:translateX(40px)}}
@keyframes tOut{to{opacity:0;transform:translateX(40px)}}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2000;transition:opacity .2s}
.coinpop{position:fixed;left:50%;top:45%;font-size:46px;font-weight:900;color:var(--gold);text-shadow:0 4px 24px rgba(0,0,0,.45);z-index:1950;pointer-events:none;animation:cp 1.3s ease forwards;white-space:nowrap}
@keyframes cp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}

/* ---------- Akku leer ---------- */
#empty{background:#000;color:#fff}
.bigbatt{width:130px;height:60px;border:4px solid #ff3b30;border-radius:13px;position:relative;padding:5px}
.bigbatt::after{content:"";position:absolute;right:-13px;top:17px;width:8px;height:18px;background:#ff3b30;border-radius:0 4px 4px 0}
.bigbatt i{display:block;height:100%;background:#ff3b30;border-radius:5px;width:0;transition:width .5s}
.bigbatt.ok{border-color:#34c759}.bigbatt.ok::after,.bigbatt.ok i{background:#34c759}
.blink{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.12}}
#emptyTitle{font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:2px;color:#ff3b30}
#emptyTitle.ok{color:#34c759;letter-spacing:0}
.ebtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ebtns .btn{background:#1c1c1e;color:#fff}
.ebtns .btn.primary{background:#34c759}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:80vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px 30px;transition:transform .35s cubic-bezier(.2,.9,.3,1);color:var(--text);background:var(--panel-solid);z-index:5}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--border);margin:0 auto 14px}

/* ---------- Quests ---------- */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.hero>div{border-radius:18px;padding:14px 16px;background:var(--panel-2)}
.hero small{color:var(--muted);font-weight:600;font-size:12.5px}
.hero b{display:block;font-size:28px;letter-spacing:-.5px}
.hero .gold{background:linear-gradient(135deg,#ffd60a,#f5a524);color:#3a2600}
.hero .gold small{color:#6b4a00}
.qcard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--panel-2);margin-bottom:10px;border-left:5px solid var(--dc);animation:stepIn .3s ease}
.qic{font-size:28px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--hover);flex:none}
.qt{flex:1;min-width:0}
.qt b{font-size:15.5px;line-height:1.3;display:block}
.qt small{font-size:12.5px}
.coin{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--gold);font-size:15px;margin-top:4px}
.qbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.qdone{background:#34c759;color:#fff;padding:9px 12px;border-radius:11px;font-weight:700;font-size:13px;min-width:96px}
.qdone.sure{background:#ff9500}
.qre{background:var(--hover);padding:7px;border-radius:11px;font-size:13px;font-weight:600}
.hist{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);font-size:14px}

/* ---------- Shop & Inventar ---------- */
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--panel-2);margin-bottom:12px}
.itemic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.price{font-weight:800;color:var(--gold)}
.emptyinv{text-align:center;padding:36px 10px;color:var(--muted);line-height:1.6}
.emptyinv div{font-size:54px}
.barwrap{height:14px;border-radius:10px;background:var(--hover);overflow:hidden;margin:8px 0 4px}
.barwrap i{display:block;height:100%;border-radius:10px;transition:width .5s}

/* ---------- Standort ---------- */
.locstat{border-radius:22px;padding:22px;color:#fff;text-align:center;margin-bottom:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.locstat .e{font-size:56px;line-height:1.1}
.locstat h2{font-size:24px;margin:6px 0 2px}
.locstat p{opacity:.9;font-size:15px}
.map{width:100%;height:220px;border:0;border-radius:14px;margin:10px 0;background:var(--hover)}

/* ---------- Einstellungen ---------- */
.wallsmall{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.wallsmall button{aspect-ratio:3/4;border-radius:12px;border:3px solid transparent}
.wallsmall button.sel{border-color:var(--accent)}

@media (max-width:700px){
  #home{padding:18px 14px 110px}
  .apps{grid-template-columns:repeat(4,1fr);gap:20px 6px}
  .ic{width:60px;height:60px}
  .widget .big{font-size:32px}
  #sbApp{display:none}
  .appbody{padding:14px 12px 110px}
}
</style>
</head>

<script>
/* =========================================================
   GufyUI
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=s=>{const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstElementChild};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtNum=n=>Math.round(n).toLocaleString('de-DE');
const fmtPct=x=>x.toFixed(1).replace('.',',')+' %';

/* ---------- Speicher ---------- */
const KEY='gufyui_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
function defaults(){
  S.theme??='dark'; S.accent??='#4f8cff'; S.wall??=0;
  S.brightness??=100; S.dnd??=false;
  S.coins??=0; S.inv??={}; S.questDone??=[];
  S.loc??={mode:'manual',isHome:true,home:null,radius:150};
  S.sleep??={from:'22:00',to:'06:00'};
  S.battery??={level:100,last:Date.now()};
}
defaults();
function hash(s){let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))|0;return 'h'+(x>>>0).toString(36)}

const WALLS=[
  'radial-gradient(at 20% 20%,#7f5af0 0,transparent 50%),radial-gradient(at 80% 30%,#2cb67d 0,transparent 50%),radial-gradient(at 50% 95%,#ff8906 0,transparent 55%),#16161a',
  'radial-gradient(at 70% 20%,#00c6ff,transparent 50%),radial-gradient(at 20% 80%,#0072ff,transparent 55%),#001b3a',
  'radial-gradient(at 30% 20%,#ff9a9e,transparent 55%),radial-gradient(at 80% 80%,#a18cd1,transparent 55%),linear-gradient(135deg,#fbc2eb,#a6c1ee)',
  'linear-gradient(160deg,#ff512f,#dd2476 50%,#1a0b2e)',
  'radial-gradient(at 50% 0%,#a8e063,transparent 60%),linear-gradient(180deg,#56ab2f,#0b3d1e)',
  'linear-gradient(135deg,#0f2027,#203a43,#2c5364)',
  'radial-gradient(at 20% 30%,#f7971e,transparent 50%),radial-gradient(at 80% 70%,#ffd200,transparent 50%),#3a1c00',
  'radial-gradient(at 50% 50%,#434343,#000)',
  'linear-gradient(200deg,#e0eafc,#cfdef3 40%,#89a8d6)'
];
const ACCENTS=['#4f8cff','#a855f7','#ec4899','#f97316','#22c55e','#14b8a6','#eab308','#ef4444'];

function applyLook(){
  document.body.classList.toggle('dark',S.theme==='dark');
  document.documentElement.style.setProperty('--accent',S.accent);
  $$('.wall').forEach(w=>w.style.background=WALLS[S.wall]||WALLS[0]);
  $('#dim').style.opacity=(1-S.brightness/100)*0.75;
  const ini=(S.name||'?').trim().charAt(0).toUpperCase()||'?';
  $$('.js-initial').forEach(e=>e.textContent=ini);
  $$('.js-name').forEach(e=>e.textContent=S.name||'');
  updateCC();updateCoins();
}
function updateCoins(){$$('.js-coins').forEach(e=>e.textContent=fmtNum(S.coins))}

let current='';
function show(id){$$('.screen').forEach(s=>s.classList.toggle('active',s.id===id));current=id}

/* ---------- Uhrzeit ---------- */
function tick(){
  const d=new Date();
  const t=pad(d.getHours())+':'+pad(d.getMinutes());
  $$('.js-time').forEach(e=>e.textContent=t);
  const ld=d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  $$('.js-date').forEach(e=>e.textContent=ld);
  const hr=d.getHours();
  const g=hr<5?'Gute Nacht':hr<11?'Guten Morgen':hr<14?'Mahlzeit':hr<18?'Guten Tag':hr<22?'Guten Abend':'Gute Nacht';
  $$('.js-greet').forEach(e=>e.textContent=g+(S.name?', '+S.name:'')+' 👋');
}
setInterval(tick,1000);

/* =========================================================
   AKKU – läuft in Echtzeit, auch wenn GufyUI geschlossen ist
   Unterwegs:            100 % in 24 Std.  → −4,17 %/h
   Zu Hause (wach):      lädt langsam      → +2 %/h
   Zu Hause (Schlafen):  8 Std. = 100 %    → +12,5 %/h
   ========================================================= */
let adminOK=false;const ADMIN='hyjfacf';
const R_AWAY=-100/24, R_HOME=2, R_SLEEP=100/8;
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
function isSleepTime(d){
  const m=d.getHours()*60+d.getMinutes(),f=toMin(S.sleep.from),t=toMin(S.sleep.to);
  if(f===t)return false;
  return f<t?(m>=f&&m<t):(m>=f||m<t);
}
function rate(d){if(!S.loc.isHome)return R_AWAY;return isSleepTime(d)?R_SLEEP:R_HOME}
function advance(){
  const now=Date.now();
  let t=S.battery.last||now;
  if(now-t>60*864e5)t=now-60*864e5;          // max. 60 Tage nachrechnen
  let lv=S.battery.level;
  while(t<now){
    const st=Math.min(now-t,60000-(t%60000)); // minutengenau
    lv+=rate(new Date(t))*st/3600000;
    lv=Math.max(0,Math.min(100,lv));
    t+=st;
  }
  S.battery.level=lv;S.battery.last=now;
}
const dispPct=()=>{const l=S.battery.level;return l<=0?0:Math.min(100,Math.ceil(l-1e-9))};
const charging=()=>rate(new Date())>0&&S.battery.level<99.95;
function fmtDur(hrs){const m=Math.round(hrs*60),H=Math.floor(m/60),M=m%60;return H?`${H} Std. ${M} Min.`:`${M} Min.`}
function statusInfo(){
  if(!S.loc.isHome)return{ic:'🚶',t:'Unterwegs',r:'−4,2 % pro Std.',col:'linear-gradient(135deg,#ff9500,#ff5e3a)'};
  if(isSleepTime(new Date()))return{ic:'😴',t:'Schlafenszeit',r:'+12,5 % pro Std.',col:'linear-gradient(135deg,#5e5ce6,#2b1f7a)'};
  return{ic:'🏠',t:'Zu Hause',r:'+2 % pro Std.',col:'linear-gradient(135deg,#34c759,#0a8f3c)'};
}
function remainText(){
  const lv=S.battery.level;
  if(rate(new Date())<0)return 'Reicht noch '+fmtDur(lv/(-R_AWAY));
  if(lv>=99.95)return 'Voll geladen';
  let t=Date.now(),l=lv;
  for(let i=0;i<4320;i++){l+=rate(new Date(t))/60;t+=60000;if(l>=100)return 'Voll in '+fmtDur((t-Date.now())/3600000)}
  return 'Lädt …';
}
let saveCount=0;
function batteryTick(){
  advance();
  const lv=S.battery.level;
  if(lv<=0){S.w20=S.w10=true}
  if(rate(new Date())<0){
    if(lv<=20&&!S.w20){S.w20=true;notify('🔋','Akku schwach','Noch 20 %. Geh nach Hause oder nutze eine Powerbank.','#ff3b30')}
    if(lv<=10&&!S.w10){S.w10=true;notify('🪫','Akku fast leer','Nur noch 10 %!','#ff3b30')}
  }
  if(lv>25){S.w20=false;S.w10=false}
  if(lv>=99.95&&S.wasCharging){S.wasCharging=false;notify('🔋','Voll geladen','Dein Akku ist bei 100 %.','#34c759')}
  if(charging())S.wasCharging=true;
  if(lv<=0&&!['empty','setup','boot','off'].includes(current))batteryDead();
  if(current==='empty')updateEmpty();
  renderBattery();
  if(++saveCount%5===0)save();
}
function renderBattery(){
  const lv=dispPct(),chg=charging(),st=statusInfo();
  $$('.bfill').forEach(f=>f.style.width=lv+'%');
  $$('.batt').forEach(b=>{b.classList.toggle('chg',chg);b.classList.toggle('low',lv<=20&&!chg)});
  $$('.bpct').forEach(e=>e.textContent=lv+'%');
  $$('.bbolt').forEach(e=>e.style.display=chg?'inline':'none');
  $$('.js-bstate').forEach(e=>e.textContent=`${st.ic} ${st.t} · ${st.r}`);
  const rem=remainText();
  $$('.js-bremain').forEach(e=>e.textContent=rem);
  $$('.js-locicon').forEach(e=>e.textContent=st.ic);
  const col=chg?'#34c759':lv<=20?'#ff3b30':'var(--accent)';
  const r=$('#ring');if(r)r.style.background=`radial-gradient(var(--panel-solid) 58%,transparent 59%),conic-gradient(${col} ${lv*3.6}deg,var(--hover) 0)`;
}
function batteryDead(){
  closeAppNow();closeMenus();
  show('empty');updateEmpty();
}
function updateEmpty(){
  const lv=S.battery.level,dead=lv<=0;
  const t=$('#emptyTitle');
  t.textContent=dead?'AKKU LEER':'Akku: '+dispPct()+' %';
  t.classList.toggle('blink',dead);t.classList.toggle('ok',!dead);
  $('#bigBatt').classList.toggle('ok',!dead);
  $('#bigBatt i').style.width=Math.min(100,lv)+'%';
  const st=statusInfo();
  $('#emptyTxt').textContent=dead
    ?(S.loc.isHome?`${st.ic} Lädt …`:'')
    :'';
  $('#eHome').textContent=S.loc.mode==='gps'?'📍 Standort prüfen':(S.loc.isHome?'🚶 Ich bin unterwegs':'🏠 Ich bin zu Hause');
  $('#eOn').style.display=dead?'none':'';
}
$('#eInv').onclick=()=>{renderInventory($('#eInvBody'),updateEmpty);$('#eSheet').classList.add('open')};
$('#eSheetClose').onclick=()=>$('#eSheet').classList.remove('open');
$('#eHome').onclick=()=>{if(S.loc.mode==='gps'){checkGeoOnce()}else askHome(!S.loc.isHome,updateEmpty)};
$('#eOn').onclick=()=>{$('#eSheet').classList.remove('open');boot()};
setInterval(batteryTick,1000);
addEventListener('visibilitychange',()=>{batteryTick();save()});

/* ---------- Zuhause / Unterwegs ---------- */
function setHome(v,quiet){
  if(S.loc.isHome===v)return;
  advance();S.loc.isHome=v;save();
  if(!quiet)notify(v?'🏠':'🚶',v?'Willkommen zu Hause':'Du bist unterwegs',v?'Dein Akku lädt jetzt wieder.':'Dein Akku wird jetzt verbraucht (100 % = 24 Std.).',v?'#34c759':'#ff9500');
  renderBattery();updateCC();
  if(appCtx&&appCtx.refresh)appCtx.refresh();
}

/* ---------- GPS ---------- */
let geoWatch=null,geoPos=null,geoErr='';
function distM(a,b){const R=6371000,toR=x=>x*Math.PI/180;const dLa=toR(b.lat-a.lat),dLo=toR(b.lon-a.lon);
  const q=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function onGeo(p){
  geoPos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};geoErr='';
  if(S.loc.mode==='gps'&&S.loc.home)setHome(distM(geoPos,S.loc.home)<=S.loc.radius);
  if(current==='empty')updateEmpty();
  if(appCtx&&appCtx.refresh)appCtx.refresh();
}
function onGeoErr(e){
  geoErr=e.code===1?'Standortzugriff wurde abgelehnt. Erlaube ihn im Browser oder nutze den manuellen Modus.':'Standort konnte nicht ermittelt werden.';
  if(appCtx&&appCtx.refresh)appCtx.refresh();
}

let bootRaf=null;
function bootParticles(){
  const cv=$('#bootCv'),g=cv.getContext('2d'),dpr=devicePixelRatio||1;
  const W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  const cx=W/2,cy=H*.45,cols=['#7f5af0','#4f8cff','#2cb67d','#ffd60a','#ff8906','#ec4899'];
  const P=Array.from({length:160},()=>{const a=Math.random()*7,d=Math.max(W,H)*(.55+Math.random()*.5);
    return{sx:cx+Math.cos(a)*d,sy:cy+Math.sin(a)*d,a2:Math.random()*7,v:80+Math.random()*420,r:1+Math.random()*2.6,c:cols[Math.floor(Math.random()*cols.length)],del:Math.random()*.25}});
  const t0=performance.now();cancelAnimationFrame(bootRaf);
  const ease=x=>1-Math.pow(1-x,3);
  (function fr(now){
    const t=(now-t0)/1000;g.clearRect(0,0,W,H);
    for(const p of P){
      let x,y,al=1;
      if(t<.8){const k=ease(Math.min(1,Math.max(0,(t-p.del)/(.8-p.del))));x=p.sx+(cx-p.sx)*k;y=p.sy+(cy-p.sy)*k;al=k}
      else{const e=t-.8;x=cx+Math.cos(p.a2)*p.v*e*(1-e*.18);y=cy+Math.sin(p.a2)*p.v*e*(1-e*.18);al=Math.max(0,1-e/2)}
      g.globalAlpha=al;g.fillStyle=p.c;g.shadowColor=p.c;g.shadowBlur=10;g.beginPath();g.arc(x,y,p.r,0,7);g.fill();
    }
    g.globalAlpha=1;
    if(t<3.2&&current==='boot')bootRaf=requestAnimationFrame(fr);else g.clearRect(0,0,W,H);
  })(t0);
}
function boot(){
  advance();
  show('boot');
  const bt=$('#boot');bt.classList.remove('play','out');void bt.offsetWidth;bt.classList.add('play');
  bootParticles();
  const f=$('#bootFill');f.style.transition='none';f.style.width='0';
  $('#bootTxt').textContent=S.setupDone?(S.name?'Willkommen zurück, '+S.name:'Wird gestartet …'):'Willkommen';
  setTimeout(()=>{f.style.transition='width 1.1s cubic-bezier(.6,.1,.3,1)';f.style.width='100%'},1750);
  setTimeout(()=>bt.classList.add('out'),2950);
  setTimeout(()=>{
    advance();
    if(S.setupDone&&S.battery.level<=0){batteryDead();return}
    applyLook();
    if(!S.setupDone){step=0;show('setup');renderSetup()}
    else if(S.loggedIn)enterDesktop();
    else showLock();
  },3400);
}

function notify(icon,title,text,color){
  if(S.dnd)return;
  const t=h(`<div class="toast glass"><div class="ic" style="background:${color||'var(--accent)'}">${icon}</div><div><b>${esc(title)}</b><small>${esc(text)}</small></div></div>`);
  $('#toasts').prepend(t);
  let gone=false,sx=0,sy=0,dx=0,dy=0,drag=false;
  const kill=(dir)=>{if(gone)return;gone=true;
    if(dir){t.style.transform=dir==='up'?'translateY(-140%)':`translateX(${dir*120}%)`;t.style.opacity=0;setTimeout(()=>t.remove(),260)}
    else{t.classList.add('out');setTimeout(()=>t.remove(),300)}};
  t.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;dx=dy=0;t.style.transition='none';t.setPointerCapture(e.pointerId)});
  t.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;dy=Math.min(0,e.clientY-sy);
    t.style.transform=Math.abs(dx)>-dy?`translateX(${dx}px)`:`translateY(${dy}px)`;t.style.opacity=1-Math.min(.8,Math.max(Math.abs(dx),-dy)/220)});
  const end=()=>{if(!drag)return;drag=false;t.style.transition='';
    if(Math.abs(dx)>70)kill(Math.sign(dx));else if(dy<-35)kill('up');
    else{t.style.transform='';t.style.opacity=''}};
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  setTimeout(()=>{if(!drag)kill()},5000);
}

const snapCoins=(raw,diff)=>COINSTEPS[diff].reduce((b,v)=>Math.abs(v-raw)<Math.abs(b-raw)?v:b);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nice=n=>n<20?n:n<100?Math.round(n/5)*5:n<1000?Math.round(n/10)*10:Math.round(n/500)*500;
const coinsR=c=>Math.max(5,Math.round(c/5)*5);
function genQuest(diff,avoid){
  let q;
  const own=(S.customQ||[]).filter(x=>x.diff===diff);
  for(let k=0;k<40;k++){
    if(own.length&&Math.random()<.3){
      const o=own[rnd(0,own.length-1)];q={i:o.i,title:o.title,coins:o.coins,tag:'own',hint:''};
    }else if(Math.random()<.45){
      const opts=QT.filter(x=>x.r[diff]),tpl=opts[rnd(0,opts.length-1)],[a,b]=tpl.r[diff],n=nice(rnd(a,b));
      q={i:tpl.i,title:tpl.t(n),coins:snapCoins(tpl.c(n),diff),tag:tpl.g,hint:tpl.h||''};
    }else{
      const L=QF[diff],f=L[rnd(0,L.length-1)];
      q={i:f[0],title:f[1],coins:f[2],tag:f[3],hint:f[4]||''};
    }
    const same=avoid.some(x=>x.title===q.title||x.i===q.i);
    if(!same)break;
  }
  q.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);q.diff=diff;
  return q;
}
function ensureQuests(){
  S.quests??={};
  DIFFS.forEach(([d])=>{S.quests[d]??=[];while(S.quests[d].length<6)S.quests[d].push(genQuest(d,S.quests[d]))});
}

    $$('[data-tab]',body).forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
    if(tab==='profil'){
      c.innerHTML=`<div style="text-align:center;margin:10px 0 20px"><div class="avatar" style="margin:0 auto 10px">${esc((S.name||'?')[0].toUpperCase())}</div><h2 style="font-size:22px">${esc(S.name)}</h2><span class="muted">🪙 ${fmtNum(S.coins)} Coins · 🏆 ${S.questDone.length} Quests</span></div>
        <div class="label">Name ändern</div>
        <div style="display:flex;gap:8px"><input class="input" id="pName" value="${esc(S.name)}" maxlength="24"><button class="btn primary" id="pSave">Sichern</button></div>`;
      $('#pSave',c).onclick=()=>{const v=$('#pName',c).value.trim();if(!v)return;S.name=v;save();applyLook();tick();go('profil');notify('👤','Profil aktualisiert','Hallo, '+v+'!')};
    }
    if(tab==='look'){
      c.innerHTML=`<div class="card"><div class="row"><span>Modus</span><div class="seg" style="width:auto"><button data-th="light" class="${S.theme==='light'?'on':''}">Hell</button><button data-th="dark" class="${S.theme==='dark'?'on':''}">Dunkel</button></div></div>
        <div class="row"><span>Helligkeit</span><input type="range" min="25" max="100" value="${S.brightness}" id="lBr" style="accent-color:var(--accent);width:50%"></div></div>
        <div class="label">Akzentfarbe</div>
        <div class="card" style="padding:16px"><div class="colors">${ACCENTS.map(a=>`<button data-acc="${a}" class="${a===S.accent?'sel':''}" style="background:${a}"></button>`).join('')}</div></div>`;
      $$('[data-th]',c).forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyLook();renderBattery();go('look')});
      $$('[data-acc]',c).forEach(b=>b.onclick=()=>{S.accent=b.dataset.acc;save();applyLook();go('look')});
      $('#lBr',c).oninput=e=>{S.brightness=+e.target.value;save();applyLook()};
    }
    if(tab==='wall'){
      c.innerHTML=`<div class="wallsmall">${WALLS.map((w,i)=>`<button data-w="${i}" class="${i===S.wall?'sel':''}" style="background:${w}"></button>`).join('')}</div>`;
      $$('[data-w]',c).forEach(b=>b.onclick=()=>{S.wall=+b.dataset.w;save();applyLook();go('wall')});
    }
    if(tab==='pw'){
      c.innerHTML=`<input class="input" type="password" id="o" placeholder="Aktuelles Passwort" style="margin-bottom:10px">
        <input class="input" type="password" id="n1" placeholder="Neues Passwort (min. 4 Zeichen)" style="margin-bottom:10px">
        <input class="input" type="password" id="n2" placeholder="Neues Passwort wiederholen" style="margin-bottom:14px">
        <button class="btn primary" id="pwS">Passwort ändern</button> <span id="pwE" style="color:#ff453a;font-size:14px;margin-left:8px"></span>`;
      $('#pwS',c).onclick=()=>{
        const o=$('#o',c).value,a=$('#n1',c).value,b=$('#n2',c).value,E=$('#pwE',c);
        if(hash(o)!==S.pw)return E.textContent='Aktuelles Passwort ist falsch.';
        if(a.length<4)return E.textContent='Mindestens 4 Zeichen.';
        if(a!==b)return E.textContent='Passwörter stimmen nicht überein.';
        S.pw=hash(a);save();go('pw');notify('🔒','Passwort geändert','Dein neues Passwort ist aktiv.','#34c759');
      };
    }
    if(tab==='admin'){
      if(!adminOK){
        c.innerHTML=`<div style="text-align:center;margin:20px 0"><div style="font-size:54px">🛠️</div><h2 style="font-size:22px;margin:6px 0 16px">Admin-Panel</h2>
          <input class="input" id="aCode" type="password" inputmode="numeric" placeholder="Secret Code" style="max-width:240px;text-align:center;font-size:20px;letter-spacing:6px"><br>
          <button class="btn primary" id="aGo" style="margin-top:12px">Entsperren</button><div class="s-err" id="aErr"></div></div>`;
        const tryIt=()=>{if(hash($('#aCode',c).value)===ADMIN){adminOK=true;go('admin')}else{$('#aErr',c).textContent='Falscher Code';$('#aCode',c).value='';const x=$('#aCode',c);x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake')}};
        $('#aGo',c).onclick=tryIt;$('#aCode',c).onkeydown=e=>{if(e.key==='Enter')tryIt()};
        setTimeout(()=>$('#aCode',c)?.focus(),50);
        return;
      }
      advance();
      c.innerHTML=`<div class="label">🔋 Akku · <span id="aLv">${fmtPct(S.battery.level)}</span></div>
        <div class="card" style="padding:14px">
          <input type="range" id="aRange" min="0" max="100" step="1" value="${Math.round(S.battery.level)}" style="width:100%;accent-color:var(--accent)">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
            <button class="btn danger" id="aDead">💀 Sofort leer</button><button class="btn" data-bd="-10">−10 %</button><button class="btn" data-bd="10">+10 %</button><button class="btn primary" id="aFull">⚡ Voll</button></div></div>
        <div class="label">🪙 Coins</div>
        <div class="card" style="padding:14px"><div style="display:flex;gap:8px"><input class="input" id="aCoins" type="number" min="0" value="${S.coins}"><button class="btn primary" id="aCSet">Setzen</button></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" data-cd="100">+100</button><button class="btn" data-cd="1000">+1000</button><button class="btn" data-cd="10000">+10000</button><button class="btn" id="aC0">Auf 0</button></div></div>
        <div class="label">🎒 Inventar</div>
        <div class="card">${Object.entries(ITEMS).map(([k,it])=>`<div class="row"><span>${it.icon} ${it.name}</span><span style="display:flex;gap:6px;align-items:center"><button class="btn" data-inv="${k}" data-d="-1">−</button><b style="min-width:30px;text-align:center">${S.inv[k]||0}</b><button class="btn" data-inv="${k}" data-d="1">+</button></span></div>`).join('')}</div>
        <div class="label">📍 Standort</div>
        <div class="seg"><button data-ah="1" class="${S.loc.isHome?'on':''}">🏠 Zu Hause</button><button data-ah="0" class="${!S.loc.isHome?'on':''}">🚶 Unterwegs</button></div>
        <div class="label">⚔️ Quests</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="aQNew">🎲 Alle Quests neu</button><button class="btn" id="aQHist">🗑️ Verlauf löschen</button></div>
        <div class="label">👤 Konto</div>
        <div class="card" style="padding:14px"><div style="display:flex;gap:8px;margin-bottom:10px"><input class="input" id="aName" value="${esc(S.name)}" maxlength="24"><button class="btn primary" id="aNSet">Name</button></div>
          <div style="display:flex;gap:8px"><input class="input" id="aPw" type="text" placeholder="Neues Passwort"><button class="btn primary" id="aPSet">Passwort</button></div></div>
        <button class="btn" id="aLock" style="width:100%;margin-top:6px">🔒 Admin sperren</button>`;
      const done=t=>{save();renderBattery();updateCoins();updateCC();if(t)notify('🛠️','Admin',t,'#5e5ce6');go('admin')};
      const setLv=v=>{advance();S.battery.level=Math.max(0,Math.min(100,v));S.battery.last=Date.now()};
      $('#aRange',c).oninput=e=>{setLv(+e.target.value);$('#aLv',c).textContent=fmtPct(S.battery.level);renderBattery();save()};
      $('#aDead',c).onclick=()=>{setLv(0);save();batteryDead()};
      $('#aFull',c).onclick=()=>{setLv(100);done('Akku auf 100 %')};
      $$('[data-bd]',c).forEach(b=>b.onclick=()=>{advance();setLv(S.battery.level+ +b.dataset.bd);if(S.battery.level<=0){save();batteryDead()}else done()});
      $('#aCSet',c).onclick=()=>{S.coins=Math.max(0,Math.floor(+$('#aCoins',c).value||0));done('Coins: '+fmtNum(S.coins))};
      $$('[data-cd]',c).forEach(b=>b.onclick=()=>{S.coins+= +b.dataset.cd;done('+'+b.dataset.cd+' Coins')});
      $('#aC0',c).onclick=()=>{S.coins=0;done('Coins auf 0')};
      $$('[data-inv]',c).forEach(b=>b.onclick=()=>{const k=b.dataset.inv;S.inv[k]=Math.max(0,(S.inv[k]||0)+ +b.dataset.d);done()});
      $$('[data-ah]',c).forEach(b=>b.onclick=()=>{setHome(b.dataset.ah==='1');go('admin')});
      $('#aQNew',c).onclick=()=>{S.quests=null;ensureQuests();done('Quests neu generiert')};
      $('#aQHist',c).onclick=()=>{S.questDone=[];done('Verlauf gelöscht')};
      $('#aNSet',c).onclick=()=>{const v=$('#aName',c).value.trim();if(!v)return;S.name=v;applyLook();tick();done('Name geändert')};
      $('#aPSet',c).onclick=()=>{const v=$('#aPw',c).value;if(v.length<4){notify('🛠️','Admin','Mindestens 4 Zeichen','#ff3b30');return}S.pw=hash(v);done('Passwort geändert')};
      $('#aLock',c).onclick=()=>{adminOK=false;go('admin')};
    }
    if(tab==='info'){
      c.innerHTML=`<div style="text-align:center;margin:10px 0 18px"><div class="logo" style="margin:0 auto 12px"><span>G</span></div><div class="brand" style="color:var(--text)">Gufy<i>UI</i></div><span class="muted">Version 2.0</span></div>
        <div class="card"><div class="row"><span>Benutzer</span><b>${esc(S.name)}</b></div><div class="row"><span>Coins</span><b>🪙 ${fmtNum(S.coins)}</b></div><div class="row"><span>Quests geschafft</span><b>${S.questDone.length}</b></div><div class="row"><span>Apps</span><b>${Object.keys(APPS).length}</b></div></div>
        <div class="label">Zurücksetzen</div>
        <div class="card" style="padding:14px"><p class="muted" style="font-size:14px;margin-bottom:12px">Löscht alles – auch Coins, Quests und Inventar – und startet die Einrichtung neu.</p><button class="btn danger" id="rst">Auf Werkseinstellungen zurücksetzen</button></div>`;
      let armed=false;
      $('#rst',c).onclick=e=>{
        if(!armed){armed=true;e.target.textContent='Wirklich alles löschen? Nochmal tippen';return}
        try{localStorage.removeItem(KEY)}catch(_){}
        stopGeo();S={};defaults();closeAppNow();applyLook();boot();
      };
    }
  }
  $$('[data-tab]',body).forEach(b=>b.onclick=()=>go(b.dataset.tab));
  ctx.go=go;go('profil');
}}
};

/* =========================================================
   START
   ========================================================= */
renderHome();applyLook();tick();advance();renderBattery();
if(!S.questsV3){S.quests=null;S.questsV3=true}
if(S.setupDone)ensureQuests();
if(S.loc.mode==='gps'&&S.setupDone)startGeo();
addEventListener('beforeunload',()=>{advance();save()});
addEventListener('pagehide',()=>{advance();save()});
boot();
</script>
</body>
</html>
