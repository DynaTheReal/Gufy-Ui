<script>
/* =====================================================================
   GufyUI-VERSION – bei jedem Update hier die Nummer erhöhen
   und in "notes" kurz reinschreiben, was neu ist.
   "quick":true  = Quick-Update: wird beim nächsten Öffnen SOFORT installiert,
                   ohne Nachfrage – auch bei leerem Akku. Bei normalen Updates weglassen.
   ===================================================================== */
window.GUFY={"v":"11.3","notes":["Neue Coin-Regel: Quests mit den Eltern geben höchstens 50 Coins – draußen und mit fremden Leuten gibt es mehr","Quest-Karten mit dickerem Rand","Assistent: Wissensfragen wie „Was ist ein Bett?“ gehen jetzt an Gufy AI – kein falsches Rechnen oder Hintergrund-Wechseln mehr"]};
/* Update-Schutz: Ist auf dem Gerät noch eine ältere Version installiert,
   läuft diese weiter, bis das Update in den Einstellungen installiert wird. */
(function(){
  if(window.__GUFY_OLD)return;
  function cmp(a,b){a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(var i=0;i<Math.max(a.length,b.length);i++){var d=(a[i]||0)-(b[i]||0);if(d)return d<0?-1:1}return 0}
  window.gufyCmp=cmp;
  try{
    var inst=JSON.parse(localStorage.getItem('gufyui_inst')||'null');
    var st=JSON.parse(localStorage.getItem('gufyui_v1')||'{}');
    var dead=st.battery&&st.battery.level<=0&&!st.betaBatt;   // Akku leer → Update sofort installieren (man kommt sonst nicht zum Installieren)
    if(inst&&inst.html&&cmp(inst.v,GUFY.v)<0&&!dead&&!GUFY.quick){   // Quick-Update → nie die alte Version starten
      localStorage.setItem('gufyui_pending',JSON.stringify({v:GUFY.v,notes:GUFY.notes}));
      document.write(inst.html.replace(/<head>/i,'<head><script>window.__GUFY_OLD=1<\/script>')+'<plaintext style="display:none">');
    }
  }catch(e){}
})();
</script>

<style>
:root{
  --accent:#4f8cff; --gold:#f5a524;
  --bg:#f4f6fb; --panel:rgba(255,255,255,.72); --panel-solid:#ffffff; --panel-2:#f2f3f7;
  --text:#14161c; --muted:#6b7280; --border:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05);
  --shadow:0 24px 70px rgba(0,0,0,.28);
}
body.dark{
  --bg:#0f1115; --panel:rgba(30,32,40,.72); --panel-solid:#14161c; --panel-2:#1f222b;
  --text:#f3f4f6; --muted:#9aa0ab; --border:rgba(255,255,255,.09); --hover:rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:#000;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:block}
.wall{position:absolute;inset:0;transition:background .6s}
.glass{background:var(--panel);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border)}

/* ---------- Bausteine ---------- */
.btn{padding:10px 18px;border-radius:12px;background:var(--hover);font-weight:600;font-size:15px;transition:transform .1s,filter .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,#ffd60a,#f5a524);color:#3a2600}
.btn.danger{background:#ff3b30;color:#fff}
.btn.big{padding:14px 30px;font-size:17px;border-radius:16px}
.input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel-2);outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.tinput{padding:8px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel-solid);font-size:16px;outline:none}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--hover);border:1px solid var(--border);transition:.25s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s}
.switch input:checked+span{background:#34c759;border-color:#34c759}
.switch input:checked+span::after{transform:translateX(20px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.card{background:var(--panel-2);border-radius:16px;padding:6px 14px;margin-bottom:14px}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.seg{display:inline-flex;background:var(--hover);border-radius:12px;padding:3px;width:100%}
.seg button{flex:1;padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--panel-solid);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tabs{display:flex;gap:6px;padding:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:20px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--hover)}
.tabs button.on{background:var(--tc,var(--accent));color:#fff}

/* ---------- Akku-Symbol ---------- */
.batt{display:inline-block;position:relative;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1px;vertical-align:middle}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.bfill{display:block;height:100%;background:currentColor;border-radius:2px;transition:width .4s}
.batt.chg .bfill{background:#34c759}
.batt.low .bfill{background:#ff3b30}
.bbolt{display:none;font-size:11px;margin-left:1px}

/* ---------- Boot ---------- */
#boot,#off{background:#000;color:#fff}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.logo{width:88px;height:88px;border-radius:26px;background:conic-gradient(from 210deg,#7f5af0,#4f8cff,#2cb67d,#ffd60a,#ff8906,#ec4899,#7f5af0);display:grid;place-items:center;font-size:48px;font-weight:900;color:#fff;box-shadow:0 10px 40px rgba(127,90,240,.45);letter-spacing:-2px}
.logo span{filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand{font-size:28px;font-weight:800;letter-spacing:-.5px}
.brand i{font-style:normal;background:linear-gradient(90deg,#7f5af0,#4f8cff,#2cb67d);-webkit-background-clip:text;background-clip:text;color:transparent}
.bootbar{width:180px;height:5px;border-radius:5px;background:#2a2a2a;overflow:hidden}
.bootbar i{display:block;height:100%;width:0;background:#fff;border-radius:5px}
.boottxt{font-size:13px;color:#888;letter-spacing:.5px}

/* ---------- Startanimation (clean) ---------- */
#boot{background:#000}
.bmark{width:78px;height:78px;border-radius:24px;background:#fff;color:#000;display:grid;place-items:center;font-size:42px;font-weight:800;letter-spacing:-2px;opacity:0}
#boot.play .bmark{animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes markIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.bmark,#bootBrand,.bootline,#boot .center{will-change:transform,opacity}
#bootBrand{font-size:28px;font-weight:400;color:#fff;letter-spacing:.04em;opacity:0;margin-top:4px}
#bootBrand b{font-weight:800}
#boot.play #bootBrand{animation:track 1.3s cubic-bezier(.2,.8,.2,1) .65s forwards}
@keyframes track{from{opacity:0;transform:translateY(10px) scale(1.12)}to{opacity:1;transform:none}}
.bootline{width:110px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;margin-top:18px}
.bootline i{display:block;height:100%;width:0;background:#fff}
#boot .boottxt{opacity:0;color:#6b6b6b;font-size:13px;letter-spacing:.3px}
#boot.play .bootline,#boot.play .boottxt{animation:fadeIn .6s ease 1.5s forwards}
@keyframes fadeIn{to{opacity:1}}
#boot.out .center{animation:fadeOut .5s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(.97)}}
#appview,.toast,.coinpop,#cc,#menu,#ctxmenu,.pinbox,.sheet{will-change:transform,opacity}
.blob{will-change:transform}

/* ---------- Secret-Code ---------- */
#pin{position:fixed;inset:0;z-index:1980;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#pin.open{display:flex}
.pinbox{width:min(320px,100%);border-radius:28px;padding:24px 22px;text-align:center;background:var(--panel-solid);color:var(--text);box-shadow:var(--shadow);animation:pop .2s ease}
.pinbox .pi{font-size:40px}
.pinbox b{display:block;font-size:17px;margin:6px 0 16px}
.pindots{display:flex;justify-content:center;gap:14px;margin-bottom:20px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.pindots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:58px;border-radius:50%;background:var(--hover);font-size:24px;font-weight:600;max-width:72px;width:100%;margin:auto}
.pinpad button:active{background:var(--accent);color:#fff}
.pinpad button.txt{font-size:14px;background:none}

/* ---------- Einrichtung ---------- */
#setup{background:#0b0b12;overflow:hidden}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
.blob.b1{background:#7f5af0;top:-20vmax;left:-15vmax}
.blob.b2{background:#2cb67d;bottom:-25vmax;right:-15vmax;animation-delay:-6s}
.blob.b3{background:#ec4899;top:30%;left:40%;width:40vmax;height:40vmax;animation-delay:-12s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#setupCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,92vw);max-height:92vh;overflow:auto;border-radius:28px;padding:34px 30px 26px;background:var(--panel);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:24px}
.dots i{width:7px;height:7px;border-radius:5px;background:var(--border);transition:.3s}
.dots i.on{width:22px;background:var(--accent)}
.s-body{animation:stepIn .4s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}}
.s-hello{font-size:clamp(52px,14vw,76px);font-weight:800;letter-spacing:-2px;background:linear-gradient(90deg,#7f5af0,#4f8cff,#2cb67d,#ff8906,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 8px;transition:opacity .4s}
@keyframes shine{to{background-position:300% 0}}
.s-ico{font-size:50px;margin-bottom:10px}
#setupCard h1{font-size:26px;letter-spacing:-.5px;margin-bottom:8px}
.s-sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:22px}
.s-err{color:#ff453a;font-size:14px;min-height:20px;margin-top:8px}
.s-foot{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.s-foot .btn{flex:1}
.pwwrap{position:relative;margin-bottom:10px}
.pwwrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
.strength{height:5px;border-radius:5px;background:var(--hover);overflow:hidden;margin-top:6px}
.strength i{display:block;height:100%;width:0;transition:.3s}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.themecard{border-radius:16px;padding:10px;border:2px solid var(--border);transition:.2s}
.themecard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.themecard .pv{height:74px;border-radius:10px;margin-bottom:8px;position:relative;overflow:hidden}
.themecard .pv i{position:absolute;left:10px;right:10px;height:10px;border-radius:5px}
.colors{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.colors button{width:34px;height:34px;border-radius:50%;outline:2px solid transparent;outline-offset:3px;transition:.2s}
.colors button.sel{outline-color:var(--text);transform:scale(1.1)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.s-wcats{margin:0 0 12px;padding:2px 0}.s-wcats button{padding:7px 12px;font-size:13px}
.walls button{aspect-ratio:3/4;border-radius:14px;border:3px solid transparent;transition:.2s}
.walls button.sel{border-color:var(--accent);transform:scale(1.04)}
.summary{text-align:left;margin:4px 0 22px}

/* ---------- Sperrbildschirm ---------- */
#lock{color:#fff}
#lock .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}
.lk-top{position:absolute;top:10px;right:16px;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.lk-time{position:absolute;top:11vh;width:100%;text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.lk-time .d{font-size:20px;font-weight:600;opacity:.9}
.lk-time .t{font-size:clamp(80px,22vw,120px);font-weight:700;letter-spacing:-3px;line-height:1.05}
.lk-login{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,86vw)}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a855f7);display:grid;place-items:center;font-size:36px;font-weight:700;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.6)}
.lk-name{font-size:20px;font-weight:600}
.lk-field{display:flex;width:100%;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;border:1px solid rgba(255,255,255,.3);overflow:hidden}
.lk-field input{flex:1;min-width:0;background:none;border:none;outline:none;padding:13px 16px;color:#fff;font-size:16px}
.lk-field input::placeholder{color:rgba(255,255,255,.7)}
.lk-field button{width:50px;font-size:20px;color:#fff;background:rgba(255,255,255,.15)}
.lk-err{min-height:18px;font-size:14px;color:#ffd1cf;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* ---------- Desktop ---------- */
#statusbar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;font-weight:600;z-index:500;border-width:0 0 1px 0}
#statusbar .left,#statusbar .right{display:flex;align-items:center;gap:8px}
.sb-btn{padding:3px 8px;border-radius:7px;display:flex;align-items:center;gap:6px}
.sb-btn:hover{background:var(--hover)}
.sb-coins{color:var(--gold);font-weight:800}
#menu{position:absolute;top:34px;left:8px;width:230px;border-radius:14px;padding:6px;z-index:600;display:none;box-shadow:var(--shadow);animation:pop .15s ease}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px}
#menu button:hover{background:var(--accent);color:#fff}
#menu hr{border:none;border-top:1px solid var(--border);margin:5px 6px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-6px)}}

#home{position:absolute;inset:30px 0 0 0;padding:22px 22px 110px;overflow:auto}
.homeinner{max-width:820px;margin:0 auto}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.widget{border-radius:22px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:left}
.widget .wt{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.widget .big{font-size:38px;font-weight:700;letter-spacing:-1px}
.wbatt{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:22px 10px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;font-size:12.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
.appicon:active .ic{transform:scale(.9)}
.appicon:hover .ic{transform:translateY(-3px)}

/* ---------- App-Ansicht ---------- */
#appview{position:absolute;inset:30px 0 0 0;z-index:100;display:none;flex-direction:column;background:var(--bg);animation:appIn .28s cubic-bezier(.2,.9,.3,1.1)}
#appview.open{display:flex}
#appview.closing{animation:appOut .2s ease forwards}
@keyframes appIn{from{opacity:0;transform:scale(.92) translateY(20px)}}
@keyframes appOut{to{opacity:0;transform:scale(.92) translateY(20px)}}
.apphead{height:54px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;border-bottom:1px solid var(--border);background:var(--panel-solid)}
.appbody{flex:1;overflow:auto;padding:18px 16px 110px}
.appinner{max-width:760px;margin:0 auto}

.appbody.full{padding:0 0 84px;display:flex;flex-direction:column;overflow:hidden}
.appbody.full .appinner{max-width:none;width:100%;flex:1;min-height:0;overflow:auto;position:relative}
.pad{padding:18px}
.fill{display:flex;flex-direction:column;height:100%}
.fill>.grow{flex:1;overflow:auto}
h2.sec{font-size:22px;margin:4px 0 14px;letter-spacing:-.4px}
/* Rechner */
.calc{display:flex;flex-direction:column;height:100%;background:#000;color:#fff;padding:12px}
.calc .disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 10px;min-height:90px}
.calc .expr{font-size:16px;color:#999;min-height:20px}
.calc .val{font-size:clamp(36px,9vw,56px);font-weight:300;word-break:break-all;text-align:right;line-height:1.1}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc .keys button{height:clamp(46px,9vh,64px);border-radius:999px;background:#333;font-size:24px;transition:filter .1s}
.calc .keys button:active{filter:brightness(1.5)}
.calc .keys .fn{background:#a5a5a5;color:#000}
.calc .keys .op{background:#ff9f0a}
.calc .keys .op.sel{background:#fff;color:#ff9f0a}
.calc .keys .zero{grid-column:span 2;text-align:left;padding-left:26px}

/* Notizen */
.notelist button.note{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel-2);margin-bottom:8px}
.notelist button.note:hover{background:var(--hover)}
.note b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note small{color:var(--muted);font-size:12.5px}
.ned{display:flex;flex-direction:column;height:100%}
.ned .bar{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border)}
.ned textarea{flex:1;border:none;outline:none;resize:none;padding:18px;background:transparent;font-size:16px;line-height:1.6}

/* Uhr */
.aclock{width:200px;height:200px;border-radius:50%;margin:10px auto 18px;position:relative;background:var(--panel-2);box-shadow:inset 0 0 0 6px var(--border),0 10px 30px rgba(0,0,0,.15)}
.aclock .mk{position:absolute;left:50%;top:8px;width:2px;height:10px;background:var(--muted);transform-origin:50% 92px}
.aclock .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px}
.aclock .hh{width:6px;height:52px;margin-left:-3px;background:var(--text)}
.aclock .mh{width:4px;height:76px;margin-left:-2px;background:var(--text)}
.aclock .sh{width:2px;height:84px;margin-left:-1px;background:#ff9f0a}
.aclock .cap{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#ff9f0a}
.digital{text-align:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.world .row b{font-size:15px}.world .row span{font-size:22px;font-variant-numeric:tabular-nums;font-weight:300}
.sw{font-size:clamp(46px,12vw,64px);font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:24px 0}
.swbtns{display:flex;justify-content:space-between;max-width:320px;margin:0 auto 18px}
.swbtns button{width:84px;height:84px;border-radius:50%;font-weight:600;background:var(--hover);border:2px solid var(--border)}
.swbtns .go{background:rgba(52,199,89,.2);color:#34c759}
.swbtns .stop{background:rgba(255,59,48,.2);color:#ff3b30}
.laps{max-width:360px;margin:0 auto}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}

/* Kalender */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead b{font-size:20px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--muted);font-weight:700;padding:6px 0}
.calgrid button{aspect-ratio:1;border-radius:50%;font-size:15px;position:relative;max-height:48px;margin:auto;width:100%}
.calgrid button:hover{background:var(--hover)}
.calgrid button.today{background:#ff3b30;color:#fff;font-weight:700}
.calgrid button.sel{outline:2px solid var(--accent)}
.calgrid button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.calgrid .other{opacity:.3}

/* Snake */
.snake{display:flex;flex-direction:column;align-items:center;height:100%;padding:12px;gap:10px;background:#0e1a12;color:#d6ffe0}
.snk-top{display:flex;justify-content:space-between;width:100%;max-width:420px;font-size:15px}
.snake canvas{border-radius:12px;box-shadow:0 0 0 2px #1f3a26;touch-action:none;background:#12241a}
.snk-ctl{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:6px;align-items:center;justify-items:center}
.snk-ctl button{width:52px;height:44px;border-radius:12px;background:#1f3a26;color:#9effb5;font-size:18px}
.snk-row{display:flex;gap:14px;align-items:center}

/* Zeichnen */
.paint{display:flex;flex-direction:column;height:100%}
.ptools{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ptools .sw2{width:26px;height:26px;border-radius:50%;border:2px solid var(--border)}
.ptools .sw2.sel{outline:2px solid var(--accent);outline-offset:2px}
.ptools .tb{padding:6px 10px;border-radius:9px;background:var(--hover);font-size:13px;font-weight:600}
.ptools .tb.on{background:var(--accent);color:#fff}
.pwrap{flex:1;position:relative;background:#fff}
.pwrap canvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}

/* Taschenlampe & Zufall */
.flashapp{height:100%;display:grid;place-items:center;background:#000;transition:background .25s}
.flashapp.on{background:#fff}
.flashbtn{width:120px;height:120px;border-radius:50%;font-size:46px;background:#1c1c1e;color:#888;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.flashapp.on .flashbtn{background:#ffd60a;color:#000;box-shadow:0 0 80px #ffd60a}
.rnd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rbox{background:var(--panel-2);border-radius:20px;padding:16px;text-align:center}
.rbox small{color:var(--muted);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px}
.rbig{font-size:56px;margin:8px 0 12px;min-height:72px;display:grid;place-items:center;font-weight:800}
.rbig.pop{transform:scale(1.1)}

/* Gufy Store */
.storebar{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:24px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.storebar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 22px;border-radius:19px;font-size:11.5px;font-weight:700;color:var(--muted)}
.storebar button span{font-size:20px}
.storebar button.on{background:var(--accent);color:#fff}
.sthead{font-size:32px;font-weight:800;letter-spacing:-.6px;margin:2px 0 14px}
.feat{border-radius:24px;padding:22px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.feat small{font-size:12px;font-weight:800;letter-spacing:.8px;opacity:.85;text-transform:uppercase}
.feat b{font-size:26px;letter-spacing:-.5px}
.feat .big{position:absolute;right:-10px;top:-14px;font-size:120px;opacity:.9;transform:rotate(12deg)}
.strow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.strow .ic{width:58px;height:58px;font-size:29px;border-radius:15px}
.strow .qt b{font-size:16px}
.getbtn{min-width:78px;padding:7px 16px;border-radius:20px;background:var(--hover);color:var(--accent);font-weight:800;font-size:14px}
.getbtn.open{background:var(--accent);color:#fff}
.dl{width:32px;height:32px;border-radius:50%;margin:0 23px;background:conic-gradient(var(--accent) var(--p,0%),var(--hover) 0);position:relative}
.dl::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.rm{font-size:16px;padding:6px;opacity:.6}
.feat .getbtn{background:#fff;color:#0a7d33}.feat .getbtn.open{background:#0a7d33;color:#fff}.feat .rm{filter:brightness(3)}

/* Einstellungen */
.stitle{font-size:32px;font-weight:800;letter-spacing:-.6px;margin:2px 0 16px}
.sback{color:var(--accent);font-size:16px;font-weight:600;padding:2px 0 6px}
.sprof{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--panel-solid);margin-bottom:22px;width:100%;text-align:left;border:1px solid var(--border)}
.sprof .avatar{width:60px;height:60px;font-size:26px;border-width:0;box-shadow:none}
.sprof .sl{flex:1;line-height:1.35}
.sgroup{background:var(--panel-solid);border-radius:18px;overflow:hidden;margin-bottom:22px;border:1px solid var(--border)}
.srow{display:flex;align-items:center;gap:13px;padding:10px 14px;width:100%;text-align:left;font-size:16px;min-height:54px;position:relative}
button.srow:active{background:var(--hover)}
.srow+.srow::before{content:"";position:absolute;top:0;left:59px;right:0;border-top:1px solid var(--border)}
.sic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#fff;flex:none}
.srow .sl{flex:1}
.sv{color:var(--muted);font-size:15px}
.chev{color:var(--muted);font-size:24px;line-height:1;opacity:.55}
.sdanger{color:#ff3b30;justify-content:center;font-weight:600}
.slabel{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:4px 14px 8px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px;margin-bottom:26px}
.wtile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.wprev{width:100%;aspect-ratio:9/19;border-radius:18px;border:3px solid transparent;outline:1px solid var(--border);display:flex;justify-content:center;padding-top:18%;transition:transform .15s}
.wtile.sel .wprev{border-color:var(--accent);transform:scale(1.03)}
.wclock{color:#fff;font-size:20px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.35)}

/* Homescreen-Seiten */
#home{padding:0!important;overflow:hidden!important;touch-action:none;-webkit-touch-callout:none}
#track{display:flex;height:100%;will-change:transform;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
#track.drag{transition:none}
.page{flex:0 0 100%;height:100%;padding:20px 20px 130px;overflow:hidden}
.page .widgets{grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.page .widgets>:first-child{grid-column:1/-1}
.page .widget{padding:14px 16px;cursor:pointer}
.page .widget:first-child{cursor:default}
.page .wbatt{gap:10px}
.page .ring{width:54px;height:54px;font-size:13px}
.appicon{position:relative;cursor:pointer;-webkit-user-drag:none}
.appicon .lbl{max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appicon .del{position:absolute;top:-7px;left:calc(50% - 40px);width:24px;height:24px;border-radius:50%;background:rgba(58,58,60,.95);color:#fff;font-size:18px;font-weight:700;display:none;place-items:center;z-index:2;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#home.edit .appicon .del{display:grid}
#home.edit .appicon .ic{animation:jig .26s ease-in-out infinite alternate;will-change:transform}
#home.edit .appicon:nth-child(2n) .ic{animation-delay:-.13s;animation-direction:alternate-reverse}
@keyframes jig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
#home.edit .widgets{opacity:.5}
.appicon.ph{opacity:.15}
.appicon.lifted .ic{transform:scale(1.14);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.appicon.vanish{transform:scale(.2);opacity:0;transition:transform .22s ease,opacity .22s ease}
.dragclone{position:fixed!important;left:0;top:0;z-index:700;pointer-events:none;will-change:transform;margin:0}
.dragclone .ic{transform:scale(1.15);box-shadow:0 20px 44px rgba(0,0,0,.5);animation:none!important}
.dragclone .del{display:none!important}
#dots{position:absolute;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;pointer-events:none}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .2s,transform .2s}
#dots i.on{background:#fff;transform:scale(1.15)}
#editDone{position:absolute;top:10px;right:12px;z-index:60;padding:7px 18px;border-radius:16px;font-weight:700;font-size:14px;display:none}
#home.edit #editDone{display:block}
#home.edit .page{padding-top:60px}
.page{transition:padding .25s ease}
#ctxmenu{position:fixed;z-index:800;min-width:240px;border-radius:16px;padding:6px;display:none;box-shadow:var(--shadow);animation:pop .18s cubic-bezier(.2,.8,.2,1)}
#ctxmenu.open{display:block}
#ctxmenu button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:11px 12px;border-radius:10px;font-size:15px;text-align:left}
#ctxmenu button:hover{background:var(--hover)}
#ctxmenu .red{color:#ff3b30}
#cfm{position:fixed;inset:0;z-index:1985;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
#cfm.open{display:flex}

.badge{position:absolute;top:-6px;right:calc(50% - 40px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.badge.static{position:static;display:inline-grid}
.upd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin:6px 0 22px}
.upd .bmark{width:72px;height:72px;font-size:38px;margin-bottom:8px}
.notes{margin:8px 0 0 18px;line-height:1.7;font-size:15px}
.ubar{height:8px;border-radius:6px;background:var(--hover);overflow:hidden}
.ubar i{display:block;height:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;will-change:transform}

/* ---------- Home-Taste ---------- */
#homebtn{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:62px;height:62px;border-radius:50%;z-index:450;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.35);transition:transform .12s}
#homebtn::after{content:"";width:22px;height:22px;border:2.5px solid var(--text);border-radius:7px;opacity:.85}
#homebtn:active{transform:translateX(-50%) scale(.88)}

/* ---------- Kontrollzentrum ---------- */
#cc{position:absolute;top:36px;right:8px;width:min(350px,95vw);border-radius:22px;padding:14px;z-index:600;display:none;box-shadow:var(--shadow);animation:pop .18s ease}
#cc.open{display:block}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cc-tile{display:flex;align-items:center;gap:10px;padding:11px;border-radius:16px;background:var(--hover);text-align:left;transition:.2s;min-width:0}
.cc-tile span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--border);font-size:16px;flex:none}
.cc-tile b{display:block;font-size:13px}.cc-tile small{font-size:11px;color:var(--muted)}
.cc-tile.on span{background:var(--accent);color:#fff}
.cc-slider{display:flex;align-items:center;gap:10px;background:var(--hover);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.cc-slider input{flex:1;accent-color:var(--accent)}
.cc-batt{display:flex;align-items:center;gap:12px;background:var(--hover);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.cc-batt .batt{width:38px;height:18px;border-radius:5px}
.cc-batt .batt::after{top:5px;height:6px;right:-5px;width:3px}
.cc-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cc-actions button{padding:10px 4px;border-radius:14px;background:var(--hover);font-size:13px;font-weight:600}
.cc-actions button:hover{background:var(--accent);color:#fff}

/* ---------- Mitteilungen ---------- */
#toasts{position:fixed;top:40px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:1900;width:min(340px,94vw);pointer-events:none}
.toast{touch-action:none;cursor:grab;transition:transform .25s,opacity .25s;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tIn .35s cubic-bezier(.2,.9,.3,1.2);pointer-events:auto;color:var(--text)}
.toast.out{animation:tOut .3s ease forwards}
.toast .ic{width:38px;height:38px;font-size:19px;border-radius:10px;flex:none}
.toast b{font-size:14px;display:block}.toast small{font-size:13px;color:var(--muted)}
@keyframes tIn{from{opacity:0;transform:translateX(40px)}}
@keyframes tOut{to{opacity:0;transform:translateX(40px)}}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2000;transition:opacity .2s}
.coinpop{position:fixed;left:50%;top:45%;font-size:46px;font-weight:900;color:var(--gold);text-shadow:0 4px 24px rgba(0,0,0,.45);z-index:1950;pointer-events:none;animation:cp 1.3s ease forwards;white-space:nowrap}
@keyframes cp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}

/* ---------- Akku leer ---------- */
#empty{background:#000;color:#fff}
.bigbatt{width:130px;height:60px;border:4px solid #ff3b30;border-radius:13px;position:relative;padding:5px}
.bigbatt::after{content:"";position:absolute;right:-13px;top:17px;width:8px;height:18px;background:#ff3b30;border-radius:0 4px 4px 0}
.bigbatt i{display:block;height:100%;background:#ff3b30;border-radius:5px;width:0;transition:width .5s}
.bigbatt.ok{border-color:#34c759}.bigbatt.ok::after,.bigbatt.ok i{background:#34c759}
.blink{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.12}}
#emptyTitle{font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:2px;color:#ff3b30}
#emptyTitle.ok{color:#34c759;letter-spacing:0}
.ebtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ebtns .btn{background:#1c1c1e;color:#fff}
.ebtns .btn.primary{background:#34c759}
.sheet{position:absolute;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:80vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px 30px;transition:transform .35s cubic-bezier(.2,.9,.3,1);color:var(--text);background:var(--panel-solid);z-index:5}
.sheet.open{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--border);margin:0 auto 14px}

/* ---------- Quests ---------- */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.hero>div{border-radius:18px;padding:14px 16px;background:var(--panel-2)}
.hero small{color:var(--muted);font-weight:600;font-size:12.5px}
.hero b{display:block;font-size:28px;letter-spacing:-.5px}
.hero .gold{background:linear-gradient(135deg,#ffd60a,#f5a524);color:#3a2600}
.hero .gold small{color:#6b4a00}
.qcard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--panel-2);margin-bottom:10px;border-left:5px solid var(--dc);animation:stepIn .3s ease}
.qic{font-size:28px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--hover);flex:none}
.qt{flex:1;min-width:0}
.qt b{font-size:15.5px;line-height:1.3;display:block}
.qt small{font-size:12.5px}
.coin{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--gold);font-size:15px;margin-top:4px}
.qbtns{display:flex;flex-direction:column;gap:6px;flex:none}
.qdone{background:#34c759;color:#fff;padding:9px 12px;border-radius:11px;font-weight:700;font-size:13px;min-width:96px}
.qdone.sure{background:#ff9500}
.qre{background:var(--hover);padding:7px;border-radius:11px;font-size:13px;font-weight:600}
.qchip{display:inline-block;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:8px;margin-bottom:4px;letter-spacing:.3px}
.qdoneC{opacity:.55}
.qdoneC b{text-decoration:line-through}
.qok{font-size:30px;padding:0 10px}
.qre{min-width:44px}
.qfoot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:10px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);font-size:14px}

/* ---------- Shop & Inventar ---------- */
.item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--panel-2);margin-bottom:12px}
.itemic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.price{font-weight:800;color:var(--gold)}
.emptyinv{text-align:center;padding:36px 10px;color:var(--muted);line-height:1.6}
.emptyinv div{font-size:54px}
.barwrap{height:14px;border-radius:10px;background:var(--hover);overflow:hidden;margin:8px 0 4px}
.barwrap i{display:block;height:100%;border-radius:10px;transition:width .5s}

/* ---------- Standort ---------- */
.locstat{border-radius:22px;padding:22px;color:#fff;text-align:center;margin-bottom:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.locstat .e{font-size:56px;line-height:1.1}
.locstat h2{font-size:24px;margin:6px 0 2px}
.locstat p{opacity:.9;font-size:15px}
.map{width:100%;height:220px;border:0;border-radius:14px;margin:10px 0;background:var(--hover)}

/* ---------- Einstellungen ---------- */
.wallsmall{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.wallsmall button{aspect-ratio:3/4;border-radius:12px;border:3px solid transparent}
.wallsmall button.sel{border-color:var(--accent)}

@media (max-width:700px){
  #home{padding:18px 14px 110px}
  .apps{grid-template-columns:repeat(4,1fr);gap:20px 6px}
  .ic{width:60px;height:60px}
  .widget .big{font-size:32px}
  #sbApp{display:none}
  .appbody{padding:14px 12px 110px}
}

/* =====================================================================
   DESIGN-UPDATE 3.2
   ===================================================================== */
:root{--bg:#f2f2f7;--panel-2:#e9e9ef;--ease:cubic-bezier(.2,.9,.22,1)}
body.dark{--bg:#0a0a0d;--panel-solid:#141418;--panel-2:#1c1c22;--border:rgba(255,255,255,.08);--panel:rgba(22,22,28,.66)}
body{letter-spacing:-.011em}
#appview{animation:none!important;will-change:transform,opacity;overflow:hidden}
#home{will-change:transform,opacity;transform-origin:50% 45%}

/* Statusleiste: frei über dem Hintergrund, in Apps solide */
#statusbar{background:transparent;border:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);height:30px}
#statusbar .sb-btn:hover{background:rgba(255,255,255,.12)}
body.inapp #statusbar{color:var(--text);text-shadow:none;background:var(--bg)}
body.inapp #statusbar .sb-btn:hover{background:var(--hover)}
#statusbar .sb-coins{color:#ffd60a}
body.inapp #statusbar .sb-coins{color:var(--gold)}

/* App-Kopf */
.apphead{height:50px;background:var(--bg);border-bottom:1px solid var(--border);font-size:16px;font-weight:650;letter-spacing:-.02em}
.appbody{background:var(--bg)}

/* App-Icons: Squircle mit Glanz */
.appicon .ic,.strow .ic{border-radius:24%;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.14)}
.appicon .ic::after,.strow .ic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 48%);pointer-events:none}
.appicon{font-size:12px;font-weight:500;gap:6px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.appicon:hover .ic{transform:none}
.appicon:active .ic{transform:scale(.92);transition:transform .12s}

/* Widgets */
.page .widget{color:#fff;background:rgba(18,18,24,.34);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);border-radius:26px;box-shadow:0 12px 34px rgba(0,0,0,.18)}
.page .widget .wt,.page .widget .muted{color:rgba(255,255,255,.72)}
.page .widget .wt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.page .ring{color:#fff}

/* Home-Taste */
#homebtn{width:56px;height:56px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 8px 26px rgba(0,0,0,.28);transition:transform .15s var(--ease),background .25s}
#homebtn::after{border-color:#fff;width:19px;height:19px;border-radius:6px;border-width:2px;opacity:.95}
body.inapp #homebtn{background:var(--panel);border-color:var(--border)}
body.inapp #homebtn::after{border-color:var(--text)}
#dots i{width:6px;height:6px}

/* Karten & Listen */
.card,.sgroup,.item,.qcard,.hero>div,.rbox{border-radius:22px}
.sgroup,.sprof{border-color:var(--border);box-shadow:0 1px 0 rgba(255,255,255,.02)}
.btn{border-radius:14px;font-weight:650}
.btn.primary{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.qcard{border-left-width:4px}
.tabs button{border-radius:14px}

/* Kontrollzentrum & Menüs */
#cc{border-radius:28px;padding:16px}
.cc-tile{border-radius:20px}
.cc-slider,.cc-batt{border-radius:20px}
#menu,#ctxmenu{border-radius:18px}
.toast{border-radius:22px}

/* Ladebalken (GPU) */
.bootline{width:96px;height:3px;border-radius:3px;background:rgba(255,255,255,.14)}
.bootline i{width:100%;transform:scaleX(0);transform-origin:left center;border-radius:3px;will-change:transform}

/* Standort & Karte */
.locstat{border-radius:26px;padding:24px 20px;box-shadow:0 14px 34px rgba(0,0,0,.18)}
.locstat .sub{font-size:13px;opacity:.85;margin-top:4px}
.mapcard{position:relative;border-radius:24px;overflow:hidden;height:min(56vh,360px);border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.18);background:var(--panel-2);margin-bottom:12px}
#lMap{position:absolute;inset:0}
.mapload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.leaflet-container,.leaflet-container *{touch-action:none!important}
.leaflet-container{background:var(--panel-2);font:inherit}
.leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,.35)!important;color:#ddd!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:#fff!important}
.mapbtns{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.mapbtns button{width:42px;height:42px;font-size:18px;color:var(--text)}
.mapbtns button+button{border-top:1px solid var(--border)}
.mapbtns button.on{background:var(--accent);color:#fff}
.mdot{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center;position:relative}
.mdot i{width:14px;height:14px;border-radius:50%;background:#0a84ff}
.mdot::after{content:"";position:absolute;inset:-10px;border-radius:50%;background:rgba(10,132,255,.35);animation:mpulse 2s ease-out infinite;z-index:-1}
@keyframes mpulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.mhome{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.35);border:3px solid var(--accent)}
.lchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lchip{padding:8px 12px;border-radius:12px;background:var(--panel-2);font-size:13.5px;font-weight:600}
.lchip.ok{background:rgba(52,199,89,.16);color:#30d158}
.lchip.warn{background:rgba(255,159,10,.16);color:#ff9f0a}
.lacts{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-bottom:14px}
.slider{width:100%;accent-color:var(--accent)}

/* Raster mit Apps & Widgets */
.page{padding:18px 20px 130px}
.apps{display:grid!important;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))!important;grid-auto-rows:var(--rowh,96px);grid-auto-flow:row dense;column-gap:10px;row-gap:0;max-width:none!important;align-items:start}
.hitem{position:relative;touch-action:none}
.appicon{padding-top:4px}
.wdg.s{grid-column:span 2;grid-row:span 2}
.wdg.l{grid-column:span 4;grid-row:span 2}
.wdg{height:100%}
.wbox{position:absolute;inset:4px 4px 12px;border-radius:26px;padding:15px 16px;color:#fff;overflow:hidden;background:rgba(18,18,24,.36);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%);box-shadow:0 12px 30px rgba(0,0,0,.2);display:flex;flex-direction:column}
.wbox .wt{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:rgba(255,255,255,.72)}
.wbig{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1.05;margin-top:4px}
.wsub{color:rgba(255,255,255,.72);font-size:13.5px}
.wcenter{flex:1;display:flex;align-items:center;justify-content:center;gap:4px}
.wcenter.col{flex-direction:column;text-align:center}
.wrow{flex:1;display:flex;align-items:center;gap:14px}
.wbox .ring{width:58px;height:58px;font-size:13px;color:#fff}
.wbox .ring.big{width:86px;height:86px;font-size:18px}
.wcal{font-size:58px;font-weight:300;line-height:1;margin:4px 0;letter-spacing:-2px}
.wnote{font-size:14px;line-height:1.4;margin-top:6px;white-space:pre-wrap;overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(#000 70%,transparent)}
.wq{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.wq:last-child{border:none}
.wq i{width:8px;height:8px;border-radius:50%;flex:none}
.wq span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wq b{color:#ffd60a;font-size:13px}
.wq.done span{text-decoration:line-through;opacity:.55}
.aw{position:relative;width:min(118px,100%);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.92)}
.aw i{position:absolute;inset:5px}
.aw i::before{content:"";position:absolute;left:50%;top:0;width:2px;height:8px;margin-left:-1px;background:#444;border-radius:1px}
.aw b{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:3px;background:#111}
.aw .h{width:4px;height:26%;margin-left:-2px}.aw .m{width:3px;height:36%;margin-left:-1.5px}.aw .sec{width:1.5px;height:40%;margin-left:-.75px;background:#ff9f0a}
.aw span{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#ff9f0a}
#home.edit .wdg .wbox{animation:jigw .3s ease-in-out infinite alternate}
@keyframes jigw{from{transform:rotate(-.8deg)}to{transform:rotate(.8deg)}}
.wdg .del{top:-2px;left:-2px}
.wdg.ph{opacity:.15}
.dragclone.wdg .wbox{animation:none!important;box-shadow:0 24px 50px rgba(0,0,0,.45);transform:scale(1.04)}
.hitem.lifted .wbox{transform:scale(1.04);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
/* Bearbeiten-Leiste unten */
.editbar{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 22px;z-index:60;pointer-events:none}
#home.edit .editbar{display:flex}
.editbar button{pointer-events:auto;height:44px;min-width:44px;padding:0 18px;border-radius:22px;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.16)!important;border:1px solid rgba(255,255,255,.24)!important;animation:pop .3s cubic-bezier(.2,1.3,.3,1)}
#editAdd{font-size:22px;padding:0}
#home.edit #editDone{display:block}
#editDone{position:static!important}
/* Widget-Galerie */
#wscrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:640}
#wscrim.open{opacity:1;pointer-events:auto}
#wsheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);max-height:78vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 18px 40px;z-index:650;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,.9,.22,1);background:var(--panel-solid);color:var(--text)}
#wsheet.open{transform:translate(-50%,0)}
.wsh-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.wsh-head b{font-size:24px;letter-spacing:-.5px}
.wsh-item{background:var(--panel-2);border-radius:24px;padding:14px;margin-bottom:12px}
.wsh-prev{height:176px;border-radius:18px;background:linear-gradient(135deg,#3a1d5c,#7a2e57 60%,#e8584a);display:grid;place-items:center;margin-bottom:12px;overflow:hidden}
.wsh-prev .wdg{position:relative;height:172px;width:172px}
.wsh-prev .wdg.l{width:min(100%,360px)}
.wsh-row{display:flex;align-items:center;gap:10px}
.wsh-row b{flex:1;font-size:16px}
.seg.mini{width:auto}.seg.mini button{padding:6px 12px;font-size:13px}

/* =====================================================================
   ANIMATIONEN & APPS – cleaner (3.3)
   ===================================================================== */
.screen.active{animation:scrIn .42s cubic-bezier(.2,.9,.22,1)}
@keyframes scrIn{from{opacity:0}}
#lock.active .lk-time{animation:upIn .7s cubic-bezier(.2,.9,.22,1) both}
#lock.active .lk-login{animation:upIn .7s cubic-bezier(.2,.9,.22,1) .08s both}
@keyframes upIn{from{opacity:0;transform:translateY(18px)}}
@keyframes tIn{from{opacity:0;transform:translateY(-22px) scale(.95)}}
@keyframes tOut{to{opacity:0;transform:translateY(-22px) scale(.95)}}
.toast{animation:tIn .5s cubic-bezier(.2,1.25,.3,1)}
#pin.open,#cfm.open{animation:scrIn .22s ease}
.pinbox{animation:popIn .42s cubic-bezier(.2,1.25,.3,1)}
@keyframes popIn{from{opacity:0;transform:scale(.88)}}
#menu.open,#cc.open,#ctxmenu.open{animation:none}
#menu{transform-origin:12px 0}
#cc{transform-origin:calc(100% - 30px) 0}
.sheet{transition:transform .45s cubic-bezier(.2,.9,.22,1)}
.switch span,.switch span::after{transition:all .32s cubic-bezier(.2,1.2,.3,1)}
button{transition:transform .16s cubic-bezier(.2,.9,.22,1),background-color .2s,color .2s,opacity .2s,box-shadow .2s}
button:active:not(#homebtn):not(.srow):not(.sprof):not(.sb-btn):not(:disabled){transform:scale(.96)}
.qok{display:inline-block;animation:popIn .5s cubic-bezier(.2,1.4,.3,1)}
.coin,.price{font-variant-numeric:tabular-nums}

/* ===== 4.5: Handy-Statusleiste (iPhone & Samsung) ===== */
:root{--sb:30px;--sat:0px;--edge:#1c1430}
html{background:var(--edge)}
body{background:transparent!important}
body.phone{--sb:max(var(--sat),36px)}
#statusbar{height:var(--sb)}
#home,#appview{top:var(--sb)!important}
#menu{top:calc(var(--sb) + 4px)}
#cc{top:calc(var(--sb) + 6px)}
#toasts{top:calc(var(--sb) + 8px)}
.ios-time{display:none}
/* Handy: Uhrzeit links (mittig in der Ecke), rechts Infos, Mitte frei */
body.phone #statusbar{padding:0 calc(22px + var(--sx,0px)) 0 calc(24px + var(--sx,0px));align-items:center}
body.phone #statusbar .left,body.phone #statusbar .right{height:100%;align-items:center}
body.phone #sbLogo,body.phone #sbApp,body.phone #sbCC .js-time{display:none}
body.phone .ios-time{display:flex;font-size:16.5px;font-weight:650;letter-spacing:-.01em;padding:4px 8px;border-radius:10px}
body.phone #statusbar .right{gap:2px}
body.phone #sbCC{font-size:14.5px;font-weight:600;gap:5px}
body.phone #sbCC .batt{width:26px;height:12.5px;border-radius:4px}
body.phone #statusbar .sb-coins{font-size:13.5px}
/* Dynamic Island / Kamera-Loch: Mitte frei, Ecken mittig */
body.island{--sx:6px}
body.island #statusbar .left,body.island #statusbar .right{padding-top:4px}
body.island #statusbar .sb-coins,body.island #sbCC .js-locicon{display:none}
/* in Apps: Leiste in App-Farbe, nichts scheint durch */
body.phone.inapp #statusbar{background:var(--bg)}
body.island .lk-top{top:calc(var(--sb) / 2 - 7px);right:30px}
/* Als App auf dem Home-Bildschirm zeichnet das System Uhrzeit & Akku selbst an genau diese Stellen */


/* ===== 4.6: In Apps reicht die App bis ganz nach oben – dort steht nur die Uhrzeit ===== */
body.phone #statusbar{position:absolute}
body.phone.inapp #statusbar{background:var(--bg)!important;color:var(--text);text-shadow:none}
body.phone.inapp #statusbar .right{visibility:hidden}
body.phone.inapp #statusbar .left{flex:1}
/* Hintergrundbild verstecken, solange eine App ganz offen ist – sonst färbt der Browser
   den Bereich neben der Dynamic Island mit dem Hintergrund ein */
body.appfull #desktop>.wall{visibility:hidden}
body.appfull #home{visibility:hidden}
/* Kappe ganz oben in App-Farbe (wird vom Browser/System für den Bereich neben der Island genutzt) */
#topcap{position:absolute;left:0;right:0;top:0;height:max(var(--sat),1px);z-index:450;pointer-events:none;background:transparent}
body.phone.inapp #topcap{background:var(--bg)}

/* Version beim Tippen aufs G in der Startanimation */
#bootG{cursor:pointer;-webkit-tap-highlight-color:transparent}
.bootver{position:absolute;left:50%;top:calc(50% + 150px);transform:translateX(-50%);padding:7px 14px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:600;letter-spacing:.02em;opacity:0;pointer-events:none;white-space:nowrap}

/* ===== 5.0: Seite fest am Bildschirm – iPhone darf sie nach der Tastatur nicht verschieben ===== */
html,body{position:fixed!important;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
.screen{overflow:hidden}

/* Entwicklermodus: Namen aller sichtbaren Oberflächen */
#devlayer{position:fixed;inset:0;z-index:2500;pointer-events:none;display:none}
body.devmode #devlayer{display:block}
.devbox{position:fixed;border:1.5px dashed rgba(48,209,88,.9);border-radius:6px;pointer-events:none}
.devbox.scr{border:2px solid #ff375f;border-radius:0}
.devbox.app{border-color:#0a84ff}
.devbox b{position:absolute;left:-1px;top:-1px;background:rgba(48,209,88,.95);color:#000;font:700 10px/1.3 ui-monospace,Menlo,monospace;padding:1px 4px;border-radius:4px 0 4px 0;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.devbox.scr b{background:#ff375f;color:#fff;font-size:11px;left:auto;right:-1px;top:auto;bottom:-1px;border-radius:4px 0 0 0}
.devbox.app b{left:auto;right:-1px;border-radius:0 4px 0 4px}
.devbox.app b{background:#0a84ff;color:#fff}
#devpanel{position:fixed;left:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:2501;display:none;background:rgba(0,0,0,.82);color:#30d158;font:600 11px/1.45 ui-monospace,Menlo,monospace;padding:7px 9px;border-radius:10px;max-width:calc(100vw - 16px);white-space:pre-wrap;pointer-events:auto}
body.devmode #devpanel{display:block}
#devpanel.min{opacity:.55}

/* ===== 5.2: Bildschirm-Anpassung (Entwicklermodus) – verschiebt ALLES gemeinsam ===== */
.screen{top:var(--adjT,0px)!important;bottom:var(--adjB,0px)!important}


/* ===== 5.5: Der Streifen unten („Void“) ist die Seiten-Hintergrundfläche.
   Auf Handys liegt das Hintergrundbild deshalb direkt dort – so füllt es auch den Streifen. ===== */
html.wallbg{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:auto!important;height:calc(100% + 160px)!important;background-color:var(--edge)}
body.phone #desktop>.wall,body.phone #lock>.wall{display:none}

/* Entwickler-Info: Taps gehen durch, links daneben ein Knopf zum Aus-/Einblenden */
#devpanel{pointer-events:none!important;left:52px!important;max-width:calc(100vw - 60px)!important}
#devpanel.hid{display:none!important}
#devtoggle{position:fixed;left:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:2502;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.82);color:#30d158;font-size:20px;font-weight:700;display:none;place-items:center;border:1px solid rgba(48,209,88,.5);padding:0}
body.devmode #devtoggle{display:grid}
#devtoggle.off{opacity:.6;color:#9aa0ab;border-color:rgba(255,255,255,.2)}

/* weicher Übergang am unteren Fensterrand in die Streifenfarbe */
body.phone.gap #desktop::before,body.phone.gap #lock::before{content:"";position:absolute;left:0;right:0;bottom:0;height:110px;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--strip,transparent))}
body.phone.appfull #desktop::before{display:none}


/* 6.0: Test-Layout (Entwicklermodus) – Seite nicht fixiert, Bildschirme absolut */

html.altlay.wallbg{position:relative!important;height:auto!important;min-height:100lvh}
html.altlay .screen{position:absolute!important}
/* 6.2: Bildschirm „Homescreen“ (#desktop) geht um die Lücke weiter nach unten.
   Home-Taste, Punkte und Icons bleiben im sichtbaren Bereich. */
body.phone.gap.fulldown #desktop{bottom:calc(var(--adjB,0px) - var(--gapH,0px))!important}
body.phone.gap.fulldown #homebtn{bottom:calc(14px + env(safe-area-inset-bottom) + var(--gapH,0px))}
body.phone.gap.fulldown #dots{bottom:calc(92px + env(safe-area-inset-bottom) + var(--gapH,0px))}

body.phone.gap.fulldown .appbody{padding-bottom:calc(110px + var(--gapH,0px))}

.c48{background:rgba(238,228,218,.35);border-radius:10px;position:relative}
.v48{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;font-weight:800}
.v48.nw{animation:n48 .2s ease}.v48.mg{animation:m48 .2s ease}
@keyframes n48{from{transform:scale(0)}}@keyframes m48{50%{transform:scale(1.15)}}
.fl{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.fl canvas{display:block}
.fl-sc{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:54px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none}
.rx{position:relative;height:100%;display:grid;place-items:center;text-align:center;background:#2c2c3a;color:#fff;transition:background .15s;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer}
.rx.wait{background:#c0392b}.rx.go{background:#27ae60}.rx.early{background:#8e44ad}.rx.res{background:#2a4d8f}
.rx-in{padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.rx-in b{font-size:36px}.rx-in p{margin:0;color:rgba(255,255,255,.85);line-height:1.5}
.rx-dots{display:flex;gap:8px;margin-top:8px}.rx-dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)}.rx-dots i.on{background:#fff}
.t48,.ttt,.mem,.sn2-wrap,.sn2-pad{flex-shrink:0}
.ttt{grid-template-rows:repeat(3,1fr);display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,340px);aspect-ratio:1}
.ttt button{border-radius:20px;background:var(--panel-solid);border:1px solid var(--border);font-size:54px;font-weight:800;display:grid;place-items:center;transition:transform .15s,background .2s}
.ttt button:active{transform:scale(.94)}
.ttt button.win{background:rgba(52,199,89,.22);border-color:#34c759}
.ttt .x{color:#ff6b9d;animation:n48 .25s cubic-bezier(.2,1.4,.3,1)}.ttt .o{color:#5ac8fa;animation:n48 .25s cubic-bezier(.2,1.4,.3,1)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:min(100%,380px)}
.mem button{aspect-ratio:3/4;position:relative;perspective:600px;background:none;border:0;padding:0}
.mem .mf,.mem .mb{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .4s cubic-bezier(.2,.9,.3,1)}
.mem .mf{background:linear-gradient(135deg,#ff6a88,#ff99ac);color:#fff;font-size:26px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.mem .mb{background:var(--panel-solid);border:1px solid var(--border);font-size:34px;transform:rotateY(180deg)}
.mem button.up .mf{transform:rotateY(180deg)}.mem button.up .mb{transform:none}
.mem button.ok .mb{background:rgba(52,199,89,.2);border-color:#34c759}
/* 7.0: Kontrollzentrum an/aus */
.ccrem{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--muted)}
.ccrem b{color:var(--text);font-weight:700}
/* 7.0: Hintergrund-Kategorien */
.wcats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:2px 16px}
.wcats::-webkit-scrollbar{display:none}
.wcats button{flex:none;padding:9px 14px;border-radius:999px;background:var(--panel-solid);border:1px solid var(--border);font-weight:650;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.wcats button small{opacity:.55;margin-left:3px;font-weight:600}
.wcats button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.aiw-box{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 16px;border-radius:24px;margin-bottom:18px;overflow:hidden;
  background:radial-gradient(120% 80% at 0% 0%,rgba(167,139,250,.35),transparent 60%),radial-gradient(100% 80% at 100% 100%,rgba(96,165,250,.28),transparent 60%),radial-gradient(80% 60% at 100% 0%,rgba(244,114,182,.22),transparent 60%),var(--panel-solid);
  border:1px solid rgba(167,139,250,.35);box-shadow:0 10px 30px rgba(124,92,255,.18)}
.aiw-hd{display:flex;gap:12px;align-items:center}.aiw-hd b{display:block;font-size:16.5px}.aiw-hd small{color:var(--muted);font-size:13px}
.aiw-ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#a78bfa,#60a5fa,#f472b6);box-shadow:0 6px 16px rgba(124,92,255,.4)}
.aiw-in{border-radius:18px;padding:2px;background:linear-gradient(135deg,rgba(167,139,250,.7),rgba(96,165,250,.6),rgba(244,114,182,.6))}
.aiw-in textarea{display:block;width:100%;border:0;outline:0;resize:none;min-height:84px;border-radius:16px;padding:12px 14px;font:inherit;font-size:15.5px;color:var(--text);background:rgba(20,20,30,.82)}
body:not(.dark) .aiw-in textarea{background:rgba(255,255,255,.92)}
.aiw-sug{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.aiw-sug::-webkit-scrollbar{display:none}
.aiw-sug button{flex:none;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--text)}
body:not(.dark) .aiw-sug button{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.08)}
.aiw-opt{display:flex;align-items:center;justify-content:space-between;gap:10px}.aiw-opt>span{font-weight:650;font-size:14.5px}
.aiw-seg{display:flex;gap:3px;padding:3px;border-radius:14px;background:rgba(127,127,127,.16)}
.aiw-seg button{padding:8px 13px;border-radius:11px;font-weight:650;font-size:13.5px;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.aiw-seg button.on{background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;box-shadow:0 3px 10px rgba(99,102,241,.4)}
.aiw-seg button:active{transform:scale(.95)}
.aiw-hint{color:var(--muted);font-size:12.5px;text-align:right;margin-top:-6px}
.aiw-go{width:100%;padding:15px;border-radius:16px;font-weight:750;font-size:16px;color:#fff;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#ec4899,#8b5cf6);background-size:300% 100%;animation:aiGo 6s linear infinite;box-shadow:0 8px 22px rgba(99,102,241,.45)}
.aiw-go:active{transform:scale(.98)}
@keyframes aiGo{to{background-position:-300% 0}}
.aiw-run{align-items:center;text-align:center;padding:28px 18px 22px;gap:10px}
.aiw-orb{width:84px;height:84px;border-radius:50%;padding:4px;background:conic-gradient(#a78bfa,#60a5fa,#f472b6,#a78bfa);animation:pwSpin 2.4s linear infinite;box-shadow:0 0 40px rgba(167,139,250,.55)}
.aiw-orb i{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,#7c5cff 45%,#1e1b4b);animation:aiPulse 2.4s ease-in-out infinite}
.aiw-rt{font-size:17px;margin-top:6px}.aiw-rp{color:var(--muted);font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aiw-bar{width:100%;height:8px;border-radius:8px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:8px}
.aiw-bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#a78bfa,#60a5fa,#f472b6,#a78bfa);background-size:300% 100%;animation:aiGo 2.5s linear infinite;transition:width .25s linear}
.aiw-rs{width:100%;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.aiw-box textarea{resize:none;min-height:76px;font:inherit}
.aiw-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.aiw-chk{display:flex;align-items:center;gap:8px;font-weight:650}.aiw-chk input{width:20px;height:20px;accent-color:var(--accent)}
.aiw-msg{font-size:13px;color:var(--muted);text-align:center;min-height:1em}
.wai{position:absolute;left:6px;top:6px;font-style:normal;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:linear-gradient(135deg,#a78bfa,#60a5fa,#f472b6);color:#fff}
.wprev{position:relative;overflow:hidden}
.wprev .wclock{position:relative;z-index:2}
.wlive{position:absolute;top:8px;right:8px;z-index:2;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.08em;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px}
/* 7.0: Live-Hintergründe */
.livew{position:absolute;inset:0;overflow:hidden;pointer-events:none;contain:strict}
.livew i,.livew b{position:absolute;display:block;will-change:transform}
body.appfull #desktop>.livew{display:none}
body.phone.livebg #desktop>.wall,body.phone.livebg #lock>.wall{display:block!important;visibility:visible}
body.phone.livebg.appfull #desktop>.wall{visibility:hidden}
.lw-au{left:-30%;width:160%;height:50%;border-radius:50%;opacity:1}
.lw-au.a1{top:6%;background:radial-gradient(ellipse,rgba(61,255,160,.85),rgba(61,255,160,.25) 40%,transparent 68%);animation:au1 18s ease-in-out infinite alternate}
.lw-au.a2{top:16%;background:radial-gradient(ellipse,rgba(0,200,255,.6),rgba(0,163,255,.18) 40%,transparent 68%);animation:au2 24s ease-in-out infinite alternate}
.lw-au.a3{top:0;background:radial-gradient(ellipse,rgba(193,139,255,.6),rgba(193,139,255,.15) 40%,transparent 68%);animation:au1 30s ease-in-out infinite alternate-reverse}
@keyframes au1{from{transform:translateX(-12%) rotate(-8deg) scaleY(.8)}to{transform:translateX(12%) rotate(6deg) scaleY(1.25)}}
@keyframes au2{from{transform:translateX(10%) rotate(5deg)}to{transform:translateX(-10%) rotate(-7deg) scaleY(1.3)}}
.lw-tw{width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.7);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.4)}}
.lw-sh{width:30%;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));opacity:0;transform-origin:0 50%;animation:sh 9s linear infinite}
.lw-sh.s1{top:12%;left:72%;animation-delay:1s}.lw-sh.s2{top:26%;left:95%;animation-duration:13s;animation-delay:5s}.lw-sh.s3{top:6%;left:45%;animation-duration:17s;animation-delay:9s}
@keyframes sh{0%{opacity:0;transform:rotate(-35deg) translateX(0) scaleX(.3)}1.5%{opacity:1}7%{opacity:0;transform:rotate(-35deg) translateX(-170%) scaleX(1)}100%{opacity:0;transform:rotate(-35deg) translateX(-170%)}}
.lw-lava{top:100%;height:100%;animation:lava 22s linear infinite}
.lw-lava b{left:0;top:0;width:100%;aspect-ratio:1;border-radius:50%;opacity:.95;animation:sway 7s ease-in-out infinite alternate}
@keyframes lava{from{transform:translateY(0)}to{transform:translateY(-160%)}}
@keyframes sway{from{transform:translateX(-18%) scale(.85)}to{transform:translateX(18%) scale(1.15)}}
.lw-hl{left:0;right:0;top:63%;height:37%;animation:hl 3.6s cubic-bezier(.6,0,1,1) infinite}
.lw-hl b{left:0;right:0;top:0;height:3px;background:#ff3fdc;box-shadow:0 0 8px #ff3fdc}
@keyframes hl{from{transform:translateY(0);opacity:.25}to{transform:translateY(100%);opacity:1}}
.lw-glow{left:0;right:0;top:62.6%;height:4px;background:#ff5fe0;box-shadow:0 0 24px 8px rgba(255,47,216,.55);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.6}to{opacity:1}}
.lw-wave{left:0;width:200%;background-size:50% 100%;background-repeat:repeat-x;animation:wave 14s linear infinite}
.lw-wave.w3{bottom:30%;height:14%;animation-duration:22s;opacity:.85}.lw-wave.w2{bottom:13%;height:20%;animation-duration:16s;animation-direction:reverse}.lw-wave.w1{bottom:-3%;height:22%;animation-duration:11s}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.lw-glint{left:42%;width:16%;top:57%;height:20%;background:repeating-linear-gradient(transparent 0 9px,rgba(255,214,160,.55) 9px 12px);opacity:.7;animation:glint 2.4s ease-in-out infinite alternate}
@keyframes glint{from{transform:scaleX(.7);opacity:.45}to{transform:scaleX(1.15);opacity:.85}}
.lw-rain{left:-10%;width:120%;top:-160px;height:calc(100% + 320px);background-size:120px 160px;animation:rain .55s linear infinite}
.lw-rain.r2{background-size:80px 106.67px;opacity:.5;animation-duration:.8s}
@keyframes rain{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,160px,0)}}
.lw-rain.r2{animation-name:rain2}@keyframes rain2{to{transform:translate3d(0,106.67px,0)}}
.lw-flash{inset:0;background:#cfe3ff;opacity:0;animation:flash 11s infinite}
@keyframes flash{0%,92%,100%{opacity:0}93%{opacity:.35}94%{opacity:.05}95.5%{opacity:.28}97%{opacity:0}}
.lw-ff{width:6px;height:6px;border-radius:50%;background:#eaff7a;box-shadow:0 0 12px 5px rgba(220,255,90,.55);animation:ffm 10s ease-in-out infinite alternate,ffb 2s ease-in-out infinite alternate}
@keyframes ffm{0%{transform:translate(0,0)}33%{transform:translate(34px,-40px)}66%{transform:translate(-22px,-14px)}100%{transform:translate(16px,-64px)}}
@keyframes ffb{from{opacity:.15}to{opacity:1}}
.lw-gal{left:50%;top:50%;width:240%;aspect-ratio:1;transform:translate(-50%,-50%);background-size:cover!important;animation:gal 240s linear infinite}
@keyframes gal{to{transform:translate(-50%,-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.livew *{animation-duration:0s!important}}
.lw-snow{top:-3%;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,.8);animation:lwSnow 12s linear infinite}
@keyframes lwSnow{from{transform:translate3d(0,0,0)}50%{transform:translate3d(30px,55vh,0)}to{transform:translate3d(-10px,108vh,0)}}
.lw-bub{bottom:-8%;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.05) 60%);animation:lwBub 12s ease-in infinite}
@keyframes lwBub{from{transform:translate3d(0,0,0);opacity:0}10%{opacity:1}to{transform:translate3d(20px,-115vh,0);opacity:.2}}
.lw-ray{inset:-20%;background:repeating-linear-gradient(100deg,rgba(255,255,255,.07) 0 40px,transparent 40px 140px);animation:lwRay 9s ease-in-out infinite alternate}
@keyframes lwRay{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.lw-kb{inset:-6%;background-size:cover!important;background-position:center!important;animation:lwKb 26s ease-in-out infinite alternate}
@keyframes lwKb{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-2.5%,-2%,0)}}
.lw-glimmer{inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle at 75% 70%,rgba(255,255,255,.12),transparent 45%);animation:lwGlim 7s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes lwGlim{from{opacity:.2;transform:translate3d(-3%,0,0)}to{opacity:.9;transform:translate3d(3%,-2%,0)}}
.lw-svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 7.1: Wetter */
.wx{padding:14px 14px 20px}
.wx-empty{text-align:center;padding:40px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.wx-hero{border-radius:26px;padding:18px 20px;color:#fff;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.25)}
.wx-hero small{opacity:.85;font-weight:600}
.wx-now{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0}.wx-now span{font-size:54px}.wx-now b{font-size:72px;font-weight:300;letter-spacing:-3px}
.wx-rain{display:inline-block;margin-top:12px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.18);font-weight:650;font-size:14px}
.wx-rain.yes{background:rgba(10,132,255,.55)}
.wx-wind{display:flex;gap:16px;align-items:center;margin-top:14px;padding:16px;border-radius:22px;background:var(--panel-solid);border:1px solid var(--border)}
.wx-comp{width:76px;height:76px;flex:none;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;position:relative;background:radial-gradient(circle,var(--hover),transparent 70%)}
.wx-comp i{font-style:normal;font-size:30px;color:var(--accent);display:block;transition:transform .6s}.wx-comp small{position:absolute;bottom:4px;font-size:11px;font-weight:700;color:var(--muted)}
.wx-bf b{font-size:34px}.wx-bf span{font-weight:600;color:var(--muted)}
.wx-wrow{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;margin:4px 0 8px}
.wx-bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}.wx-bar i{display:block;height:100%;border-radius:3px}
.wx-hours{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 6px;touch-action:pan-x}
.wx-hours::-webkit-scrollbar{display:none}
.wx-h{flex:none;width:76px;padding:10px 6px;border-radius:18px;background:var(--panel-solid);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.wx-h.rain{background:rgba(10,132,255,.14);border-color:rgba(10,132,255,.45)}
.wx-h small{color:var(--muted);font-weight:700}.wx-h .i{font-size:24px}.wx-h b{font-size:17px}.wx-h .r{color:#5ac8fa;font-weight:600}
.wx-h .bf{color:#000;font-weight:800;font-size:10.5px;padding:2px 6px;border-radius:6px}
.wx-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
/* 7.1: Timer-Anzeige */
#tpill{position:fixed;top:calc(var(--sb,30px) + 6px);left:50%;transform:translateX(-50%);z-index:1250;padding:6px 14px;border-radius:999px;background:rgba(255,159,10,.95);color:#000;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:0 6px 18px rgba(0,0,0,.3);border:0}
#tpill.arm{background:#ff453a;color:#fff}#tpill small{opacity:.7}
/* 7.1: Home-Taste halten → Assistent */
#homebtn.hold::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#a78bfa var(--ha,0deg),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:hold .75s linear forwards}
@property --ha{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes hold{to{--ha:360deg}}
#homebtn.ready{box-shadow:0 0 0 3px #a78bfa,0 0 30px 8px rgba(167,139,250,.6)!important}
#homebtn{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#asst{position:fixed;inset:0;z-index:1400;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#asst.open{display:flex}
.as-sheet{position:relative;width:min(100%,520px);margin:0 10px calc(92px + env(safe-area-inset-bottom));transition:transform .25s;padding:22px 16px 14px;border-radius:30px;background:rgba(22,22,30,.92);color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;max-height:70%;overflow:hidden}
.as-sheet::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(120deg,#7c5cff,#ff5fa2,#ffb35c,#4fd1ff,#7c5cff);background-size:300% 300%;animation:asg 4s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes asg{to{background-position:300% 0}}
.as-orb{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#a78bfa 30%,#ff5fa2 60%,#4fd1ff);box-shadow:0 0 30px rgba(167,139,250,.7);animation:orb 2.4s ease-in-out infinite alternate}
@keyframes orb{to{transform:scale(1.12) rotate(40deg)}}
.as-title{font-size:17px;display:block}
.as-head{display:flex;align-items:center;gap:12px}
.as-st{display:block;font-size:13px;color:rgba(255,255,255,.65);min-height:16px;margin-top:2px}
.as-st.listen{color:#c4b5fd;font-weight:650}.as-st.warn{color:#ffb35c}
.as-orb.listen{animation:orbL .5s ease-in-out infinite alternate;box-shadow:0 0 40px 6px rgba(167,139,250,.9)}
@keyframes orbL{from{transform:scale(.9)}to{transform:scale(1.25)}}
.as-x{width:34px;height:34px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:15px}
.as-log{max-height:none;flex:1 1 auto;min-height:0}
.as-log{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;gap:8px;min-height:40px;padding-bottom:4px}
.as-log>*{flex-shrink:0}
.as-log .old{display:none}.as-log.show-old .old{display:flex}.as-log.show-old .as-me.old{display:block}
.as-hist{align-self:center;font-size:12.5px;font-weight:650;color:rgba(255,255,255,.75);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 12px}
