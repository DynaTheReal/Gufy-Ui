/* ---------- Raster ---------- */
function measureGrid(){
  const home=$('#home');let W=home.clientWidth||innerWidth,H=home.clientHeight||innerHeight-30;
  const mobile=W<=700,cols=mobile?4:Math.max(4,Math.min(8,Math.floor((W-40)/104)));
  const rowh=mobile?Math.max(88,Math.min(100,Math.floor((W-40)/4)+8)):104;
  const rows=Math.max(3,Math.floor((H-20-130)/rowh));
  GRID={cols,rows,rowh};
  const t=$('#track');t.style.setProperty('--cols',cols);t.style.setProperty('--rowh',rowh+'px');
}
const cellsOf=id=>!isW(id)?1:(S.widgets[id]?.size==='l'?2*Math.min(4,GRID.cols):4);
const pageCap=()=>GRID.cols*GRID.rows;
const usedCells=p=>p.reduce((a,id)=>a+cellsOf(id),0);
function cascade(L){for(let i=0;i<L.length;i++){while(usedCells(L[i])>pageCap()&&L[i].length>1){const x=L[i].pop();(L[i+1]??=[]).unshift(x)}}}
const homeIds=()=>Object.keys(S.widgets||{}).concat(CORE,S.installed.filter(id=>APPS[id]));
function normLayout(){
  const want=homeIds(),seen=new Set();
  let L=(S.layout||[]).map(p=>p.filter(id=>want.includes(id)&&!seen.has(id)&&seen.add(id)));
  if(!L.length)L=[[]];
  want.forEach(id=>{if(seen.has(id))return;seen.add(id);let k=L.findIndex(p=>usedCells(p)+cellsOf(id)<=pageCap());if(k<0){L.push([]);k=L.length-1}L[k].push(id)});
  cascade(L);
  if(!editMode)L=L.filter((p,i)=>i===0||p.length);
  S.layout=L;
}
function itemHTML(id){
  const ph=id===dragId?' ph':'';
  if(isW(id)){const w=S.widgets[id],T=WTYPES[w.type];if(!T)return'';const o=T.open()||'';
    return `<div class="hitem wdg ${w.size}${ph}" data-id="${id}" data-type="${w.type}" data-open="${o}"><span class="del" data-delid="${id}">−</span><div class="wbox">${widgetBody(w.type,w.size)}</div></div>`}
  const a=APPS[id];
  return `<div class="hitem appicon${ph}" data-id="${id}">${id==='settings'&&pendingUpdate()?'<span class="badge">1</span>':''}${CORE.includes(id)?'':`<span class="del" data-delid="${id}">−</span>`}<div class="ic" style="background:${a.bg}">${a.icon}</div><span class="lbl">${a.name}</span></div>`;
}
function renderHome(){
  measureGrid();normLayout();
  const pages=S.layout.map(p=>p.slice());
  if(editMode&&pages[pages.length-1].length)pages.push([]);
  homePage=Math.max(0,Math.min(homePage,pages.length-1));
  const t=$('#track');
  t.innerHTML=pages.map((p,i)=>`<div class="page" data-p="${i}"><div class="apps">${p.map(itemHTML).join('')}</div></div>`).join('');
  $('#home').classList.toggle('edit',editMode);
  drawDots(pages.length);setTrack(0,false);
  tick();renderBattery();updateCoins();updateWidgets(t);
}
function drawDots(n){n=n||$$('#track .page').length;$('#dots').innerHTML=n>1?Array.from({length:n},(_,i)=>`<i class="${i===homePage?'on':''}"></i>`).join(''):''}
let trackW=0;
function setTrack(dx,drag){const t=$('#track');if(!drag||!trackW)trackW=$('#home').clientWidth;if(t.classList.contains('drag')!==!!drag)t.classList.toggle('drag',!!drag);t.style.transform=`translate3d(${-homePage*trackW+dx}px,0,0)`}
/* Feder-Physik: die Seite gleitet mit genau der Geschwindigkeit des Fingers weiter (kein Ruck beim Loslassen) */
let springRaf=0;
function springTo(target,startDx,velPxMs){
  cancelAnimationFrame(springRaf);
  const t=$('#track'),W=trackW||$('#home').clientWidth,old=homePage;
  let x=-old*W+startDx,v=velPxMs*1000;const xT=-target*W;
  homePage=target;if(old!==target)haptic('select');drawDots();
  t.classList.add('drag');
  const K=210,C=2*Math.sqrt(K)*1.02; // fast kritisch gedämpft
  let last=performance.now();
  const step=now=>{
    let dt=Math.min(.032,(now-last)/1000);last=now;
    for(let i=0;i<2;i++){const h=dt/2,a=-K*(x-xT)-C*v;v+=a*h;x+=v*h}
    if(Math.abs(x-xT)<.4&&Math.abs(v)<15){t.style.transform=`translate3d(${xT}px,0,0)`;springRaf=0;t.classList.remove('drag');return}
    t.style.transform=`translate3d(${x.toFixed(2)}px,0,0)`;springRaf=requestAnimationFrame(step);
  };
  springRaf=requestAnimationFrame(step);
}
function goPage(i){const n=$$('#track .page').length,old=homePage;homePage=Math.max(0,Math.min(n-1,i));if(old!==homePage)haptic('select');setTrack(0,false);drawDots(n)}
function enterEdit(){
  if(editMode)return;editMode=true;haptic('heavy');
  renderHome();const h=$('#home');h.classList.remove('edit');void h.offsetWidth;
  h.classList.add('editing');requestAnimationFrame(()=>{h.classList.add('edit')});
  setTimeout(()=>h.classList.remove('editing'),420);
}
function exitEdit(){
  if(!editMode)return;editMode=false;closeWSheet();haptic();
  const h=$('#home');h.classList.add('editing');h.classList.remove('edit');
  setTimeout(()=>{h.classList.remove('editing');if(!editMode){renderHome();save()}},380);
}

/* FLIP: Elemente gleiten flüssig an ihren neuen Platz */
function flipRender(){
  const before={};$$('#track .hitem').forEach(el=>before[el.dataset.id]=el.getBoundingClientRect());
  renderHome();
  $$('#track .hitem').forEach(el=>{const b=before[el.dataset.id];if(!b)return;const a=el.getBoundingClientRect(),dx=b.left-a.left,dy=b.top-a.top;
    if(!dx&&!dy)return;el.animate([{transform:`translate3d(${dx}px,${dy}px,0)`},{transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.9,.22,1)'})});
}
function findPos(id){for(let p=0;p<S.layout.length;p++){const i=S.layout[p].indexOf(id);if(i>=0)return[p,i]}return[-1,-1]}
function moveBefore(id,target){
  const[pa,ia]=findPos(id),[pb,ib]=findPos(target);if(pa<0||pb<0)return;
  S.layout[pa].splice(ia,1);
  const[pb2,ib2]=findPos(target);
  S.layout[pb2].splice(pa===pb&&ia<ib?ib2+1:ib2,0,id);
  cascade(S.layout);flipRender();
}
function moveToPage(id,p){
  const[pa,ia]=findPos(id);if(pa<0)return;
  S.layout[pa].splice(ia,1);
  while(S.layout.length<=p)S.layout.push([]);
  S.layout[p].push(id);cascade(S.layout);homePage=p;flipRender();
}

/* Ziehen */
function startDrag(id,e){
  G.mode='drag';dragId=id;lastTarget=null;
  const src=$(`#track .hitem[data-id="${id}"]`);if(!src)return;
  const r=src.getBoundingClientRect();
  dragEl=src.cloneNode(true);dragEl.classList.add('dragclone');dragEl.style.width=r.width+'px';dragEl.style.height=r.height+'px';
  dragOff={x:e.clientX-r.left,y:e.clientY-r.top};
  document.body.append(dragEl);src.classList.add('ph');haptic();
  moveDrag(e);
}
function moveDrag(e){
  dragPos={x:e.clientX,y:e.clientY};
  if(dragRaf)return;
  dragRaf=requestAnimationFrame(()=>{
    dragRaf=0;if(!dragEl)return;
    const{x,y}=dragPos;
    dragEl.style.transform=`translate3d(${x-dragOff.x}px,${y-dragOff.y}px,0)`;
    const W=innerWidth;
    if(x<26||x>W-26){if(!edgeT)edgeT=setTimeout(()=>{edgeT=null;if(!dragId)return;
        const n=$$('#track .page').length,np=x<26?homePage-1:homePage+1;
        if(np>=0&&np<n)moveToPage(dragId,np)},550)}
    else if(edgeT){clearTimeout(edgeT);edgeT=null}
    const over=document.elementFromPoint(x,y),t=over&&over.closest('#track .hitem');
    if(t&&t.dataset.id!==dragId){if(lastTarget!==t.dataset.id){lastTarget=t.dataset.id;moveBefore(dragId,t.dataset.id)}}
    else if(!t){lastTarget=null;
      const pg=over&&over.closest('#track .page');
      if(pg&&+pg.dataset.p!==findPos(dragId)[0]&&+pg.dataset.p===homePage)moveToPage(dragId,homePage);}
  });
}
function endDrag(){
  clearTimeout(edgeT);edgeT=null;
  const id=dragId;dragId=null;
  const src=$(`#track .hitem[data-id="${id}"]`);
  if(dragEl&&src){const r=src.getBoundingClientRect(),el=dragEl,cur=el.style.transform;
    el.animate([{transform:cur},{transform:`translate3d(${r.left}px,${r.top}px,0)`}],{duration:240,easing:'cubic-bezier(.2,.9,.22,1)',fill:'forwards'}).onfinish=()=>{el.remove();src.classList.remove('ph')}}
  else if(dragEl)dragEl.remove();
  dragEl=null;save();
}

/* Kontextmenü (Gedrückthalten) */
function openCtx(el){
  const id=el.dataset.id,m=$('#ctxmenu');
  if(isW(id)){
    const w=S.widgets[id],T=WTYPES[w.type],o=T.open();
    m.innerHTML=`${o?`<button data-c="open">Öffnen <span>${APPS[o].icon}</span></button>`:''}${T.sizes.length>1?`<button data-c="size">${w.size==='s'?'Größer machen':'Kleiner machen'} <span>↔️</span></button>`:''}<button data-c="edit">Home-Bildschirm bearbeiten <span>✏️</span></button><button data-c="del" class="red">Widget entfernen <span>🗑️</span></button>`;
  }else{
    const a=APPS[id];
    m.innerHTML=`<button data-c="open">Öffnen <span>${a.icon}</span></button><button data-c="edit">Home-Bildschirm bearbeiten <span>✏️</span></button>${CORE.includes(id)?'':`<button data-c="del" class="red">App entfernen <span>🗑️</span></button>`}`;
  }
  m.classList.add('open');
  const r=el.getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight;
  let x=Math.min(innerWidth-mw-10,Math.max(10,r.left)),y=r.bottom+8,up=false;if(y+mh>innerHeight-10){y=r.top-mh-8;up=true}
  m.style.left=x+'px';m.style.top=y+'px';m.style.transformOrigin=`${Math.max(20,r.left+r.width/2-x)}px ${up?'100%':'0'}`;
  m.getAnimations().forEach(a=>a.cancel());
  m.animate([{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,1.3,.3,1)'});
  $$('button',m).forEach(b=>b.onclick=()=>{closeCtx();const c=b.dataset.c;
    if(c==='open')openApp(isW(id)?WTYPES[S.widgets[id].type].open():id);
    if(c==='edit')enterEdit();
    if(c==='del')confirmDelete(id);
    if(c==='size'){S.widgets[id].size=S.widgets[id].size==='s'?'l':'s';haptic();flipRender();save()}});
}
function closeCtx(){$('#ctxmenu').classList.remove('open');$$('#track .lifted').forEach(x=>x.classList.remove('lifted'))}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ctxmenu')&&!e.target.closest('#home'))closeCtx()});

function confirmDelete(id){
  const W=isW(id),a=W?{icon:'🧩',name:WTYPES[S.widgets[id].type].name+'-Widget'}:APPS[id];
  confirmBox(a.icon,`„${a.name}“ entfernen?`,'Entfernen',()=>{
    if(W)delete S.widgets[id];else S.installed=S.installed.filter(x=>x!==id);
    const el=$(`#track .hitem[data-id="${id}"]`);
    const fin=()=>{flipRender();save();if(!W)notify(a.icon,a.name+' entfernt','Im Gufy Store kannst du sie wieder laden.')};
    if(el)el.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.3)',opacity:0}],{duration:220,easing:'ease-in',fill:'forwards'}).onfinish=fin;else fin();
  });
}

/* Gesten */
(function(){
  const home=$('#home');
  home.addEventListener('contextmenu',e=>e.preventDefault());
  home.addEventListener('pointerdown',e=>{
    if(e.button>0||current!=='desktop')return;
    if(e.target.closest('.editbar'))return;
    closeCtx();
    const item=e.target.closest('#track .hitem');
    G={x:e.clientX,y:e.clientY,item,id:item&&item.dataset.id,mode:null,del:e.target.closest('[data-delid]')};
    try{home.setPointerCapture(e.pointerId)}catch(_){}
    if(G.del){G.mode='del';return}
    if(editMode){if(item)G.mode='maybe';return}
    G.lp=setTimeout(()=>{if(!G||G.mode)return;
      if(item){G.mode='menu';item.classList.add('lifted');openCtx(item);haptic('heavy')}
      else{G.mode='none';enterEdit()}},450);
  });
  home.addEventListener('pointermove',e=>{
    if(!G)return;
    const dx=e.clientX-G.x,dy=e.clientY-G.y,dist=Math.hypot(dx,dy);
    if(G.mode==='drag')return moveDrag(e);
    if(G.mode==='swipe'){
      const n=G.n||(G.n=$$('#track .page').length);let d=dx;
      if((homePage===0&&d>0)||(homePage===n-1&&d<0))d*=.3;
      const now=performance.now(),iv=(e.clientX-(G.lx??G.x))/Math.max(1,now-(G.lt??now-16));G.v=G.v===undefined?iv:G.v*.6+iv*.4;G.lx=e.clientX;G.lt=now;
      G.sd=d;if(!G.raf)G.raf=requestAnimationFrame(()=>{if(G){G.raf=0;setTrack(G.sd,true)}});return;
    }
    if(G.mode==='menu'&&dist>10){closeCtx();enterEdit();return startDrag(G.id,e)}
    if(G.mode==='maybe'&&dist>6)return startDrag(G.id,e);
    if(!G.mode&&dist>8){clearTimeout(G.lp);G.mode=Math.abs(dx)>Math.abs(dy)?'swipe':'none'}
    else if(editMode&&!G.item&&!G.mode&&dist>8)G.mode='swipe';
  });
  const up=(e,cancel)=>{
    if(!G)return;clearTimeout(G.lp);
    const g=G;G=null;
    const dx=(e.clientX||g.x)-g.x,W=home.clientWidth;
    if(g.mode==='swipe'){
      if(g.raf)cancelAnimationFrame(g.raf);
      const v=g.v||0,n=$$('#track .page').length;let tgt=homePage;
      if(!cancel&&(dx<-W*.16||v<-.3))tgt=homePage+1;else if(!cancel&&(dx>W*.16||v>.3))tgt=homePage-1;
      tgt=Math.max(0,Math.min(n-1,tgt));
      springTo(tgt,g.sd??dx,cancel?0:v);return;
    }
    if(g.mode==='drag')return endDrag();
    if(cancel)return;
    if(g.mode==='del')return confirmDelete(g.del.dataset.delid);
    if(g.mode)return;
    if(editMode){if(!g.item)exitEdit();return}
    if(!g.item)return;
    if(isW(g.id)){const o=g.item.dataset.open;if(o)openApp(o);return}
    openApp(g.id);
  };
  home.addEventListener('pointerup',e=>up(e,false));
  home.addEventListener('pointercancel',e=>up(e,true));
  let wheelLock=0;
  home.addEventListener('wheel',e=>{const now=Date.now();if(now<wheelLock)return;const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;if(Math.abs(d)<25)return;wheelLock=now+450;goPage(homePage+(d>0?1:-1))},{passive:true});
  $('#editDone').onclick=exitEdit;
  $('#editAdd').onclick=()=>{haptic();openWSheet()};
  $('#wscrim').onclick=closeWSheet;
  let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(current==='desktop')renderHome();else setTrack(0,false)},150)});
})();

const snapCoins=(raw,diff)=>COINSTEPS[diff].reduce((b,v)=>Math.abs(v-raw)<Math.abs(b-raw)?v:b);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nice=n=>n<20?n:n<100?Math.round(n/5)*5:n<1000?Math.round(n/10)*10:Math.round(n/500)*500;
function genQuest(diff,avoid,kind){
  let q;
  const own=(S.customQ||[]).filter(x=>x.diff===diff);
  for(let k=0;k<40;k++){
    if(!kind&&own.length&&Math.random()<.3){
      const o=own[rnd(0,own.length-1)];q={i:o.i,title:o.title,coins:o.coins,tag:'own'};
    }else if(kind==='sport'||(!kind&&Math.random()<.2)){
      const tpl=QT[rnd(0,QT.length-1)],[a,b]=tpl.r[diff],n=nice(rnd(a,b));
      q={i:tpl.i,title:tpl.t(n),coins:snapCoins(tpl.cv[diff],diff),tag:tpl.g,hint:tpl.h||''};
    }else{
      let L=QF[diff];
      if(kind==='parents')L=L.filter(f=>f[3]);else if(kind==='fun')L=L.filter(f=>!f[3]);
      const f=L[rnd(0,L.length-1)];
      q={i:f[0],title:f[1],coins:f[2],tag:f[3]?'parents':'fun'};
    }
    if(!avoid.some(x=>x.title===q.title||x.i===q.i))break;
  }
  if(q.tag!=='own')q.coins=QUEST_PAY(q.coins);
  q.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);q.diff=diff;q.done=false;q.kind=kind||'';
  return q;
}
// 5 Tagesquests: genau 1× Sport, immer 1× mit den Eltern, Rest witzig/peinlich
const DAILY_SLOTS=[['mittel','fun'],['schwer','parents'],['schwer','sport'],['extrem','fun'],['extrem','fun']];
const dayKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function ensureQuests(){
  // alte eigene Quests anpassen (keine "Leicht"-Stufe, keine 25 Coins mehr)
  (S.customQ||[]).forEach(o=>{if(!COINSTEPS[o.diff])o.diff='mittel';if(!S.payV2&&o.coins>=50)o.coins=QUEST_PAY(o.coins)});
  // einmalig: offene Quests von heute auf die neuen Belohnungen umrechnen
  if(!S.payV3){(S.daily?S.daily.list:[]).concat(S.customQ||[]).forEach(q=>{if(!q.done)q.coins=roundPay(q.coins)});S.payV3=S.payV2=true;save()}
  if(!S.payV2){if(S.daily)S.daily.list.forEach(q=>{if(!q.done&&q.coins>=50)q.coins=QUEST_PAY(q.coins)});S.payV2=true;save()}
  if(S.daily&&S.daily.day===dayKey()&&!S.questsV7){ // schwerere Tagesquests: offene heute neu würfeln
    const L=S.daily.list;DAILY_SLOTS.forEach(([d,k],i)=>{if(L[i]&&!L[i].done)L[i]=genQuest(d,L.filter((_,j)=>j!==i),k)});
    S.questsV7=S.questsV6=true;S.daily.v=2;save();
  }
  if(S.daily&&S.daily.day===dayKey()&&S.daily.v===2&&!S.questsV6){ // neue Quests & Stufen: offene heute neu würfeln
    const L=S.daily.list;DAILY_SLOTS.forEach(([d,k],i)=>{if(L[i]&&!L[i].done)L[i]=genQuest(d,L.filter((_,j)=>j!==i),k)});
    (S.customQ||[]).forEach(o=>o.coins=roundPay(o.coins));S.questsV6=true;save();
  }
  if(!S.daily||S.daily.day!==dayKey()){
    const list=[];DAILY_SLOTS.forEach(([d,k])=>list.push(genQuest(d,list,k)));
    S.daily={day:dayKey(),list,v:2};S.questsV6=S.questsV7=true;save();
  }else if(S.daily.v!==2){ // heutige Liste an die neuen Regeln anpassen, Erledigtes bleibt
    const L=S.daily.list;
    DAILY_SLOTS.forEach(([d,k],i)=>{const q=L[i];
      const ok=q&&(q.done||(q.diff===d&&(q.kind===k||(k==='fun'&&q.tag==='fun')||(k==='sport'&&q.tag==='sport'))&&!(q.tag==='sport'&&k!=='sport')));
      if(!ok)L[i]=q&&q.done?q:genQuest(d,L.filter((_,j)=>j!==i),k)});
    L.length=DAILY_SLOTS.length;
    if(L.filter(q=>q.tag==='sport').length>1)L.forEach((q,i)=>{if(q.tag==='sport'&&!q.done)L[i]=genQuest(q.diff,L,'fun')});
    S.daily.v=2;save();
  }
}

      html+=`<button class="btn primary" id="qNew" style="width:100%;margin-bottom:14px">＋ Quest erstellen</button>`+
        (O.length?O.map((q,i)=>{const d=dcol(q.diff);return `<div class="qcard" style="--dc:${d[2]}"><div class="qic">${esc(q.i)}</div><div class="qt"><small class="qchip" style="background:${d[2]}">${d[1]}</small><b>${esc(q.title)}</b><span class="coin">🪙 ${q.coins}</span></div><div class="qbtns"><button class="qre" data-del="${i}">🗑️</button></div></div>`}).join('')
         :`<div class="emptyinv"><div>⭐</div><b>Noch keine eigenen Quests</b></div>`);
    }else{
      const earned=S.questDone.reduce((a,q)=>a+q.coins,0);
      html+=S.questDone.length?`<div class="card"><div class="hist"><b>Insgesamt verdient</b><b class="price">🪙 ${fmtNum(earned)}</b></div>${S.questDone.slice(0,100).map(q=>`<div class="hist"><span>${esc(q.i)} ${esc(q.title)}<br><small class="muted">${new Date(q.t).toLocaleDateString('de-DE',{day:'numeric',month:'short'})}</small></span><b class="price" style="white-space:nowrap">+${q.coins}</b></div>`).join('')}</div>`
        :`<div class="emptyinv"><div>📜</div><b>Noch keine Quest geschafft</b></div>`;
    }
    body.innerHTML=html;
    $$('[data-tab]',body).forEach(b=>b.onclick=()=>{if(tab===b.dataset.tab)return;tab=b.dataset.tab;haptic('select');draw();fadeIn(body)});
    $$('[data-re]',body).forEach(b=>b.onclick=()=>{const q=L[+b.dataset.re];askCode('Quest neu würfeln',()=>{const k=S.daily.list.indexOf(q);if(k<0)return;S.daily.list[k]=genQuest(q.diff,S.daily.list,q.kind);save();draw()})});
    $$('[data-done]',body).forEach(b=>b.onclick=()=>{
      const q=L[+b.dataset.done];
      askCode(`Abhaken: +${q.coins} Coins`,()=>{
        if(q.done||!S.daily.list.includes(q))return;
        q.done=true;S.coins+=q.coins;S.questDone.unshift({i:q.i,title:q.title,coins:q.coins,diff:q.diff,t:Date.now()});S.questDone=S.questDone.slice(0,300);
        save();updateCoins();haptic('success');coinPop('+'+q.coins+' 🪙');notify('🏆','Quest geschafft!',`+${q.coins} Coins`,'#f5a524');draw();
        const card=$(`.qcard[data-qi="${S.daily.list.indexOf(q)}"]`,body);if(card)card.animate([{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:420,easing:SPRING});
      });
    });
    const all=$('#qAll',body);if(all)all.onclick=()=>askCode('Tagesquests neu würfeln',()=>{S.daily.list=S.daily.list.map(q=>q.done?q:genQuest(q.diff,S.daily.list,q.kind));save();draw()});
    $$('[data-del]',body).forEach(b=>b.onclick=()=>askCode('Quest löschen',()=>{S.customQ.splice(+b.dataset.del,1);save();draw()}));
    const nq=$('#qNew',body);if(nq)nq.onclick=()=>askCode('Quest erstellen',form);
  }
  function form(){
    let fd='mittel',fc=25;
    function fdraw(){
      body.innerHTML=`<h2 style="font-size:22px;margin-bottom:14px">＋ Neue Quest</h2>
        <div style="display:flex;gap:8px;margin-bottom:10px"><input class="input" id="fI" value="⭐" maxlength="4" style="width:70px;text-align:center;font-size:24px"><input class="input" id="fT" placeholder="Was muss man machen?" maxlength="120"></div>
        <div class="label">Schwierigkeit</div>
        <div class="tabs">${DIFFS.map(d=>`<button data-fd="${d[0]}" style="--tc:${d[2]}" class="${fd===d[0]?'on':''}">${d[3]} ${d[1]}</button>`).join('')}</div>
        <div class="label">Coins</div>
        <div class="tabs" style="flex-wrap:wrap">${COINALL.map(v=>`<button data-fc="${v}" style="--tc:#f5a524" class="${fc===v?'on':''}">🪙 ${v}</button>`).join('')}</div>
        <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="fX" style="flex:1">Abbrechen</button><button class="btn primary" id="fOk" style="flex:1">Erstellen</button></div>`;
      const keep=()=>({i:$('#fI',body).value,t:$('#fT',body).value});
      const restore=v=>{$('#fI',body).value=v.i;$('#fT',body).value=v.t};
      $$('[data-fd]',body).forEach(b=>b.onclick=()=>{const v=keep();fd=b.dataset.fd;fdraw();restore(v)});
      $$('[data-fc]',body).forEach(b=>b.onclick=()=>{const v=keep();fc=+b.dataset.fc;fdraw();restore(v)});
      $('#fX',body).onclick=()=>{tab='own';draw()};
      $('#fOk',body).onclick=()=>{
        const t=$('#fT',body).value.trim(),ic=$('#fI',body).value.trim()||'⭐';
        if(!t){const x=$('#fT',body);x.classList.remove('shake');void x.offsetWidth;x.classList.add('shake');return}
        (S.customQ??=[]).push({i:ic,title:t,coins:fc,diff:fd});save();
        notify('⭐','Quest erstellt',t,'#7f5af0');tab='own';draw();
      };
    }
    fdraw();setTimeout(()=>$('#fT',body)?.focus(),50);
  }
  draw();
}},

/* ---------- Gufy Store ---------- */
shop:{name:'Gufy Store',icon:'🛍️',bg:'linear-gradient(135deg,#1c1c1e,#3a3a3c)',
render(body,ctx){
  let tab='apps';const busy={};
  const bar=h(`<div class="storebar glass"><button data-st="apps"><span>📱</span>Apps</button><button data-st="items"><span>🎒</span>Gegenstände</button></div>`);
  $('#appview').append(bar);
  body.style.paddingBottom='150px';
  $$('[data-st]',bar).forEach(b=>b.onclick=()=>{if(tab===b.dataset.st)return;tab=b.dataset.st;haptic('select');draw();fadeIn(body)});
  const storeIds=()=>Object.keys(APPS).filter(id=>APPS[id].store);
  function btn(id){
    if(busy[id]!==undefined)return `<div class="dl" style="--p:${busy[id]}%"></div>`;
    if(S.installed.includes(id))return `<button class="getbtn open" data-open2="${id}">Öffnen</button><button class="rm" data-rm="${id}" title="Entfernen">🗑️</button>`;
    return `<button class="getbtn" data-get="${id}">Laden</button>`;
  }
  function draw(){
    $$('[data-st]',bar).forEach(b=>b.classList.toggle('on',b.dataset.st===tab));
    if(tab==='apps'){
      const ids=storeIds();
      body.innerHTML=`<div class="sthead">Apps</div>
        <div class="feat" style="background:linear-gradient(135deg,#11998e,#38ef7d)"><div class="big">🐍</div><small>Spiel des Tages</small><b>Snake</b><div style="margin-top:10px">${btn('snake')}</div></div>
        ${ids.map(id=>{const a=APPS[id];return `<div class="strow"><div class="ic" style="background:${a.bg}">${a.icon}</div><div class="qt"><b>${a.name}</b><small class="muted">${a.cat||''}</small></div>${btn(id)}</div>`}).join('')}`;
    }else{
      body.innerHTML=`<div class="sthead">Gegenstände</div>
        <div class="hero"><div class="gold"><small>Deine Coins</small><b>🪙 <span class="js-coins">${fmtNum(S.coins)}</span></b></div><div><small>Akku</small><b>🔋 ${dispPct()} %</b></div></div>
        ${S.vacation?'<div class="vacbar">🏖️ Urlaubsmodus – neue Items verfügbar</div>':''}${shopItems().map(([k,it])=>`<div class="item"><div class="itemic" style="background:${it.bg}">${it.icon}</div>
          <div class="qt"><b>${it.name}</b><small class="muted">${it.perm?'Lädt im Urlaub zu Hause':'+'+fmtPct(pctOf(it))+' · '+(S.inv[k]||0)+'× im Inventar'}</small><br><span class="price">🪙 ${it.price}</span></div>
          ${it.perm&&S.inv[k]>0?'<span class="owned">✓ Gekauft</span>':`<button class="btn gold" data-buy="${k}" ${S.coins<it.price?'disabled':''}>Kaufen</button>`}</div>`).join('')}`;
    }
    $$('[data-get]',body).forEach(b=>b.onclick=()=>{
      const id=b.dataset.get;busy[id]=0;draw();
      const iv=setInterval(()=>{busy[id]=Math.min(100,busy[id]+7+Math.random()*12);
        if(busy[id]>=100){clearInterval(iv);haptic('success');delete busy[id];if(!S.installed.includes(id))S.installed.push(id);save();renderHome();notify(APPS[id].icon,APPS[id].name+' installiert','Jetzt auf deinem Homescreen.')}
        if(appCtx===ctx)draw()},120);
      ctx.cleanup.push(()=>clearInterval(iv));
    });
    $$('[data-open2]',body).forEach(b=>b.onclick=()=>openApp(b.dataset.open2));
    $$('[data-rm]',body).forEach(b=>b.onclick=()=>{const id=b.dataset.rm;S.installed=S.installed.filter(x=>x!==id);save();renderHome();draw()});
    $$('[data-buy]',body).forEach(b=>b.onclick=()=>{
      const k=b.dataset.buy,it=ITEMS[k];if(S.coins<it.price||(it.perm&&S.inv[k]>0))return;
      S.coins-=it.price;S.inv[k]=(S.inv[k]||0)+1;save();updateCoins();
      haptic('success');coinPop('−'+it.price+' 🪙');notify('🛍️','Gekauft!',it.name+' liegt jetzt in deinem Inventar.','#f5a524');draw();
    });
  }
  ctx.go=t=>{tab=t;draw()};
  draw();
}},

/* ---------- Standort ---------- */
standort:{name:'Standort',icon:'📍',bg:'linear-gradient(135deg,#ff5e3a,#ff2a68)',
render(body,ctx){
  let map=null,tiles=null,labels=null,sat=S.mapSat!==false,me=null,acc=null,homeM=null,homeC=null,fitted=false;
  const fmtD=d=>d<1000?Math.round(d)+' m':(d/1000).toFixed(1).replace('.',',')+' km';
  function statusHTML(){
    const st=statusInfo();
    return `<div class="locstat" style="background:${st.col}"><div class="e">${st.ic}</div><h2>${st.t}</h2><p>Akku ${dispPct()} % · ${st.r}</p><p class="sub">${remainText()}</p></div>`;
  }
  function infoHTML(){
    if(geoErr)return `<div class="lchip warn">⚠️ ${esc(geoErr)}</div>`;
    if(!geoPos)return `<div class="lchip">📡 Standort wird gesucht …</div>`;
    let s=`<div class="lchip">🎯 ±${Math.round(geoPos.acc)} m</div>`;
    if(S.loc.home){const d=distM(geoPos,S.loc.home);s+=d<=S.loc.radius?`<div class="lchip ok">🏠 Zu Hause</div>`:`<div class="lchip">🚶 ${fmtD(d)} entfernt</div>`}
    else s+=`<div class="lchip warn">Kein Zuhause gespeichert</div>`;
    return s;
  }
  function gpsHTML(){
    if(S.loc.mode!=='gps')return `<div class="sgroup"><div class="srow"><span class="sic" style="background:#34c759">🏠</span><span class="sl">Ich bin zu Hause</span><label class="switch"><input type="checkbox" id="lHome" ${S.loc.isHome?'checked':''}><span></span></label></div></div>`;
    return `<div class="mapcard"><div id="lMap"><div class="mapload">Karte wird geladen …</div></div>
        <div class="mapbtns"><button id="lCenter" title="Zentrieren">◎</button><button id="lLayer" title="Satellit">🛰️</button></div></div>
      <div class="lchips" id="lInfo">${infoHTML()}</div>
      <div class="lacts"><button class="btn" id="lRef">Aktualisieren</button><button class="btn primary" id="lSet" ${geoPos?'':'disabled'}>Hier ist mein Zuhause</button></div>
      <div class="sgroup" style="padding:14px 16px"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Umkreis</b><b id="lRadV" style="color:var(--accent)">${S.loc.radius} m</b></div>
        <input type="range" id="lRad" min="50" max="1000" step="25" value="${S.loc.radius}" class="slider"></div>`;
  }
  function sleepHours(){let d=toMin(S.sleep.to)-toMin(S.sleep.from);if(d<=0)d+=1440;return d/60}
  function draw(){
    destroyMap();
    body.innerHTML=`<div id="lStat">${statusHTML()}</div>
      <div class="seg" style="margin:16px 0 14px"><button data-mode="manual" class="${S.loc.mode==='manual'?'on':''}">Manuell</button><button data-mode="gps" class="${S.loc.mode==='gps'?'on':''}">GPS & Karte</button></div>
      <div id="lGps">${gpsHTML()}</div>
      <div class="slabel">Schlafenszeit</div>
      <div class="sgroup">
        <div class="srow"><span class="sic" style="background:#5e5ce6">😴</span><span class="sl">Schlafen ab</span><input type="time" class="tinput" id="sF" value="${S.sleep.from}"></div>
        <div class="srow"><span class="sic" style="background:#ff9f0a">⏰</span><span class="sl">Aufstehen um</span><input type="time" class="tinput" id="sT" value="${S.sleep.to}"></div>
        <div class="srow"><span class="sic" style="background:#8e8e93">⏱️</span><span class="sl">Dauer</span><span class="sv">${fmtDur(sleepHours())}</span></div>
      </div>`;
    $$('[data-mode]',body).forEach(b=>b.onclick=()=>{
      if(b.dataset.mode===S.loc.mode)return;
      askCode('Modus ändern',()=>{
        advance();S.loc.mode=b.dataset.mode;save();
        if(S.loc.mode==='gps'){startGeo();checkGeoOnce()}else stopGeo();
        updateCC();draw();
      });
    });
    const upd=(k,v)=>askCode('Schlafenszeit ändern',()=>{advance();S.sleep[k]=v;save();renderBattery();updateCC();draw()},draw);
    $('#sF',body).onchange=e=>e.target.value&&upd('from',e.target.value);
    $('#sT',body).onchange=e=>e.target.value&&upd('to',e.target.value);
    bindGps();
    if(S.loc.mode==='gps')initMap();
  }
  function bindGps(){
    const hm=$('#lHome',body);if(hm)hm.onchange=e=>{const v=e.target.checked;e.target.checked=!v;askHome(v,refresh)};
    const rf=$('#lRef',body);if(rf)rf.onclick=()=>{geoErr='';fitted=false;checkGeoOnce()};
    const st=$('#lSet',body);if(st)st.onclick=()=>{if(!geoPos)return;askCode('Zuhause festlegen',()=>{S.loc.home={lat:geoPos.lat,lon:geoPos.lon};save();setHome(true,true);haptic('success');notify('🏠','Zuhause gespeichert','GufyUI erkennt jetzt automatisch, ob du zu Hause bist.','#34c759');fitted=false;refresh()})};
    const rd=$('#lRad',body);
    if(rd){
      rd.oninput=e=>{$('#lRadV',body).textContent=e.target.value+' m';if(homeC)homeC.setRadius(+e.target.value)};
      rd.onchange=e=>{const v=+e.target.value;askCode('Umkreis ändern',()=>{S.loc.radius=v;save();if(geoPos&&S.loc.home)setHome(distM(geoPos,S.loc.home)<=S.loc.radius);fitted=false;refresh()},()=>{rd.value=S.loc.radius;$('#lRadV',body).textContent=S.loc.radius+' m';if(homeC)homeC.setRadius(S.loc.radius)})};
    }
    const ce=$('#lCenter',body);if(ce)ce.onclick=()=>{haptic();fitted=false;updateMap()};
    const ly=$('#lLayer',body);if(ly)ly.onclick=()=>{haptic();sat=!sat;S.mapSat=sat;save();setTiles()};
  }
  /* ---------- Echte Karte (Leaflet + OpenStreetMap/CARTO/Esri) ---------- */
  // Standard: Satellit mit Straßennamen (braucht keinen API-Key). „Karte“ (CARTO) ist optional;
  // lädt sie nicht oder fehlt ein Zugang, schaltet GufyUI automatisch zurück auf Satellit.
  function setTiles(){
    if(!map)return;
    [tiles,labels].forEach(l=>l&&map.removeLayer(l));labels=null;
    const ly=$('#lLayer',body);if(ly){ly.classList.toggle('on',!sat);ly.textContent=sat?'🗺️':'🛰️';ly.title=sat?'Karte':'Satellit'}
    if(sat){
      tiles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}).addTo(map);
      labels=L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,opacity:.85}),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19})]).addTo(map);
      return;
    }
    let ok=0,bad=0;
    tiles=L.tileLayer(`https://{s}.basemaps.cartocdn.com/${S.theme==='dark'?'dark_all':'rastertiles/voyager'}/{z}/{x}/{y}{r}.png`,{maxZoom:20,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
    tiles.on('tileload',()=>ok++);
    tiles.on('tileerror',()=>{bad++;if(bad>=2&&ok===0){sat=true;S.mapSat=true;save();setTiles();notify('🛰️','Satellit aktiv','Die Karte ist hier nicht verfügbar – Satellit ist eingeschaltet.','#0a84ff')}});
    tiles.addTo(map);
  }
  function initMap(){
    loadLeaflet().then(()=>{
      const el=$('#lMap',body);if(!el||map)return;
      el.innerHTML='';
      map=L.map(el,{zoomControl:false,attributionControl:true,zoomSnap:.5}).setView(geoPos?[geoPos.lat,geoPos.lon]:S.loc.home?[S.loc.home.lat,S.loc.home.lon]:[51.16,10.45],geoPos||S.loc.home?15:5);
      map.attributionControl.setPrefix('');
      setTiles();updateMap();
      setTimeout(()=>map&&map.invalidateSize(),460);
    }).catch(()=>embedMap());
  }
  function embedMap(){ // einfache OpenStreetMap-Karte als Ausweich
    const el=$('#lMap',body);if(!el)return;
    const c=geoPos||S.loc.home;if(!c){el.innerHTML='<div class="mapload">Warte auf Standort …</div>';return}
    const d=Math.max(.004,S.loc.radius/50000);const m=geoPos?`&marker=${geoPos.lat},${geoPos.lon}`:'';
    el.innerHTML=`<iframe class="mapframe" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${c.lon-d*1.6},${c.lat-d},${c.lon+d*1.6},${c.lat+d}&layer=mapnik${m}"></iframe>`;
    const btns=$('.mapbtns',body);if(btns)btns.style.display='none';
  }
  function destroyMap(){if(map){map.remove();map=null;tiles=labels=me=acc=homeM=homeC=null;fitted=false}}
  function updateMap(){
    if(!map)return;
    const pts=[];
    if(S.loc.home){
      const h=[S.loc.home.lat,S.loc.home.lon];pts.push(h);
      const col=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#4f8cff';
      if(!homeC)homeC=L.circle(h,{radius:S.loc.radius,color:col,weight:2,fillColor:col,fillOpacity:.14,dashArray:'6 6'}).addTo(map);else{homeC.setLatLng(h);homeC.setRadius(S.loc.radius)}
      if(!homeM)homeM=L.marker(h,{icon:L.divIcon({className:'',html:'<div class="mhome">🏠</div>',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(map);else homeM.setLatLng(h);
    }
    if(geoPos){
      const p=[geoPos.lat,geoPos.lon];pts.push(p);
      if(!acc)acc=L.circle(p,{radius:geoPos.acc,color:'#0a84ff',weight:0,fillOpacity:.12,interactive:false}).addTo(map);else{acc.setLatLng(p);acc.setRadius(geoPos.acc)}
      if(!me)me=L.marker(p,{icon:L.divIcon({className:'',html:'<div class="mdot"><i></i></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:500}).addTo(map);else me.setLatLng(p);
    }
    if(!fitted&&pts.length){
      fitted=true;
      if(homeC&&geoPos){const b=homeC.getBounds().extend(pts[pts.length-1]);map.flyToBounds(b,{padding:[34,34],duration:.8,maxZoom:17})}
      else if(homeC)map.flyToBounds(homeC.getBounds(),{padding:[34,34],duration:.8});
      else map.flyTo(pts[0],16,{duration:.8});
    }
  }
  function refresh(){
    const s=$('#lStat',body);if(!s)return;
    if(!map&&S.loc.mode==='gps'&&$('#lMap iframe',body)===null&&!(window.L&&L.map)&&geoPos){const el=$('#lMap',body);if(el&&!el.dataset.tried){el.dataset.tried=1;initMap()}}
    s.innerHTML=statusHTML();
    if(S.loc.mode!=='gps'){$('#lGps',body).innerHTML=gpsHTML();bindGps();return}
    const inf=$('#lInfo',body);if(inf)inf.innerHTML=infoHTML();
    const st=$('#lSet',body);if(st)st.disabled=!geoPos;
    updateMap();
  }
  ctx.refresh=refresh;
  if(S.loc.mode==='gps')startGeo();
  draw();
  const iv=setInterval(()=>{const s=$('#lStat',body);if(s)s.innerHTML=statusHTML()},15000);
  ctx.cleanup.push(()=>{clearInterval(iv);destroyMap()});
}},

/* ---------- Einstellungen ---------- */
settings:{name:'Einstellungen',icon:'⚙️',bg:'linear-gradient(135deg,#8e9eab,#4b5563)',
render(body,ctx){
  const TITLES={beta:'Beta',update:'Softwareupdate',profil:'Profil',look:'Darstellung',wall:'Hintergrund',pw:'Passwort',info:'Über GufyUI',admin:'Admin'};
  const sw=(id,on)=>`<label class="switch"><input type="checkbox" id="${id}" ${on?'checked':''}><span></span></label>`;
  const row=(ic,col,label,right,attr='')=>`<${attr?'button':'div'} class="srow" ${attr}><span class="sic" style="background:${col}">${ic}</span><span class="sl">${label}</span>${right}</${attr?'button':'div'}>`;
  const nav=(ic,col,label,go,val='')=>row(ic,col,label,`${val?`<span class="sv">${val}</span>`:''}<span class="chev">›</span>`,`data-go="${go}"`);
  function home(){
    body.innerHTML=`<h1 class="stitle">Einstellungen</h1>
      <button class="sprof" data-go="profil"><div class="avatar">${esc((S.name||'?')[0].toUpperCase())}</div><div class="sl"><b style="font-size:19px">${esc(S.name)}</b><br><small class="muted">🪙 ${fmtNum(S.coins)} · 🏆 ${S.questDone.length} Quests</small></div><span class="chev">›</span></button>
      ${pendingUpdate()?`<div class="sgroup">${nav('⬇️','#1c1c1e','Update verfügbar','update','<span class="badge static">1</span>')}</div>`:''}

notes:{name:'Notizen',cat:'Produktivität',full:true,store:true,icon:'📝',bg:'linear-gradient(135deg,#ffd86f,#fc9d3f)',w:520,h:520,
render(body){

    $('#nBack',body).onclick=()=>{if(!n.text.trim()){S.notes=S.notes.filter(x=>x.id!==id);save()}list()};
    $('#nDel',body).onclick=()=>{S.notes=S.notes.filter(x=>x.id!==id);save();list()};
  }

calc:{name:'Rechner',cat:'Werkzeuge',full:true,store:true,icon:'🧮',bg:'linear-gradient(135deg,#3a3a3c,#000)',w:340,h:540,
render(body,ctx){
  const K=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],[','],['=','op']];
  body.innerHTML=`<div class="calc"><div class="disp"><div class="expr"></div><div class="val">0</div></div><div class="keys">${K.map(k=>`<button class="${k[1]||''}" data-k="${k[0]}">${k[0]}</button>`).join('')}</div></div>`;
  let cur='0',prev=null,op=null,fresh=false;
  const val=$('.val',body),ex=$('.expr',body);
  const fmt=n=>{if(!isFinite(n))return 'Fehler';return String(parseFloat(n.toPrecision(12)))};
  const show=()=>{val.textContent=cur.replace('.',',');ex.textContent=prev!==null&&op?fmt(prev).replace('.',',')+' '+op:'';
    $$('.op',body).forEach(b=>b.classList.toggle('sel',b.dataset.k===op&&fresh))};
  const compute=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?a/b:b;
  function press(k){
    if(/^[0-9]$/.test(k)){if(fresh||cur==='0'){cur=k}else if(cur.length<15)cur+=k;fresh=false}
    else if(k===','){if(fresh){cur='0';fresh=false}if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){cur='0';prev=null;op=null;fresh=false}
    else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):(cur==='0'?'0':'-'+cur)}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100)}
    else if(k==='='){if(op!==null&&prev!==null){cur=fmt(compute(prev,parseFloat(cur),op));prev=null;op=null;fresh=true}}
    else{ if(op&&!fresh&&prev!==null){cur=fmt(compute(prev,parseFloat(cur),op))} prev=parseFloat(cur);op=k;fresh=true }
    show();
  }
  $$('[data-k]',body).forEach(b=>b.onclick=()=>press(b.dataset.k));
  const kd=e=>{if(curApp()!=='calc')return;const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=',',':',','.':',','Escape':'AC','Backspace':'BS'};
    if(/^[0-9]$/.test(e.key))press(e.key);else if(m[e.key]==='BS'){cur=cur.length>1?cur.slice(0,-1):'0';show()}else if(m[e.key])press(m[e.key])};
  addEventListener('keydown',kd);ctx.cleanup.push(()=>removeEventListener('keydown',kd));
}},

/* ---------- Uhr ---------- */
clock:{name:'Uhr',cat:'Werkzeuge',full:true,store:true,icon:'⏰',bg:'linear-gradient(135deg,#2c3e50,#000)',w:440,h:580,
render(body,ctx){
  body.innerHTML=`<div class="fill"><div class="tabs"><button data-c="clock" class="on">🕐 Uhr</button><button data-c="sw">⏱️ Stoppuhr</button><button data-c="timer">⏳ Timer</button></div><div class="grow pad" id="cc2"></div></div>`;
  const c=$('#cc2',body);let iv=null;
  // Stoppuhr-/Timer-Zustand bleibt beim Tab-Wechsel erhalten
  const sw={run:false,start:0,acc:0,laps:[]};
  const tm={end:0,left:0,run:false};
  const fmtSW=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,cs=Math.floor(ms/10)%100;return pad(m)+':'+pad(s)+','+pad(cs)};
  const fmtT=ms=>{const t=Math.ceil(ms/1000);return pad(Math.floor(t/60))+':'+pad(t%60)};
  function tab(t){
    clearInterval(iv);
    $$('[data-c]',body).forEach(b=>b.classList.toggle('on',b.dataset.c===t));
    if(t==='clock'){
      let marks='';for(let i=0;i<12;i++)marks+=`<i class="mk" style="transform:rotate(${i*30}deg);${i%3===0?'height:14px;width:3px;background:var(--text)':''}"></i>`;
      const zones=[['Berlin','Europe/Berlin'],['London','Europe/London'],['New York','America/New_York'],['Tokio','Asia/Tokyo'],['Sydney','Australia/Sydney']];
      c.innerHTML=`<div class="aclock">${marks}<div class="hand hh"></div><div class="hand mh"></div><div class="hand sh"></div><div class="cap"></div></div><div class="digital" id="dg"></div>
        <div class="label">Weltuhr</div><div class="card world">${zones.map(z=>`<div class="row"><b>${z[0]}</b><span data-z="${z[1]}"></span></div>`).join('')}</div>`;
      const upd=()=>{const d=new Date();const s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,hh=(d.getHours()%12)+m/60;
        $('.hh',c).style.transform=`rotate(${hh*30}deg)`;$('.mh',c).style.transform=`rotate(${m*6}deg)`;$('.sh',c).style.transform=`rotate(${s*6}deg)`;
        $('#dg',c).textContent=d.toLocaleTimeString('de-DE');
        $$('[data-z]',c).forEach(e=>{try{e.textContent=d.toLocaleTimeString('de-DE',{timeZone:e.dataset.z,hour:'2-digit',minute:'2-digit'})}catch(_){e.textContent='–'}})};
      upd();iv=setInterval(upd,100);
    }
    if(t==='sw'){
      c.innerHTML=`<div class="sw" id="swd">00:00,00</div><div class="swbtns"><button id="swL">Runde</button><button id="swS" class="go">Start</button></div><div class="laps card" id="laps"></div>`;
      const d=$('#swd',c),bS=$('#swS',c),bL=$('#swL',c),L=$('#laps',c);
      const now=()=>sw.acc+(sw.run?performance.now()-sw.start:0);
      const draw=()=>{d.textContent=fmtSW(now());bS.textContent=sw.run?'Stopp':'Start';bS.className=sw.run?'stop':'go';bL.textContent=sw.run||!now()?'Runde':'Zurücksetzen';
        L.style.display=sw.laps.length?'':'none';L.innerHTML=sw.laps.map((l,i)=>`<div class="row"><span>Runde ${sw.laps.length-i}</span><b style="font-variant-numeric:tabular-nums">${fmtSW(l)}</b></div>`).join('')};
      bS.onclick=()=>{if(sw.run){sw.acc+=performance.now()-sw.start;sw.run=false}else{sw.start=performance.now();sw.run=true}draw()};
      bL.onclick=()=>{if(sw.run){sw.laps.unshift(now())}else{sw.acc=0;sw.laps=[]}draw()};
      draw();iv=setInterval(()=>{d.textContent=fmtSW(now())},33);
    }
    if(t==='timer'){
      c.innerHTML=`<div class="sw" id="td">05:00</div>
        <div class="presets">${[1,3,5,10,15,30].map(m=>`<button class="btn" data-m="${m}">${m} Min</button>`).join('')}</div>
        <div class="swbtns"><button id="tR">Abbrechen</button><button id="tS" class="go">Start</button></div>`;
      if(!tm.run&&!tm.left)tm.left=5*60000;
      const d=$('#td',c),bS=$('#tS',c);
      const left=()=>tm.run?Math.max(0,tm.end-Date.now()):tm.left;
      const draw=()=>{d.textContent=fmtT(left());bS.textContent=tm.run?'Pause':'Start';bS.className=tm.run?'stop':'go'};
      $$('[data-m]',c).forEach(b=>b.onclick=()=>{tm.run=false;tm.left=b.dataset.m*60000;draw()});
      bS.onclick=()=>{if(tm.run){tm.left=left();tm.run=false}else if(tm.left>0){tm.end=Date.now()+tm.left;tm.run=true}draw()};
      $('#tR',c).onclick=()=>{tm.run=false;tm.left=5*60000;draw()};
      draw();iv=setInterval(draw,250);
    }
  }
  // Timer läuft auch im Hintergrund weiter
  const bg=setInterval(()=>{if(tm.run&&Date.now()>=tm.end){tm.run=false;tm.left=0;notify('⏰','Timer abgelaufen','Deine Zeit ist um!','#ff9f0a')}},250);
  $$('[data-c]',body).forEach(b=>b.onclick=()=>{tab(b.dataset.c);haptic('select');fadeIn($('#cc2',body)||body)});
  ctx.cleanup.push(()=>{clearInterval(iv);clearInterval(bg)});
  tab('clock');
}},

/* ---------- Kalender ---------- */
calendar:{name:'Kalender',cat:'Produktivität',full:true,store:true,icon:'📅',bg:'linear-gradient(135deg,#ff6b6b,#ee5a24)',w:460,h:600,
render(body){
  const now=new Date();let y=now.getFullYear(),m=now.getMonth(),sel=key(now);
  function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function draw(){
    const first=new Date(y,m,1),startDay=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
    let cells='';
    for(let i=0;i<42;i++){
      const dn=i-startDay+1;let d,other=false;
      if(dn<1){d=new Date(y,m-1,prevDays+dn);other=true}else if(dn>days){d=new Date(y,m+1,dn-days);other=true}else d=new Date(y,m,dn);
      const k=key(d);
      cells+=`<button data-d="${k}" class="${other?'other ':''}${k===key(now)?'today ':''}${k===sel?'sel ':''}${S.events[k]?.length?'has':''}">${d.getDate()}</button>`;
    }
    const ev=S.events[sel]||[];
    const sd=new Date(sel);
    body.innerHTML=`<div class="pad"><div class="calhead"><button class="btn" id="cP">‹</button><b>${first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="btn" id="cN">›</button></div>
      <div class="calgrid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
      <div class="label">${sd.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</div>
      <div class="card">${ev.length?ev.map((e,i)=>`<div class="row"><span>📌 ${esc(e)}</span><button data-del="${i}" style="color:#ff3b30">✕</button></div>`).join(''):'<div class="row muted">Keine Termine</div>'}</div>
      <div style="display:flex;gap:8px"><input class="input" id="cE" placeholder="Neuer Termin …" maxlength="60"><button class="btn primary" id="cA">＋</button></div></div>`;
    $('#cP',body).onclick=()=>{m--;if(m<0){m=11;y--}draw()};
    $('#cN',body).onclick=()=>{m++;if(m>11){m=0;y++}draw()};
    $$('[data-d]',body).forEach(b=>b.onclick=()=>{sel=b.dataset.d;const d=new Date(sel);y=d.getFullYear();m=d.getMonth();draw()});
    const add=()=>{const v=$('#cE',body).value.trim();if(!v)return;(S.events[sel]??=[]).push(v);save();draw()};
    $('#cA',body).onclick=add;$('#cE',body).onkeydown=e=>{if(e.key==='Enter')add()};
    $$('[data-del]',body).forEach(b=>b.onclick=()=>{S.events[sel].splice(+b.dataset.del,1);if(!S.events[sel].length)delete S.events[sel];save();draw()});
  }
  draw();
}},

/* ---------- Snake ---------- */
snake:{name:'Snake',cat:'Spiele',full:true,store:true,icon:'🐍',bg:'linear-gradient(135deg,#11998e,#38ef7d)',w:440,h:620,
render(body,ctx){
  body.innerHTML=`<div class="snake"><div class="snk-top"><span>Punkte: <b id="sc">0</b></span><span>🏆 Rekord: <b id="hi">${S.snakeHigh}</b></span></div>
    <canvas id="cv"></canvas>
    <div class="snk-row"><div class="snk-ctl"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div>
    <button class="btn primary" id="sg" style="height:56px;min-width:100px">▶ Start</button></div></div>`;
  const cv=$('#cv',body),g=cv.getContext('2d'),N=18;
  let size=300,cell,sn,dir,nd,food,run=false,over=false,score=0,loop=null;
  function fit(){
    const r=body.getBoundingClientRect();
    size=Math.max(180,Math.floor(Math.min(r.width-24,r.height-200,460)/N)*N);
    const dpr=devicePixelRatio||1;cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';
    g.setTransform(dpr,0,0,dpr,0,0);cell=size/N;draw();
  }
  function reset(){sn=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={x:1,y:0};nd=dir;score=0;over=false;place();$('#sc',body).textContent=0}
  function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(p=>p.x===food.x&&p.y===food.y))}
  function step(){
    dir=nd;const hd={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(hd.x<0||hd.y<0||hd.x>=N||hd.y>=N||sn.some(p=>p.x===hd.x&&p.y===hd.y)){gameOver();return}
    sn.unshift(hd);
    if(hd.x===food.x&&hd.y===food.y){score++;$('#sc',body).textContent=score;place();
      if(score>S.snakeHigh){S.snakeHigh=score;save();$('#hi',body).textContent=score}
      clearInterval(loop);loop=setInterval(step,Math.max(60,130-score*3))}
    else sn.pop();
    draw();
  }
  function gameOver(){run=false;over=true;clearInterval(loop);$('#sg',body).textContent='↻ Nochmal';draw();
    if(score&&score>=S.snakeHigh)notify('🏆','Neuer Rekord!',score+' Punkte in Snake','#11998e')}
  function rr(x,y,w,hh,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,hh,r):g.rect(x,y,w,hh);g.fill()}
  function draw(){
    if(!sn)return;
    g.fillStyle='#12241a';g.fillRect(0,0,size,size);
    g.fillStyle='#16301f';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*cell,j*cell,cell,cell);
    g.fillStyle='#ff4757';g.beginPath();g.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.38,0,7);g.fill();
    sn.forEach((p,i)=>{g.fillStyle=i===0?'#7dffa0':`hsl(140,${70-i}%,${55-Math.min(20,i)}%)`;rr(p.x*cell+1,p.y*cell+1,cell-2,cell-2,cell*.3)});
    const hd=sn[0];g.fillStyle='#0e1a12';g.beginPath();g.arc(hd.x*cell+cell/2+dir.x*cell*.15-dir.y*cell*.18,hd.y*cell+cell/2+dir.y*cell*.15-dir.x*cell*.18,cell*.09,0,7);g.arc(hd.x*cell+cell/2+dir.x*cell*.15+dir.y*cell*.18,hd.y*cell+cell/2+dir.y*cell*.15+dir.x*cell*.18,cell*.09,0,7);g.fill();
    if(!run){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,size,size);g.fillStyle='#fff';g.textAlign='center';g.font='bold 22px system-ui';
      g.fillText(over?'Game Over – '+score+' Punkte':'Bereit?',size/2,size/2-6);g.font='14px system-ui';g.fillStyle='#9effb5';g.fillText('Pfeiltasten, Wischen oder Knöpfe',size/2,size/2+20)}
  }
  function turn(x,y){if(sn.length>1&&x===-dir.x&&y===-dir.y)return;nd={x,y};if(!run)start()}
  function start(){if(over||!sn)reset();if(run){run=false;clearInterval(loop);$('#sg',body).textContent='▶ Weiter';draw();return}
    run=true;$('#sg',body).textContent='⏸ Pause';clearInterval(loop);loop=setInterval(step,Math.max(60,130-score*3))}
  $('#sg',body).onclick=start;
  $$('[data-d]',body).forEach(b=>b.onclick=()=>{const[x,y]=b.dataset.d.split(',').map(Number);turn(x,y)});
  const kd=e=>{if(curApp()!=='snake')return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
    if(m){e.preventDefault();turn(...m)}if(e.key===' '){e.preventDefault();start()}};
  addEventListener('keydown',kd);
  let sx,sy;cv.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};
  cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(!run)start();return}
    Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))};
  reset();
  const ro=new ResizeObserver(fit);ro.observe(body);
  ctx.cleanup.push(()=>{clearInterval(loop);removeEventListener('keydown',kd);ro.disconnect()});
}},

/* ---------- Zeichnen ---------- */
paint:{name:'Zeichnen',cat:'Kreativ',full:true,store:true,icon:'🎨',bg:'linear-gradient(135deg,#f857a6,#ff5858)',w:640,h:500,
render(body,ctx){
  const cols=['#111111','#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de','#ff2d55','#8e8e93'];
  body.innerHTML=`<div class="paint"><div class="ptools">${cols.map((c,i)=>`<button class="sw2 ${i===0?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')}
    <input type="range" min="2" max="40" value="6" id="pS" style="width:90px;accent-color:var(--accent)">
    <button class="tb" id="pE">🧽 Radierer</button><button class="tb" id="pC">🗑️ Leeren</button><button class="tb" id="pD">💾 Speichern</button></div>
    <div class="pwrap"><canvas id="pc"></canvas></div></div>`;
  const cv=$('#pc',body),g=cv.getContext('2d'),wrap=$('.pwrap',body);
  let col='#111111',erase=false,drawing=false,last=null;
  function resize(){
    const r=wrap.getBoundingClientRect();if(!r.width||!r.height)return;
    const dpr=devicePixelRatio||1;
    const tmpc=document.createElement('canvas');tmpc.width=cv.width;tmpc.height=cv.height;if(cv.width)tmpc.getContext('2d').drawImage(cv,0,0);
    cv.width=r.width*dpr;cv.height=r.height*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle='#fff';g.fillRect(0,0,r.width,r.height);
    if(tmpc.width)g.drawImage(tmpc,0,0,tmpc.width/dpr,tmpc.height/dpr);
  }
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);line(last,last)};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);line(last,p);last=p};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  function line(a,b){g.strokeStyle=erase?'#fff':col;g.lineWidth=+$('#pS',body).value*(erase?2:1);g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  $$('[data-c]',body).forEach(b=>b.onclick=()=>{col=b.dataset.c;erase=false;$('#pE',body).classList.remove('on');$$('[data-c]',body).forEach(x=>x.classList.toggle('sel',x===b))});
  $('#pE',body).onclick=e=>{erase=!erase;e.currentTarget.classList.toggle('on',erase)};
  $('#pC',body).onclick=()=>{g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height)};
  $('#pD',body).onclick=()=>{const a=document.createElement('a');a.download='NovaOS-Bild.png';a.href=cv.toDataURL('image/png');a.click();notify('🎨','Bild gespeichert','NovaOS-Bild.png','#f857a6')};
  const ro=new ResizeObserver(resize);ro.observe(wrap);
  ctx.cleanup.push(()=>ro.disconnect());
}},

flash:{name:'Taschenlampe',cat:'Werkzeuge',icon:'🔦',bg:'linear-gradient(135deg,#3a3a3c,#111)',full:true,store:true,

/* ---------- Zufall ---------- */
random:{name:'Zufall',cat:'Spaß',icon:'🎲',bg:'linear-gradient(135deg,#ff375f,#bf1d3a)',store:true,
render(body){
  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  let who=[S.name||'Ich','Freund'];
  function draw(){
    body.innerHTML=`<div class="rnd">
      <div class="rbox"><small>Würfel</small><div class="rbig" id="rD">🎲</div><button class="btn primary" id="rDb">Würfeln</button></div>
      <div class="rbox"><small>Münze</small><div class="rbig" id="rC">🪙</div><button class="btn primary" id="rCb">Werfen</button></div>
      <div class="rbox" style="grid-column:1/-1"><small>Wer muss die Quest machen?</small>
        <div style="display:flex;gap:8px;margin:10px 0"><input class="input" id="rA" value="${esc(who[0])}"><input class="input" id="rB" value="${esc(who[1])}"></div>
        <div class="rbig" id="rW" style="font-size:30px;min-height:60px">❓</div><button class="btn primary" id="rWb">Auslosen</button></div>

    const spin=(el,list,fin,ms=900)=>{let n=0;const iv=setInterval(()=>{el.textContent=list[n++%list.length];el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),60)},70);setTimeout(()=>{clearInterval(iv);el.textContent=fin},ms)};
    $('#rDb',body).onclick=()=>{const v=Math.floor(Math.random()*6);spin($('#rD',body),faces,faces[v]+' '+(v+1))};

  }
  draw();

};
