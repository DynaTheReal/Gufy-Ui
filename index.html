paint:{name:'Zeichnen',cat:'Kreativ',full:true,store:true,icon:'🎨',bg:'linear-gradient(135deg,#f857a6,#ff5858)',w:640,h:500,
render(body,ctx){
  const cols=['#111111','#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de','#ff2d55','#8e8e93'];
  body.innerHTML=`<div class="paint"><div class="ptools">${cols.map((c,i)=>`<button class="sw2 ${i===0?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')}
    <input type="range" min="2" max="40" value="6" id="pS" style="width:90px;accent-color:var(--accent)">
    <button class="tb" id="pE">🧽 Radierer</button><button class="tb" id="pC">🗑️ Leeren</button><button class="tb" id="pD">💾 Speichern</button></div>
    <div class="pwrap"><canvas id="pc"></canvas></div></div>`;
  const cv=$('#pc',body),g=cv.getContext('2d'),wrap=$('.pwrap',body);
  let col='#111111',erase=false,drawing=false,last=null;
  function resize(){
    const r=wrap.getBoundingClientRect();if(!r.width||!r.height)return;
    const dpr=devicePixelRatio||1;
    const tmpc=document.createElement('canvas');tmpc.width=cv.width;tmpc.height=cv.height;if(cv.width)tmpc.getContext('2d').drawImage(cv,0,0);
    cv.width=r.width*dpr;cv.height=r.height*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle='#fff';g.fillRect(0,0,r.width,r.height);
    if(tmpc.width)g.drawImage(tmpc,0,0,tmpc.width/dpr,tmpc.height/dpr);
  }
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);line(last,last)};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);line(last,p);last=p};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  function line(a,b){g.strokeStyle=erase?'#fff':col;g.lineWidth=+$('#pS',body).value*(erase?2:1);g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  $$('[data-c]',body).forEach(b=>b.onclick=()=>{col=b.dataset.c;erase=false;$('#pE',body).classList.remove('on');$$('[data-c]',body).forEach(x=>x.classList.toggle('sel',x===b))});
  $('#pE',body).onclick=e=>{erase=!erase;e.currentTarget.classList.toggle('on',erase)};
  $('#pC',body).onclick=()=>{g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height)};
  $('#pD',body).onclick=()=>{const a=document.createElement('a');a.download='NovaOS-Bild.png';a.href=cv.toDataURL('image/png');a.click();notify('🎨','Bild gespeichert','NovaOS-Bild.png','#f857a6')};
  const ro=new ResizeObserver(resize);ro.observe(wrap);
  ctx.cleanup.push(()=>ro.disconnect());
}},

  if(P.length<12)return null;
  const now=Date.now();let k=P.findIndex(p=>p.t>now);if(k<=0)return null;
  const a=P[k-1],b=P[k],f=(now-a.t)/(b.t-a.t),cur=a.h+(b.h-a.h)*f,rising=b.h>a.h;
  const ev=[];for(let i=1;i<P.length-1;i++){const y0=P[i-1].h,y1=P[i].h,y2=P[i+1].h;
    if((y1>y0&&y1>=y2)||(y1<y0&&y1<=y2)){const den=y0-2*y1+y2,off=den?(y0-y2)/(2*den):0,o=Math.max(-.5,Math.min(.5,off));

  if(!a){a=document.createElement('div');a.id='asst';a.className='top';document.body.append(a);
    a.innerHTML=`<div class="as-sheet"><div class="as-head"><div class="as-orb"></div><div style="flex:1;min-width:0"><b class="as-title">Gufy Assistent</b><small class="as-st" id="asSt">Tippe oder nutze das 🎤 der Tastatur</small></div><button class="as-x" id="asX">✕</button></div>
      <form class="as-in" id="asForm"><input id="asTxt" placeholder="Was soll ich tun?" autocomplete="off" autocorrect="on" enterkeyhint="send"><button type="submit" class="as-go">↑</button></form>
      <div class="as-log" id="asLog"><div class="as-chips">${AS_CHIPS.map(c=>`<button data-ex="${esc(c)}">${esc(c)}</button>`).join('')}</div></div></div>`;
    a.addEventListener('pointerdown',e=>{if(e.target===a)closeAssistant()});
    $('#asX',a).onclick=()=>closeAssistant();
    $('#asForm',a).onsubmit=e=>{e.preventDefault();const t=$('#asTxt',a).value.trim();if(!t)return;$('#asTxt',a).value='';runAssistant(t)};
    $$('[data-ex]',a).forEach(b=>b.onclick=()=>runAssistant(b.dataset.ex));
  }
  if(a.classList.contains('open'))return;
  a.classList.add('open');haptic('heavy');
  $('.as-sheet',a).animate([{transform:'translateY(-40px) scale(.96)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:SPRING});
}
function asFocus(){const i=$('#asTxt');if(i&&$('#asst').classList.contains('open'))i.focus()}
function asHideOld(a){const box=$('#asLog',a);if(!box)return;
  $$('.as-me,.as-step',box).forEach(x=>x.classList.add('old'));box.classList.remove('show-old');
  const ch=$('.as-chips',box);if(ch)ch.style.display='';
  let b=$('.as-hist',box);const n=$$('.as-me.old',box).length;
  if(n&&!b){b=document.createElement('button');b.className='as-hist';box.prepend(b);b.onclick=()=>{box.classList.add('show-old');b.remove();const c=$('.as-chips',box);if(c)c.style.display='none';haptic('select');requestAnimationFrame(()=>box.scrollTop=box.scrollHeight)}}
  if(b)b.textContent=`🕘 Ältere Nachrichten anzeigen (${n})`;}
function closeAssistant(quick){const a=$('#asst');if(!a||!a.classList.contains('open'))return;const i=$('#asTxt',a);if(i)i.blur();
  setTimeout(()=>asHideOld(a),quick?0:220);
  if(quick){a.classList.remove('open');return}
  $('.as-sheet',a).animate([{opacity:1},{transform:'translateY(-40px)',opacity:0}],{duration:200,easing:'ease-in'}).onfinish=()=>a.classList.remove('open')}

/* =========================================================
   START
   ========================================================= */
renderHome();applyLook();tick();advance();renderBattery();devSync();
if(S.setupDone){ensureQuests();checkDebts()}
if(S.loc.mode==='gps'&&S.setupDone)startGeo();
addEventListener('beforeunload',()=>{advance();save()});
addEventListener('pagehide',()=>{advance();bsnap(true);save()});
if(S.poweredOff&&S.setupDone){show('off');offInfo()}else{S.poweredOff=false;boot()}
</script>
