<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>GufyUI</title>
<style>
:root{
  --accent:#4f8cff; --gold:#f5a524;
  --bg:#f4f6fb; --panel:rgba(255,255,255,.72); --panel-solid:#ffffff; --panel-2:#f2f3f7;
  --text:#14161c; --muted:#6b7280; --border:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05);
  --shadow:0 24px 70px rgba(0,0,0,.28);
}
body.dark{
  --bg:#0f1115; --panel:rgba(30,32,40,.72); --panel-solid:#14161c; --panel-2:#1f222b;
  --text:#f3f4f6; --muted:#9aa0ab; --border:rgba(255,255,255,.09); --hover:rgba(255,255,255,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:#000;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:block}
.wall{position:absolute;inset:0;transition:background .6s}
.glass{background:var(--panel);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--border)}

/* ---------- Bausteine ---------- */
.btn{padding:10px 18px;border-radius:12px;background:var(--hover);font-weight:600;font-size:15px;transition:transform .1s,filter .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,#ffd60a,#f5a524);color:#3a2600}
.btn.danger{background:#ff3b30;color:#fff}
.btn.big{padding:14px 30px;font-size:17px;border-radius:16px}
.input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel-2);outline:none;font-size:16px;transition:border .2s,box-shadow .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.tinput{padding:8px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel-solid);font-size:16px;outline:none}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{display:none}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--hover);border:1px solid var(--border);transition:.25s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s}
.switch input:checked+span{background:#34c759;border-color:#34c759}
.switch input:checked+span::after{transform:translateX(20px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.card{background:var(--panel-2);border-radius:16px;padding:6px 14px;margin-bottom:14px}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 8px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.seg{display:inline-flex;background:var(--hover);border-radius:12px;padding:3px;width:100%}
.seg button{flex:1;padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--panel-solid);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tabs{display:flex;gap:6px;padding:4px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:8px 14px;border-radius:20px;font-size:14px;font-weight:700;white-space:nowrap;background:var(--hover)}
.tabs button.on{background:var(--tc,var(--accent));color:#fff}

/* ---------- Akku-Symbol ---------- */
.batt{display:inline-block;position:relative;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1px;vertical-align:middle}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.bfill{display:block;height:100%;background:currentColor;border-radius:2px;transition:width .4s}
.batt.chg .bfill{background:#34c759}
.batt.low .bfill{background:#ff3b30}
.bbolt{display:none;font-size:11px;margin-left:1px}

/* ---------- Boot ---------- */
#boot,#off{background:#000;color:#fff}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.logo{width:88px;height:88px;border-radius:26px;background:conic-gradient(from 210deg,#7f5af0,#4f8cff,#2cb67d,#ffd60a,#ff8906,#ec4899,#7f5af0);display:grid;place-items:center;font-size:48px;font-weight:900;color:#fff;box-shadow:0 10px 40px rgba(127,90,240,.45);letter-spacing:-2px}
.logo span{filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand{font-size:28px;font-weight:800;letter-spacing:-.5px}
.brand i{font-style:normal;background:linear-gradient(90deg,#7f5af0,#4f8cff,#2cb67d);-webkit-background-clip:text;background-clip:text;color:transparent}
.bootbar{width:180px;height:5px;border-radius:5px;background:#2a2a2a;overflow:hidden}
.bootbar i{display:block;height:100%;width:0;background:#fff;border-radius:5px}
.boottxt{font-size:13px;color:#888;letter-spacing:.5px}

/* ---------- Startanimation (clean) ---------- */
#boot{background:#000}
.bmark{width:78px;height:78px;border-radius:24px;background:#fff;color:#000;display:grid;place-items:center;font-size:42px;font-weight:800;letter-spacing:-2px;opacity:0}
#boot.play .bmark{animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes markIn{from{opacity:0;transform:scale(.82);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
#bootBrand{font-size:28px;font-weight:400;color:#fff;letter-spacing:.04em;opacity:0;margin-top:4px}
#bootBrand b{font-weight:800}
#boot.play #bootBrand{animation:track 1.3s cubic-bezier(.2,.8,.2,1) .65s forwards}
@keyframes track{from{opacity:0;letter-spacing:.7em;filter:blur(6px)}to{opacity:1;letter-spacing:.04em;filter:none}}
.bootline{width:110px;height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;margin-top:18px}
.bootline i{display:block;height:100%;width:0;background:#fff}
#boot .boottxt{opacity:0;color:#6b6b6b;font-size:13px;letter-spacing:.3px}
#boot.play .bootline,#boot.play .boottxt{animation:fadeIn .6s ease 1.5s forwards}
@keyframes fadeIn{to{opacity:1}}
#boot.out .center{animation:fadeOut .5s ease forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(.97)}}

/* ---------- Secret-Code ---------- */
#pin{position:fixed;inset:0;z-index:1980;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#pin.open{display:flex}
.pinbox{width:min(320px,100%);border-radius:28px;padding:24px 22px;text-align:center;background:var(--panel-solid);color:var(--text);box-shadow:var(--shadow);animation:pop .2s ease}
.pinbox .pi{font-size:40px}
.pinbox b{display:block;font-size:17px;margin:6px 0 16px}
.pindots{display:flex;justify-content:center;gap:14px;margin-bottom:20px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.pindots i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pinpad button{height:58px;border-radius:50%;background:var(--hover);font-size:24px;font-weight:600;max-width:72px;width:100%;margin:auto}
.pinpad button:active{background:var(--accent);color:#fff}
.pinpad button.txt{font-size:14px;background:none}

/* ---------- Einrichtung ---------- */
#setup{background:#0b0b12;overflow:hidden}
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.55;animation:float 18s ease-in-out infinite alternate}
.blob.b1{background:#7f5af0;top:-20vmax;left:-15vmax}
.blob.b2{background:#2cb67d;bottom:-25vmax;right:-15vmax;animation-delay:-6s}
.blob.b3{background:#ec4899;top:30%;left:40%;width:40vmax;height:40vmax;animation-delay:-12s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#setupCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,92vw);max-height:92vh;overflow:auto;border-radius:28px;padding:34px 30px 26px;background:var(--panel);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--border);box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center}
.dots{display:flex;justify-content:center;gap:7px;margin-bottom:24px}
.dots i{width:7px;height:7px;border-radius:5px;background:var(--border);transition:.3s}
.dots i.on{width:22px;background:var(--accent)}
.s-body{animation:stepIn .4s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}}
.s-hello{font-size:clamp(52px,14vw,76px);font-weight:800;letter-spacing:-2px;background:linear-gradient(90deg,#7f5af0,#4f8cff,#2cb67d,#ff8906,#ec4899);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;margin:10px 0 8px;transition:opacity .4s}
@keyframes shine{to{background-position:300% 0}}
.s-ico{font-size:50px;margin-bottom:10px}
#setupCard h1{font-size:26px;letter-spacing:-.5px;margin-bottom:8px}
.s-sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:22px}
.s-err{color:#ff453a;font-size:14px;min-height:20px;margin-top:8px}
.s-foot{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.s-foot .btn{flex:1}
.pwwrap{position:relative;margin-bottom:10px}
.pwwrap button{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
.strength{height:5px;border-radius:5px;background:var(--hover);overflow:hidden;margin-top:6px}
.strength i{display:block;height:100%;width:0;transition:.3s}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.themecard{border-radius:16px;padding:10px;border:2px solid var(--border);transition:.2s}
.themecard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.themecard .pv{height:74px;border-radius:10px;margin-bottom:8px;position:relative;overflow:hidden}
.themecard .pv i{position:absolute;left:10px;right:10px;height:10px;border-radius:5px}
.colors{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.colors button{width:34px;height:34px;border-radius:50%;outline:2px solid transparent;outline-offset:3px;transition:.2s}
.colors button.sel{outline-color:var(--text);transform:scale(1.1)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.walls button{aspect-ratio:3/4;border-radius:14px;border:3px solid transparent;transition:.2s}
.walls button.sel{border-color:var(--accent);transform:scale(1.04)}
.summary{text-align:left;margin:4px 0 22px}

/* ---------- Sperrbildschirm ---------- */
#lock{color:#fff}
#lock .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45))}
.lk-top{position:absolute;top:10px;right:16px;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.lk-time{position:absolute;top:11vh;width:100%;text-align:center;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.lk-time .d{font-size:20px;font-weight:600;opacity:.9}
.lk-time .t{font-size:clamp(80px,22vw,120px);font-weight:700;letter-spacing:-3px;line-height:1.05}
.lk-login{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;width:min(320px,86vw)}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a855f7);display:grid;place-items:center;font-size:36px;font-weight:700;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.6)}
.lk-name{font-size:20px;font-weight:600}
.lk-field{display:flex;width:100%;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px;border:1px solid rgba(255,255,255,.3);overflow:hidden}
.lk-field input{flex:1;min-width:0;background:none;border:none;outline:none;padding:13px 16px;color:#fff;font-size:16px}
.lk-field input::placeholder{color:rgba(255,255,255,.7)}
.lk-field button{width:50px;font-size:20px;color:#fff;background:rgba(255,255,255,.15)}
.lk-err{min-height:18px;font-size:14px;color:#ffd1cf;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* ---------- Desktop ---------- */
#statusbar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;font-weight:600;z-index:500;border-width:0 0 1px 0}
#statusbar .left,#statusbar .right{display:flex;align-items:center;gap:8px}
.sb-btn{padding:3px 8px;border-radius:7px;display:flex;align-items:center;gap:6px}
.sb-btn:hover{background:var(--hover)}
.sb-coins{color:var(--gold);font-weight:800}
#menu{position:absolute;top:34px;left:8px;width:230px;border-radius:14px;padding:6px;z-index:600;display:none;box-shadow:var(--shadow);animation:pop .15s ease}
#menu.open{display:block}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px}
#menu button:hover{background:var(--accent);color:#fff}
#menu hr{border:none;border-top:1px solid var(--border);margin:5px 6px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-6px)}}

#home{position:absolute;inset:30px 0 0 0;padding:22px 22px 110px;overflow:auto}
.homeinner{max-width:820px;margin:0 auto}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.widget{border-radius:22px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:left}
.widget .wt{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px}
.widget .big{font-size:38px;font-weight:700;letter-spacing:-1px}
.wbatt{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:22px 10px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff;font-size:12.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s}
.appicon:active .ic{transform:scale(.9)}
.appicon:hover .ic{transform:translateY(-3px)}

/* ---------- App-Ansicht ---------- */
#appview{position:absolute;inset:30px 0 0 0;z-index:100;display:none;flex-direction:column;background:var(--bg);animation:appIn .28s cubic-bezier(.2,.9,.3,1.1)}
#appview.open{display:flex}
#appview.closing{animation:appOut .2s ease forwards}
@keyframes appIn{from{opacity:0;transform:scale(.92) translateY(20px)}}
@keyframes appOut{to{opacity:0;transform:scale(.92) translateY(20px)}}
.apphead{height:54px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;border-bottom:1px solid var(--border);background:var(--panel-solid)}
.appbody{flex:1;overflow:auto;padding:18px 16px 110px}
.appinner{max-width:760px;margin:0 auto}

.appbody.full{padding:0 0 84px;display:flex;flex-direction:column;overflow:hidden}
.appbody.full .appinner{max-width:none;width:100%;flex:1;min-height:0;overflow:auto;position:relative}
.pad{padding:18px}
.fill{display:flex;flex-direction:column;height:100%}
.fill>.grow{flex:1;overflow:auto}
h2.sec{font-size:22px;margin:4px 0 14px;letter-spacing:-.4px}
/* Rechner */
.calc{display:flex;flex-direction:column;height:100%;background:#000;color:#fff;padding:12px}
.calc .disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 10px;min-height:90px}
.calc .expr{font-size:16px;color:#999;min-height:20px}
.calc .val{font-size:clamp(36px,9vw,56px);font-weight:300;word-break:break-all;text-align:right;line-height:1.1}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.calc .keys button{height:clamp(46px,9vh,64px);border-radius:999px;background:#333;font-size:24px;transition:filter .1s}
.calc .keys button:active{filter:brightness(1.5)}
.calc .keys .fn{background:#a5a5a5;color:#000}
.calc .keys .op{background:#ff9f0a}
.calc .keys .op.sel{background:#fff;color:#ff9f0a}
.calc .keys .zero{grid-column:span 2;text-align:left;padding-left:26px}

/* Notizen */
.notelist button.note{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel-2);margin-bottom:8px}
.notelist button.note:hover{background:var(--hover)}
.note b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note small{color:var(--muted);font-size:12.5px}
.ned{display:flex;flex-direction:column;height:100%}
.ned .bar{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border)}
.ned textarea{flex:1;border:none;outline:none;resize:none;padding:18px;background:transparent;font-size:16px;line-height:1.6}

/* Uhr */
.aclock{width:200px;height:200px;border-radius:50%;margin:10px auto 18px;position:relative;background:var(--panel-2);box-shadow:inset 0 0 0 6px var(--border),0 10px 30px rgba(0,0,0,.15)}
.aclock .mk{position:absolute;left:50%;top:8px;width:2px;height:10px;background:var(--muted);transform-origin:50% 92px}
.aclock .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px}
.aclock .hh{width:6px;height:52px;margin-left:-3px;background:var(--text)}
.aclock .mh{width:4px;height:76px;margin-left:-2px;background:var(--text)}
.aclock .sh{width:2px;height:84px;margin-left:-1px;background:#ff9f0a}
.aclock .cap{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#ff9f0a}
.digital{text-align:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.world .row b{font-size:15px}.world .row span{font-size:22px;font-variant-numeric:tabular-nums;font-weight:300}
.sw{font-size:clamp(46px,12vw,64px);font-weight:200;text-align:center;font-variant-numeric:tabular-nums;margin:24px 0}
.swbtns{display:flex;justify-content:space-between;max-width:320px;margin:0 auto 18px}
.swbtns button{width:84px;height:84px;border-radius:50%;font-weight:600;background:var(--hover);border:2px solid var(--border)}
.swbtns .go{background:rgba(52,199,89,.2);color:#34c759}
.swbtns .stop{background:rgba(255,59,48,.2);color:#ff3b30}
.laps{max-width:360px;margin:0 auto}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}

/* Kalender */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead b{font-size:20px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .wd{font-size:12px;color:var(--muted);font-weight:700;padding:6px 0}
.calgrid button{aspect-ratio:1;border-radius:50%;font-size:15px;position:relative;max-height:48px;margin:auto;width:100%}
.calgrid button:hover{background:var(--hover)}
.calgrid button.today{background:#ff3b30;color:#fff;font-weight:700}
.calgrid button.sel{outline:2px solid var(--accent)}
.calgrid button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.calgrid .other{opacity:.3}

/* Snake */
.snake{display:flex;flex-direction:column;align-items:center;height:100%;padding:12px;gap:10px;background:#0e1a12;color:#d6ffe0}
.snk-top{display:flex;justify-content:space-between;width:100%;max-width:420px;font-size:15px}
.snake canvas{border-radius:12px;box-shadow:0 0 0 2px #1f3a26;touch-action:none;background:#12241a}
.snk-ctl{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:6px;align-items:center;justify-items:center}
.snk-ctl button{width:52px;height:44px;border-radius:12px;background:#1f3a26;color:#9effb5;font-size:18px}
.snk-row{display:flex;gap:14px;align-items:center}

/* Zeichnen */

/* =========================================================
   AKKU – läuft in Echtzeit, auch wenn GufyUI geschlossen ist
   Unterwegs:            100 % in 24 Std.  → −4,17 %/h
   Zu Hause (wach):      lädt langsam      → +2 %/h
   Zu Hause (Schlafen):  8 Std. = 100 %    → +12,5 %/h
   ========================================================= */
let adminOK=false;const ADMIN='hyjfacf';
const R_AWAY=-100/24, R_HOME=2, R_SLEEP=100/8;
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
function isSleepTime(d){
  const m=d.getHours()*60+d.getMinutes(),f=toMin(S.sleep.from),t=toMin(S.sleep.to);
  if(f===t)return false;
  return f<t?(m>=f&&m<t):(m>=f||m<t);
}
function rate(d){if(!S.loc.isHome)return R_AWAY;return isSleepTime(d)?R_SLEEP:R_HOME}
function advance(){
  const now=Date.now();
  let t=S.battery.last||now;
  if(now-t>60*864e5)t=now-60*864e5;          // max. 60 Tage nachrechnen
  let lv=S.battery.level;
  while(t<now){
    const st=Math.min(now-t,60000-(t%60000)); // minutengenau
    lv+=rate(new Date(t))*st/3600000;
    lv=Math.max(0,Math.min(100,lv));
    t+=st;
  }
  S.battery.level=lv;S.battery.last=now;
}
const dispPct=()=>{const l=S.battery.level;return l<=0?0:Math.min(100,Math.ceil(l-1e-9))};
const charging=()=>rate(new Date())>0&&S.battery.level<99.95;
function fmtDur(hrs){const m=Math.round(hrs*60),H=Math.floor(m/60),M=m%60;return H?`${H} Std. ${M} Min.`:`${M} Min.`}
function statusInfo(){
  if(!S.loc.isHome)return{ic:'🚶',t:'Unterwegs',r:'−4,2 % pro Std.',col:'linear-gradient(135deg,#ff9500,#ff5e3a)'};
  if(isSleepTime(new Date()))return{ic:'😴',t:'Schlafenszeit',r:'+12,5 % pro Std.',col:'linear-gradient(135deg,#5e5ce6,#2b1f7a)'};
  return{ic:'🏠',t:'Zu Hause',r:'+2 % pro Std.',col:'linear-gradient(135deg,#34c759,#0a8f3c)'};
}
function remainText(){
  const lv=S.battery.level;
  if(rate(new Date())<0)return 'Reicht noch '+fmtDur(lv/(-R_AWAY));
  if(lv>=99.95)return 'Voll geladen';
  let t=Date.now(),l=lv;
  for(let i=0;i<4320;i++){l+=rate(new Date(t))/60;t+=60000;if(l>=100)return 'Voll in '+fmtDur((t-Date.now())/3600000)}
  return 'Lädt …';
}
let saveCount=0;
function batteryTick(){
  advance();
  const lv=S.battery.level;
  if(lv<=0){S.w20=S.w10=true}
  if(rate(new Date())<0){
    if(lv<=20&&!S.w20){S.w20=true;notify('🔋','Akku schwach','Noch 20 %. Geh nach Hause oder nutze eine Powerbank.','#ff3b30')}
    if(lv<=10&&!S.w10){S.w10=true;notify('🪫','Akku fast leer','Nur noch 10 %!','#ff3b30')}
  }
  if(lv>25){S.w20=false;S.w10=false}
  if(lv>=99.95&&S.wasCharging){S.wasCharging=false;notify('🔋','Voll geladen','Dein Akku ist bei 100 %.','#34c759')}
  if(charging())S.wasCharging=true;
  if(lv<=0&&!['empty','setup','boot','off'].includes(current))batteryDead();
  if(current==='empty')updateEmpty();
  renderBattery();
  if(++saveCount%5===0)save();
}
function renderBattery(){
  const lv=dispPct(),chg=charging(),st=statusInfo();
  $$('.bfill').forEach(f=>f.style.width=lv+'%');
  $$('.batt').forEach(b=>{b.classList.toggle('chg',chg);b.classList.toggle('low',lv<=20&&!chg)});
  $$('.bpct').forEach(e=>e.textContent=lv+'%');
  $$('.bbolt').forEach(e=>e.style.display=chg?'inline':'none');
  $$('.js-bstate').forEach(e=>e.textContent=`${st.ic} ${st.t} · ${st.r}`);
  const rem=remainText();
  $$('.js-bremain').forEach(e=>e.textContent=rem);
  $$('.js-locicon').forEach(e=>e.textContent=st.ic);
  const col=chg?'#34c759':lv<=20?'#ff3b30':'var(--accent)';
  const r=$('#ring');if(r)r.style.background=`radial-gradient(var(--panel-solid) 58%,transparent 59%),conic-gradient(${col} ${lv*3.6}deg,var(--hover) 0)`;
}
function batteryDead(){
  closeAppNow();closeMenus();
  show('empty');updateEmpty();
}
function updateEmpty(){
  const lv=S.battery.level,dead=lv<=0;
  const t=$('#emptyTitle');
  t.textContent=dead?'AKKU LEER':'Akku: '+dispPct()+' %';

/* ---------- GPS ---------- */
let geoWatch=null,geoPos=null,geoErr='';
function distM(a,b){const R=6371000,toR=x=>x*Math.PI/180;const dLa=toR(b.lat-a.lat),dLo=toR(b.lon-a.lon);
  const q=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function onGeo(p){
  geoPos={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};geoErr='';
  if(S.loc.mode==='gps'&&S.loc.home)setHome(distM(geoPos,S.loc.home)<=S.loc.radius);
  if(current==='empty')updateEmpty();
  if(appCtx&&appCtx.refresh)appCtx.refresh();
}
function onGeoErr(e){
  geoErr=e.code===1?'Standortzugriff wurde abgelehnt. Erlaube ihn im Browser oder nutze den manuellen Modus.':'Standort konnte nicht ermittelt werden.';
  if(appCtx&&appCtx.refresh)appCtx.refresh();
}
const geoOpts={enableHighAccuracy:true,maximumAge:30000,timeout:20000};
function startGeo(){
  if(!navigator.geolocation){geoErr='Dieser Browser unterstützt kein GPS. Nutze den manuellen Modus.';return}
  if(geoWatch===null)geoWatch=navigator.geolocation.watchPosition(onGeo,onGeoErr,geoOpts);
}
function stopGeo(){if(geoWatch!==null){navigator.geolocation.clearWatch(geoWatch);geoWatch=null}}
function checkGeoOnce(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(onGeo,onGeoErr,geoOpts);else onGeoErr({code:0})}

/* ---------- Mitteilungen ---------- */
function notify(icon,title,text,color){
  if(S.dnd)return;
  const t=h(`<div class="toast glass"><div class="ic" style="background:${color||'var(--accent)'}">${icon}</div><div><b>${esc(title)}</b><small>${esc(text)}</small></div></div>`);
  $('#toasts').prepend(t);
  let gone=false,sx=0,sy=0,dx=0,dy=0,drag=false;
  const kill=(dir)=>{if(gone)return;gone=true;
    if(dir){t.style.transform=dir==='up'?'translateY(-140%)':`translateX(${dir*120}%)`;t.style.opacity=0;setTimeout(()=>t.remove(),260)}
    else{t.classList.add('out');setTimeout(()=>t.remove(),300)}};
  t.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;dx=dy=0;t.style.transition='none';t.setPointerCapture(e.pointerId)});
  t.addEventListener('pointermove',e=>{if(!drag)return;dx=e.clientX-sx;dy=Math.min(0,e.clientY-sy);
    t.style.transform=Math.abs(dx)>-dy?`translateX(${dx}px)`:`translateY(${dy}px)`;t.style.opacity=1-Math.min(.8,Math.max(Math.abs(dx),-dy)/220)});
  const end=()=>{if(!drag)return;drag=false;t.style.transition='';
    if(Math.abs(dx)>70)kill(Math.sign(dx));else if(dy<-35)kill('up');
    else{t.style.transform='';t.style.opacity=''}};
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
  setTimeout(()=>{if(!drag)kill()},5000);
}

  if(!$('#pin').classList.contains('open'))return;
  if(k==='x')return pinClose(false);
  if(k==='del'){pinVal=pinVal.slice(0,-1);return pinDraw()}
  if(pinVal.length>=4)return;

const snapCoins=(raw,diff)=>COINSTEPS[diff].reduce((b,v)=>Math.abs(v-raw)<Math.abs(b-raw)?v:b);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nice=n=>n<20?n:n<100?Math.round(n/5)*5:n<1000?Math.round(n/10)*10:Math.round(n/500)*500;
const coinsR=c=>Math.max(5,Math.round(c/5)*5);
function genQuest(diff,avoid){
  let q;
  const own=(S.customQ||[]).filter(x=>x.diff===diff);
  for(let k=0;k<40;k++){
    if(own.length&&Math.random()<.3){
      const o=own[rnd(0,own.length-1)];q={i:o.i,title:o.title,coins:o.coins,tag:'own',hint:''};
    }else if(Math.random()<.45){
      const opts=QT.filter(x=>x.r[diff]),tpl=opts[rnd(0,opts.length-1)],[a,b]=tpl.r[diff],n=nice(rnd(a,b));
      q={i:tpl.i,title:tpl.t(n),coins:snapCoins(tpl.c(n),diff),tag:tpl.g,hint:tpl.h||''};
    }else{
      const L=QF[diff],f=L[rnd(0,L.length-1)];
      q={i:f[0],title:f[1],coins:f[2],tag:f[3],hint:f[4]||''};
    }
    const same=avoid.some(x=>x.title===q.title||x.i===q.i);
    if(!same)break;
  }
  q.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);q.diff=diff;
  return q;
}
function ensureQuests(){
  S.quests??={};
  DIFFS.forEach(([d])=>{S.quests[d]??=[];while(S.quests[d].length<6)S.quests[d].push(genQuest(d,S.quests[d]))});
}

      <div class="seg" style="margin-bottom:12px"><button data-mode="manual" class="${S.loc.mode==='manual'?'on':''}">✋ Manuell</button><button data-mode="gps" class="${S.loc.mode==='gps'?'on':''}">📍 GPS</button></div>
      <div id="lGps">${gpsHTML()}</div>
      <div class="label">Schlafenszeit</div>
      <div class="card">
        <div class="row"><span>😴 Schlafen ab</span><input type="time" class="tinput" id="sF" value="${S.sleep.from}"></div>
        <div class="row"><span>⏰ Aufstehen um</span><input type="time" class="tinput" id="sT" value="${S.sleep.to}"></div>
        <div class="row"><span>Dauer</span><b>${fmtDur(sh)}</b></div>
      </div>`;
    $$('[data-mode]',body).forEach(b=>b.onclick=()=>{
      if(b.dataset.mode===S.loc.mode)return;
      askCode('Modus ändern',()=>{
        advance();S.loc.mode=b.dataset.mode;save();
        if(S.loc.mode==='gps'){startGeo();checkGeoOnce()}else stopGeo();
        updateCC();draw();
      });
    });
    const upd=(k,v)=>askCode('Schlafenszeit ändern',()=>{advance();S.sleep[k]=v;save();renderBattery();updateCC();draw()},draw);
    $('#sF',body).onchange=e=>e.target.value&&upd('from',e.target.value);

    const st=$('#lSet',body);if(st)st.onclick=()=>{if(!geoPos)return;askCode('Zuhause festlegen',()=>{S.loc.home={lat:geoPos.lat,lon:geoPos.lon};save();setHome(true,true);notify('🏠','Zuhause gespeichert','GufyUI erkennt jetzt automatisch, ob du zu Hause bist.','#34c759');refresh()})};
    const rd=$('#lRad',body);if(rd){rd.oninput=e=>{$('#lRadV',body).textContent=e.target.value+' m'};rd.onchange=e=>{const v=+e.target.value;askCode('Radius ändern',()=>{S.loc.radius=v;save();if(geoPos&&S.loc.home)setHome(distM(geoPos,S.loc.home)<=S.loc.radius);refresh()},refresh)}}
  }
  function drawMap(){
    const box=$('#mapBox',body);if(!box||!geoPos)return;
    if(mapAt&&distM(mapAt,geoPos)<25&&box.firstChild)return;
    mapAt={...geoPos};
    const {lat,lon}=geoPos;
    box.innerHTML=`<iframe class="map" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-.006},${lat-.0035},${lon+.006},${lat+.0035}&layer=mapnik&marker=${lat},${lon}"></iframe>`;
  }
  function refresh(){
    const s=$('#lStat',body);if(!s)return;
    s.innerHTML=statusHTML();
    const focusIn=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#lGps');
    if(!focusIn){const old=$('#mapBox',body)?.firstChild;$('#lGps',body).innerHTML=gpsHTML();const nb=$('#mapBox',body);if(nb&&old)nb.append(old);bindGps();drawMap()}
  }
  ctx.refresh=refresh;
  if(S.loc.mode==='gps')startGeo();
  draw();
  const iv=setInterval(()=>{const s=$('#lStat',body);if(s)s.innerHTML=statusHTML()},15000);
  ctx.cleanup.push(()=>clearInterval(iv));
}},

calc:{name:'Rechner',cat:'Werkzeuge',full:true,store:true,icon:'🧮',bg:'linear-gradient(135deg,#3a3a3c,#000)',w:340,h:540,
render(body,ctx){
  const K=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],[','],['=','op']];
  body.innerHTML=`<div class="calc"><div class="disp"><div class="expr"></div><div class="val">0</div></div><div class="keys">${K.map(k=>`<button class="${k[1]||''}" data-k="${k[0]}">${k[0]}</button>`).join('')}</div></div>`;
  let cur='0',prev=null,op=null,fresh=false;
  const val=$('.val',body),ex=$('.expr',body);
  const fmt=n=>{if(!isFinite(n))return 'Fehler';return String(parseFloat(n.toPrecision(12)))};
  const show=()=>{val.textContent=cur.replace('.',',');ex.textContent=prev!==null&&op?fmt(prev).replace('.',',')+' '+op:'';
    $$('.op',body).forEach(b=>b.classList.toggle('sel',b.dataset.k===op&&fresh))};
  const compute=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:o==='÷'?a/b:b;
  function press(k){
    if(/^[0-9]$/.test(k)){if(fresh||cur==='0'){cur=k}else if(cur.length<15)cur+=k;fresh=false}
    else if(k===','){if(fresh){cur='0';fresh=false}if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){cur='0';prev=null;op=null;fresh=false}
    else if(k==='±'){cur=cur.startsWith('-')?cur.slice(1):(cur==='0'?'0':'-'+cur)}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100)}
    else if(k==='='){if(op!==null&&prev!==null){cur=fmt(compute(prev,parseFloat(cur),op));prev=null;op=null;fresh=true}}
    else{ if(op&&!fresh&&prev!==null){cur=fmt(compute(prev,parseFloat(cur),op))} prev=parseFloat(cur);op=k;fresh=true }
    show();
  }
  $$('[data-k]',body).forEach(b=>b.onclick=()=>press(b.dataset.k));
  const kd=e=>{if(curApp()!=='calc')return;const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=',',':',','.':',','Escape':'AC','Backspace':'BS'};
    if(/^[0-9]$/.test(e.key))press(e.key);else if(m[e.key]==='BS'){cur=cur.length>1?cur.slice(0,-1):'0';show()}else if(m[e.key])press(m[e.key])};
  addEventListener('keydown',kd);ctx.cleanup.push(()=>removeEventListener('keydown',kd));
}},

/* ---------- Uhr ---------- */
clock:{name:'Uhr',cat:'Werkzeuge',full:true,store:true,icon:'⏰',bg:'linear-gradient(135deg,#2c3e50,#000)',w:440,h:580,
render(body,ctx){
  body.innerHTML=`<div class="fill"><div class="tabs"><button data-c="clock" class="on">🕐 Uhr</button><button data-c="sw">⏱️ Stoppuhr</button><button data-c="timer">⏳ Timer</button></div><div class="grow pad" id="cc2"></div></div>`;
  const c=$('#cc2',body);let iv=null;
  // Stoppuhr-/Timer-Zustand bleibt beim Tab-Wechsel erhalten
  const sw={run:false,start:0,acc:0,laps:[]};
  const tm={end:0,left:0,run:false};
  const fmtSW=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,cs=Math.floor(ms/10)%100;return pad(m)+':'+pad(s)+','+pad(cs)};
  const fmtT=ms=>{const t=Math.ceil(ms/1000);return pad(Math.floor(t/60))+':'+pad(t%60)};
  function tab(t){
    clearInterval(iv);
    $$('[data-c]',body).forEach(b=>b.classList.toggle('on',b.dataset.c===t));
    if(t==='clock'){
      let marks='';for(let i=0;i<12;i++)marks+=`<i class="mk" style="transform:rotate(${i*30}deg);${i%3===0?'height:14px;width:3px;background:var(--text)':''}"></i>`;
      const zones=[['Berlin','Europe/Berlin'],['London','Europe/London'],['New York','America/New_York'],['Tokio','Asia/Tokyo'],['Sydney','Australia/Sydney']];
      c.innerHTML=`<div class="aclock">${marks}<div class="hand hh"></div><div class="hand mh"></div><div class="hand sh"></div><div class="cap"></div></div><div class="digital" id="dg"></div>
        <div class="label">Weltuhr</div><div class="card world">${zones.map(z=>`<div class="row"><b>${z[0]}</b><span data-z="${z[1]}"></span></div>`).join('')}</div>`;
      const upd=()=>{const d=new Date();const s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes()+s/60,hh=(d.getHours()%12)+m/60;
        $('.hh',c).style.transform=`rotate(${hh*30}deg)`;$('.mh',c).style.transform=`rotate(${m*6}deg)`;$('.sh',c).style.transform=`rotate(${s*6}deg)`;
        $('#dg',c).textContent=d.toLocaleTimeString('de-DE');
        $$('[data-z]',c).forEach(e=>{try{e.textContent=d.toLocaleTimeString('de-DE',{timeZone:e.dataset.z,hour:'2-digit',minute:'2-digit'})}catch(_){e.textContent='–'}})};
      upd();iv=setInterval(upd,100);
    }
    if(t==='sw'){
      c.innerHTML=`<div class="sw" id="swd">00:00,00</div><div class="swbtns"><button id="swL">Runde</button><button id="swS" class="go">Start</button></div><div class="laps card" id="laps"></div>`;
      const d=$('#swd',c),bS=$('#swS',c),bL=$('#swL',c),L=$('#laps',c);
      const now=()=>sw.acc+(sw.run?performance.now()-sw.start:0);
      const draw=()=>{d.textContent=fmtSW(now());bS.textContent=sw.run?'Stopp':'Start';bS.className=sw.run?'stop':'go';bL.textContent=sw.run||!now()?'Runde':'Zurücksetzen';
        L.style.display=sw.laps.length?'':'none';L.innerHTML=sw.laps.map((l,i)=>`<div class="row"><span>Runde ${sw.laps.length-i}</span><b style="font-variant-numeric:tabular-nums">${fmtSW(l)}</b></div>`).join('')};
      bS.onclick=()=>{if(sw.run){sw.acc+=performance.now()-sw.start;sw.run=false}else{sw.start=performance.now();sw.run=true}draw()};
      bL.onclick=()=>{if(sw.run){sw.laps.unshift(now())}else{sw.acc=0;sw.laps=[]}draw()};
      draw();iv=setInterval(()=>{d.textContent=fmtSW(now())},33);
    }
    if(t==='timer'){
      c.innerHTML=`<div class="sw" id="td">05:00</div>
        <div class="presets">${[1,3,5,10,15,30].map(m=>`<button class="btn" data-m="${m}">${m} Min</button>`).join('')}</div>
        <div class="swbtns"><button id="tR">Abbrechen</button><button id="tS" class="go">Start</button></div>`;
      if(!tm.run&&!tm.left)tm.left=5*60000;
      const d=$('#td',c),bS=$('#tS',c);
      const left=()=>tm.run?Math.max(0,tm.end-Date.now()):tm.left;
      const draw=()=>{d.textContent=fmtT(left());bS.textContent=tm.run?'Pause':'Start';bS.className=tm.run?'stop':'go'};
      $$('[data-m]',c).forEach(b=>b.onclick=()=>{tm.run=false;tm.left=b.dataset.m*60000;draw()});
      bS.onclick=()=>{if(tm.run){tm.left=left();tm.run=false}else if(tm.left>0){tm.end=Date.now()+tm.left;tm.run=true}draw()};
      $('#tR',c).onclick=()=>{tm.run=false;tm.left=5*60000;draw()};
      draw();iv=setInterval(draw,250);
    }
  }
  // Timer läuft auch im Hintergrund weiter
  const bg=setInterval(()=>{if(tm.run&&Date.now()>=tm.end){tm.run=false;tm.left=0;notify('⏰','Timer abgelaufen','Deine Zeit ist um!','#ff9f0a')}},250);
  $$('[data-c]',body).forEach(b=>b.onclick=()=>tab(b.dataset.c));
  ctx.cleanup.push(()=>{clearInterval(iv);clearInterval(bg)});
  tab('clock');
}},

/* ---------- Kalender ---------- */
calendar:{name:'Kalender',cat:'Produktivität',full:true,store:true,icon:'📅',bg:'linear-gradient(135deg,#ff6b6b,#ee5a24)',w:460,h:600,
render(body){
  const now=new Date();let y=now.getFullYear(),m=now.getMonth(),sel=key(now);
  function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function draw(){
    const first=new Date(y,m,1),startDay=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
    let cells='';
    for(let i=0;i<42;i++){
      const dn=i-startDay+1;let d,other=false;
      if(dn<1){d=new Date(y,m-1,prevDays+dn);other=true}else if(dn>days){d=new Date(y,m+1,dn-days);other=true}else d=new Date(y,m,dn);
      const k=key(d);
      cells+=`<button data-d="${k}" class="${other?'other ':''}${k===key(now)?'today ':''}${k===sel?'sel ':''}${S.events[k]?.length?'has':''}">${d.getDate()}</button>`;
    }
    const ev=S.events[sel]||[];
    const sd=new Date(sel);
    body.innerHTML=`<div class="pad"><div class="calhead"><button class="btn" id="cP">‹</button><b>${first.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</b><button class="btn" id="cN">›</button></div>
      <div class="calgrid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div>
      <div class="label">${sd.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</div>
      <div class="card">${ev.length?ev.map((e,i)=>`<div class="row"><span>📌 ${esc(e)}</span><button data-del="${i}" style="color:#ff3b30">✕</button></div>`).join(''):'<div class="row muted">Keine Termine</div>'}</div>
      <div style="display:flex;gap:8px"><input class="input" id="cE" placeholder="Neuer Termin …" maxlength="60"><button class="btn primary" id="cA">＋</button></div></div>`;
    $('#cP',body).onclick=()=>{m--;if(m<0){m=11;y--}draw()};
    $('#cN',body).onclick=()=>{m++;if(m>11){m=0;y++}draw()};
    $$('[data-d]',body).forEach(b=>b.onclick=()=>{sel=b.dataset.d;const d=new Date(sel);y=d.getFullYear();m=d.getMonth();draw()});
    const add=()=>{const v=$('#cE',body).value.trim();if(!v)return;(S.events[sel]??=[]).push(v);save();draw()};
    $('#cA',body).onclick=add;$('#cE',body).onkeydown=e=>{if(e.key==='Enter')add()};
    $$('[data-del]',body).forEach(b=>b.onclick=()=>{S.events[sel].splice(+b.dataset.del,1);if(!S.events[sel].length)delete S.events[sel];save();draw()});
  }
  draw();
}},

/* ---------- Snake ---------- */
snake:{name:'Snake',cat:'Spiele',full:true,store:true,icon:'🐍',bg:'linear-gradient(135deg,#11998e,#38ef7d)',w:440,h:620,
render(body,ctx){
  body.innerHTML=`<div class="snake"><div class="snk-top"><span>Punkte: <b id="sc">0</b></span><span>🏆 Rekord: <b id="hi">${S.snakeHigh}</b></span></div>
    <canvas id="cv"></canvas>
    <div class="snk-row"><div class="snk-ctl"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button></div>
    <button class="btn primary" id="sg" style="height:56px;min-width:100px">▶ Start</button></div></div>`;
  const cv=$('#cv',body),g=cv.getContext('2d'),N=18;
  let size=300,cell,sn,dir,nd,food,run=false,over=false,score=0,loop=null;
  function fit(){
    const r=body.getBoundingClientRect();
    size=Math.max(180,Math.floor(Math.min(r.width-24,r.height-200,460)/N)*N);
    const dpr=devicePixelRatio||1;cv.width=size*dpr;cv.height=size*dpr;cv.style.width=size+'px';cv.style.height=size+'px';
    g.setTransform(dpr,0,0,dpr,0,0);cell=size/N;draw();
  }
  function reset(){sn=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={x:1,y:0};nd=dir;score=0;over=false;place();$('#sc',body).textContent=0}
  function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(p=>p.x===food.x&&p.y===food.y))}
  function step(){
    dir=nd;const hd={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(hd.x<0||hd.y<0||hd.x>=N||hd.y>=N||sn.some(p=>p.x===hd.x&&p.y===hd.y)){gameOver();return}
    sn.unshift(hd);
    if(hd.x===food.x&&hd.y===food.y){score++;$('#sc',body).textContent=score;place();
      if(score>S.snakeHigh){S.snakeHigh=score;save();$('#hi',body).textContent=score}
      clearInterval(loop);loop=setInterval(step,Math.max(60,130-score*3))}
    else sn.pop();
    draw();
  }
  function gameOver(){run=false;over=true;clearInterval(loop);$('#sg',body).textContent='↻ Nochmal';draw();
    if(score&&score>=S.snakeHigh)notify('🏆','Neuer Rekord!',score+' Punkte in Snake','#11998e')}
  function rr(x,y,w,hh,r){g.beginPath();g.roundRect?g.roundRect(x,y,w,hh,r):g.rect(x,y,w,hh);g.fill()}
  function draw(){
    if(!sn)return;
    g.fillStyle='#12241a';g.fillRect(0,0,size,size);
    g.fillStyle='#16301f';for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2)g.fillRect(i*cell,j*cell,cell,cell);
    g.fillStyle='#ff4757';g.beginPath();g.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*.38,0,7);g.fill();
    sn.forEach((p,i)=>{g.fillStyle=i===0?'#7dffa0':`hsl(140,${70-i}%,${55-Math.min(20,i)}%)`;rr(p.x*cell+1,p.y*cell+1,cell-2,cell-2,cell*.3)});
    const hd=sn[0];g.fillStyle='#0e1a12';g.beginPath();g.arc(hd.x*cell+cell/2+dir.x*cell*.15-dir.y*cell*.18,hd.y*cell+cell/2+dir.y*cell*.15-dir.x*cell*.18,cell*.09,0,7);g.arc(hd.x*cell+cell/2+dir.x*cell*.15+dir.y*cell*.18,hd.y*cell+cell/2+dir.y*cell*.15+dir.x*cell*.18,cell*.09,0,7);g.fill();
    if(!run){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,size,size);g.fillStyle='#fff';g.textAlign='center';g.font='bold 22px system-ui';
      g.fillText(over?'Game Over – '+score+' Punkte':'Bereit?',size/2,size/2-6);g.font='14px system-ui';g.fillStyle='#9effb5';g.fillText('Pfeiltasten, Wischen oder Knöpfe',size/2,size/2+20)}
  }
  function turn(x,y){if(sn.length>1&&x===-dir.x&&y===-dir.y)return;nd={x,y};if(!run)start()}
  function start(){if(over||!sn)reset();if(run){run=false;clearInterval(loop);$('#sg',body).textContent='▶ Weiter';draw();return}
    run=true;$('#sg',body).textContent='⏸ Pause';clearInterval(loop);loop=setInterval(step,Math.max(60,130-score*3))}
  $('#sg',body).onclick=start;
  $$('[data-d]',body).forEach(b=>b.onclick=()=>{const[x,y]=b.dataset.d.split(',').map(Number);turn(x,y)});
  const kd=e=>{if(curApp()!=='snake')return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
    if(m){e.preventDefault();turn(...m)}if(e.key===' '){e.preventDefault();start()}};
  addEventListener('keydown',kd);
  let sx,sy;cv.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};
  cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20){if(!run)start();return}
    Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))};
  reset();
  const ro=new ResizeObserver(fit);ro.observe(body);
  ctx.cleanup.push(()=>{clearInterval(loop);removeEventListener('keydown',kd);ro.disconnect()});
}},

/* ---------- Zeichnen ---------- */
paint:{name:'Zeichnen',cat:'Kreativ',full:true,store:true,icon:'🎨',bg:'linear-gradient(135deg,#f857a6,#ff5858)',w:640,h:500,
render(body,ctx){
  const cols=['#111111','#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de','#ff2d55','#8e8e93'];
  body.innerHTML=`<div class="paint"><div class="ptools">${cols.map((c,i)=>`<button class="sw2 ${i===0?'sel':''}" data-c="${c}" style="background:${c}"></button>`).join('')}
    <input type="range" min="2" max="40" value="6" id="pS" style="width:90px;accent-color:var(--accent)">
    <button class="tb" id="pE">🧽 Radierer</button><button class="tb" id="pC">🗑️ Leeren</button><button class="tb" id="pD">💾 Speichern</button></div>
    <div class="pwrap"><canvas id="pc"></canvas></div></div>`;
  const cv=$('#pc',body),g=cv.getContext('2d'),wrap=$('.pwrap',body);
  let col='#111111',erase=false,drawing=false,last=null;
  function resize(){
    const r=wrap.getBoundingClientRect();if(!r.width||!r.height)return;
    const dpr=devicePixelRatio||1;
    const tmpc=document.createElement('canvas');tmpc.width=cv.width;tmpc.height=cv.height;if(cv.width)tmpc.getContext('2d').drawImage(cv,0,0);
    cv.width=r.width*dpr;cv.height=r.height*dpr;g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle='#fff';g.fillRect(0,0,r.width,r.height);
    if(tmpc.width)g.drawImage(tmpc,0,0,tmpc.width/dpr,tmpc.height/dpr);
  }
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);last=pos(e);line(last,last)};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);line(last,p);last=p};
  cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  function line(a,b){g.strokeStyle=erase?'#fff':col;g.lineWidth=+$('#pS',body).value*(erase?2:1);g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  $$('[data-c]',body).forEach(b=>b.onclick=()=>{col=b.dataset.c;erase=false;$('#pE',body).classList.remove('on');$$('[data-c]',body).forEach(x=>x.classList.toggle('sel',x===b))});
  $('#pE',body).onclick=e=>{erase=!erase;e.currentTarget.classList.toggle('on',erase)};
  $('#pC',body).onclick=()=>{g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height)};
  $('#pD',body).onclick=()=>{const a=document.createElement('a');a.download='NovaOS-Bild.png';a.href=cv.toDataURL('image/png');a.click();notify('🎨','Bild gespeichert','NovaOS-Bild.png','#f857a6')};
  const ro=new ResizeObserver(resize);ro.observe(wrap);
  ctx.cleanup.push(()=>ro.disconnect());
}},

flash:{name:'Taschenlampe',cat:'Werkzeuge',icon:'🔦',bg:'linear-gradient(135deg,#3a3a3c,#111)',full:true,store:true,

/* ---------- Zufall ---------- */
random:{name:'Zufall',cat:'Spaß',icon:'🎲',bg:'linear-gradient(135deg,#ff375f,#bf1d3a)',store:true,
render(body){
  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  let who=[S.name||'Ich','Freund'];
  function draw(){
    body.innerHTML=`<div class="rnd">
      <div class="rbox"><small>Würfel</small><div class="rbig" id="rD">🎲</div><button class="btn primary" id="rDb">Würfeln</button></div>
      <div class="rbox"><small>Münze</small><div class="rbig" id="rC">🪙</div><button class="btn primary" id="rCb">Werfen</button></div>
      <div class="rbox" style="grid-column:1/-1"><small>Wer muss die Quest machen?</small>
        <div style="display:flex;gap:8px;margin:10px 0"><input class="input" id="rA" value="${esc(who[0])}"><input class="input" id="rB" value="${esc(who[1])}"></div>
        <div class="rbig" id="rW" style="font-size:30px;min-height:60px">❓</div><button class="btn primary" id="rWb">Auslosen</button></div>
    </div>`;
    const spin=(el,list,fin,ms=900)=>{let n=0;const iv=setInterval(()=>{el.textContent=list[n++%list.length];el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),60)},70);setTimeout(()=>{clearInterval(iv);el.textContent=fin},ms)};
    $('#rDb',body).onclick=()=>{const v=Math.floor(Math.random()*6);spin($('#rD',body),faces,faces[v]+' '+(v+1))};
    $('#rCb',body).onclick=()=>spin($('#rC',body),['👑','🔢'],Math.random()<.5?'👑 Kopf':'🔢 Zahl');
    $('#rWb',body).onclick=()=>{who=[$('#rA',body).value||'A',$('#rB',body).value||'B'];spin($('#rW',body),who,'👉 '+who[Math.random()<.5?0:1],1300)};
  }
  draw();
}}
};
